<!DOCTYPE html>
<html lang="es-MX">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gracias · Levent</title>
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0B1220">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script>
  // Si el CDN de Tailwind no carga, `tailwind` no existe y esta linea lanzaria
  // un error que ensucia la consola justo cuando se esta depurando el Pixel.
  if (window.tailwind) tailwind.config = {
    theme: {
      extend: {
        colors: { noche: '#0B1220', tinta: '#16233A', acento: '#E0A33E', nieve: '#F7F5F1', humo: '#6B7280' },
        fontFamily: { titulo: ['Fraunces', 'Georgia', 'serif'], ui: ['Inter', 'system-ui', 'sans-serif'] },
      },
    },
  };
</script>
</head>
<body class="flex min-h-screen items-center justify-center bg-noche px-5 font-ui text-nieve">

<!--
  Esta pagina existe por una razon de medicion, no de diseno.

  Meta necesita una URL propia para la conversion: en el Administrador de
  anuncios se configura "conversion personalizada = la URL contiene /gracias" y
  asi la campana se puede optimizar aunque el Pixel de eventos falle. Ademas, el
  visitante que llega aqui ya convirtio, asi que es el mejor momento para
  ofrecerle el segundo paso (WhatsApp), que suele cerrar mas rapido.
-->

<main class="w-full max-w-lg text-center">
  <div class="mx-auto flex h-16 w-16 items-center justify-center rounded-full bg-acento">
    <svg viewBox="0 0 24 24" class="h-8 w-8 stroke-noche" fill="none" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M20 6 9 17l-5-5"/>
    </svg>
  </div>

  <h1 id="titulo" class="mt-7 font-titulo text-4xl font-700 leading-tight"></h1>
  <p id="texto" class="mt-4 text-[15px] leading-relaxed text-nieve/70"></p>

  <a href="#" id="botonWhatsapp"
     class="mt-9 inline-flex items-center gap-2.5 rounded-full bg-[#25D366] px-8 py-4 text-[15px] font-700 text-white transition hover:brightness-105">
    <svg viewBox="0 0 24 24" class="h-5 w-5 fill-white" aria-hidden="true">
      <path d="M12.04 2C6.58 2 2.13 6.45 2.13 11.91c0 1.75.46 3.45 1.32 4.95L2 22l5.25-1.38a9.9 9.9 0 0 0 4.79 1.22h.01c5.46 0 9.91-4.45 9.91-9.91C21.96 6.45 17.5 2 12.04 2zm5.8 14.1c-.25.69-1.44 1.32-1.99 1.4-.53.08-1.2.11-1.94-.12-.45-.14-1.02-.33-1.76-.65-3.1-1.34-5.12-4.46-5.28-4.67-.15-.21-1.26-1.67-1.26-3.19s.8-2.27 1.08-2.58c.28-.31.61-.39.82-.39.2 0 .41 0 .59.01.19.01.44-.07.69.53.25.61.86 2.11.94 2.26.08.15.13.33.03.54-.1.21-.15.33-.3.51-.15.18-.31.4-.45.54-.15.15-.3.31-.13.6.17.29.76 1.25 1.63 2.03 1.12 1 2.06 1.31 2.35 1.46.29.15.46.13.63-.08.17-.2.72-.84.91-1.13.19-.29.38-.24.64-.15.26.1 1.66.78 1.94.92.28.15.47.22.54.34.07.12.07.7-.18 1.39z"/>
    </svg>
    Escribenos por WhatsApp
  </a>

  <p class="mt-8"><a href="/" class="text-[13px] text-nieve/50 underline hover:text-nieve">Volver al inicio</a></p>
</main>

<script src="/meta-tracking.js"></script>
<script>
(function () {
  'use strict';

  var params = new URLSearchParams(window.location.search);
  var pago = params.get('pago');

  fetch('/api/content')
    .then(function (r) { return r.json(); })
    .then(function (c) {
      // Quien llega de pagar necesita un mensaje distinto al de quien solo dejo
      // sus datos: si se le dice "te contactamos" despues de haber pagado,
      // parece que el cobro no se registro.
      if (pago === 'exito') {
        document.getElementById('titulo').textContent = 'Pago recibido';
        document.getElementById('texto').textContent =
          'Gracias por tu compra. Te enviamos la confirmacion y los siguientes pasos. Si necesitas algo, escribenos por WhatsApp.';
      } else if (pago === 'pendiente') {
        document.getElementById('titulo').textContent = 'Tu pago esta en proceso';
        document.getElementById('texto').textContent =
          'Cuando el pago se acredite te lo confirmamos. Si pagaste en efectivo, puede tardar unas horas.';
      } else {
        document.getElementById('titulo').textContent = c.gracias_titulo || 'Listo, ya tenemos tus datos';
        document.getElementById('texto').textContent = c.gracias_texto || '';
      }

      var numero = String(c.whatsapp_numero || '').replace(/\D/g, '');
      var boton = document.getElementById('botonWhatsapp');
      if (!numero) {
        boton.classList.add('hidden');
        return;
      }
      var url = 'https://wa.me/' + numero + '?text=' + encodeURIComponent(c.whatsapp_mensaje || '');
      boton.href = url;
      boton.target = '_blank';
      boton.rel = 'noopener';
      boton.addEventListener('click', function () {
        window.Levent.contactoWhatsApp(url);
      });
    });

  // CompleteRegistration: el registro quedo completo. Se dispara una sola vez
  // por visita; sin esta bandera, recargar la pagina de gracias contaria una
  // conversion extra cada vez.
  if (!sessionStorage.getItem('levent_registro_contado')) {
    sessionStorage.setItem('levent_registro_contado', '1');
    if (pago !== 'exito') {
      // El Purchase de una compra lo manda el servidor desde el webhook de
      // Mercado Pago, no esta pagina: el navegador no sabe si el cobro se
      // aprobo de verdad.
      window.Levent.track('CompleteRegistration', {
        contentName: params.get('de') === 'formulario' ? 'Formulario de campana' : 'Registro',
      });
    }
  }
})();
</script>
</body>
</html>
