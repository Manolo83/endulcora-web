<main class="mx-auto max-w-3xl px-5 py-10">
  <p class="font-titulo text-[11px] tracking-[.3em] text-flama">COMUNIDAD</p>
  <h1 class="mt-2 font-display text-3xl text-vino sm:text-4xl">Publicaciones de Endulcora</h1>
  <p class="mt-3 max-w-xl text-[15px] leading-relaxed text-carbon/70">Comenta las publicaciones del equipo, comparte tus dudas o tus resultados. Solo clientes con cuenta pueden comentar; cualquiera puede leer.</p>

      <button type="submit" class="inline-flex items-center justify-center gap-2 rounded-full boton-vivo bg-vino px-6 py-3 font-ui text-[13px] font-700 uppercase tracking-wider text-crema hover:bg-morado transition">

    <form id="formRegistroComunidad" class="mt-5 hidden grid gap-3">

      <input id="registroEmail" type="email" required placeholder="Correo" class="w-full rounded-xl border border-vino/15 bg-crema/60 px-4 py-3 text-sm">
      <input id="registroTelefono" type="tel" required inputmode="numeric" placeholder="Teléfono (10 dígitos)" class="w-full rounded-xl border border-vino/15 bg-crema/60 px-4 py-3 text-sm">

<script>
function escapeHtml(s){
  return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
document.getElementById('anioFooter').textContent = new Date().getFullYear();

let SESION = { isLoggedIn: false, user: null };

function formatoFecha(iso){
  return new Date(iso).toLocaleString('es-MX', { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' });
}

function tarjetaPublicacion(p){
  const imagenHtml = p.imagen ? `<img src="${p.imagen}" alt="${escapeHtml(p.titulo || '')}" loading="lazy" class="aspect-video w-full object-cover">` : '';
  return `
    <article class="overflow-hidden rounded-3xl bg-white ring-1 ring-vino/10" data-publicacion-id="${p.id}">
      ${imagenHtml}
      <div class="p-5">
        <p class="font-ui text-[11px] uppercase tracking-widest text-humo">${formatoFecha(p.createdAt)}</p>
        <h2 class="mt-1 font-titulo text-xl text-vino">${escapeHtml(p.titulo || '')}</h2>
        ${p.texto ? `<p class="mt-2 whitespace-pre-line text-[15px] text-carbon/80">${escapeHtml(p.texto)}</p>` : ''}

        <div class="mt-5 border-t border-vino/10 pt-4">
          <p class="font-ui text-[11px] font-700 uppercase tracking-widest text-vino/70">Comentarios</p>
          <div class="comentariosPublicacion mt-3 flex flex-col gap-2.5"></div>
          <form class="formComentario mt-3 hidden gap-2 sm:flex">
            <input type="text" maxlength="1000" placeholder="Escribe un comentario…" class="campoComentario w-full rounded-full border border-vino/15 bg-crema/60 px-4 py-2.5 text-sm">
            <button type="submit" class="shrink-0 rounded-full boton-vivo bg-vino px-5 py-2.5 font-ui text-[11px] font-700 uppercase tracking-wider text-crema hover:bg-morado transition">Comentar</button>
          </form>
        </div>
      </div>
    </article>`;
}

function pintarComentarios(cont, items){
  if(!items.length){
    cont.innerHTML = '<p class="text-xs text-carbon/40">Todavía no hay comentarios.</p>';
    return;
  }
  cont.innerHTML = items.map(m => `
    <div class="rounded-xl bg-crema/60 px-4 py-2.5">
      <p class="font-ui text-[10px] uppercase tracking-widest text-humo">${escapeHtml(m.nombre)} · ${formatoFecha(m.createdAt)}</p>
      <p class="mt-0.5 whitespace-pre-line text-sm text-carbon/85">${escapeHtml(m.texto)}</p>
    </div>
  `).join('');
}

async function cargarComentarios(publicacionId, cont){
  try{
    const res = await fetch(`/api/comunidad/publicaciones/${publicacionId}/mensajes`);
    const items = await res.json();
    pintarComentarios(cont, items);
  }catch(e){
    cont.innerHTML = '<p class="text-xs text-carbon/40">No se pudieron cargar los comentarios.</p>';
  }
}

async function cargarPublicaciones(){
  const cont = document.getElementById('publicacionesComunidad');
  try{
    const res = await fetch('/api/comunidad/publicaciones');
    const items = await res.json();
    if(!items.length){
      cont.innerHTML = '<p class="rounded-2xl bg-white p-6 text-center text-sm text-carbon/50 ring-1 ring-vino/10">Todavía no hay publicaciones.</p>';
      return;
    }
    cont.innerHTML = items.map(tarjetaPublicacion).join('');
    cont.querySelectorAll('[data-publicacion-id]').forEach(art => {
      const publicacionId = art.dataset.publicacionId;
      const comentariosCont = art.querySelector('.comentariosPublicacion');
      cargarComentarios(publicacionId, comentariosCont);

      const form = art.querySelector('.formComentario');
      form.classList.toggle('hidden', !SESION.isLoggedIn);
      form.addEventListener('submit', async (e) => {
        e.preventDefault();
        const campo = form.querySelector('.campoComentario');
        const texto = campo.value.trim();
        if(!texto) return;
        try{
          const res = await fetch(`/api/comunidad/publicaciones/${publicacionId}/mensajes`, {
            method: 'POST', headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ texto }),
          });
          const data = await res.json();
          if(!res.ok) throw new Error(data.error || 'No se pudo publicar tu comentario');
          campo.value = '';
          await cargarComentarios(publicacionId, comentariosCont);
        }catch(err){
          alert(err.message);
        }
      });
    });
  }catch(e){
    cont.innerHTML = '<p class="rounded-2xl bg-white p-6 text-center text-sm text-red-600 ring-1 ring-vino/10">No se pudieron cargar las publicaciones.</p>';
  }
}

function actualizarVistaSesion(){
  const bloqueInvitado = document.getElementById('bloqueInvitado');
  const bloqueSesion = document.getElementById('bloqueSesion');
  if(SESION.isLoggedIn){
    bloqueInvitado.classList.add('hidden');
    bloqueSesion.classList.remove('hidden');
    bloqueSesion.classList.add('flex');
    document.getElementById('nombreUsuarioComunidad').textContent = SESION.user.nombre;
  }else{
    bloqueInvitado.classList.remove('hidden');
    bloqueSesion.classList.add('hidden');
    bloqueSesion.classList.remove('flex');
  }
  document.querySelectorAll('.formComentario').forEach(f => f.classList.toggle('hidden', !SESION.isLoggedIn));
}

async function cargarSesion(){
  try{
    const res = await fetch('/api/auth/session');
    const data = await res.json();
    SESION = { isLoggedIn: !!data.isLoggedIn, user: data.user || null };
  }catch(e){
    SESION = { isLoggedIn: false, user: null };
  }
  actualizarVistaSesion();
}

document.getElementById('tabLogin').addEventListener('click', () => {
  document.getElementById('tabLogin').classList.add('border-vino', 'text-vino');
  document.getElementById('tabLogin').classList.remove('border-transparent', 'text-carbon/50');
  document.getElementById('tabRegistro').classList.remove('border-vino', 'text-vino');
  document.getElementById('tabRegistro').classList.add('border-transparent', 'text-carbon/50');
  document.getElementById('formLoginComunidad').classList.remove('hidden');
  document.getElementById('formRegistroComunidad').classList.add('hidden');
});
document.getElementById('tabRegistro').addEventListener('click', () => {
  document.getElementById('tabRegistro').classList.add('border-vino', 'text-vino');
  document.getElementById('tabRegistro').classList.remove('border-transparent', 'text-carbon/50');
  document.getElementById('tabLogin').classList.remove('border-vino', 'text-vino');
  document.getElementById('tabLogin').classList.add('border-transparent', 'text-carbon/50');
  document.getElementById('formRegistroComunidad').classList.remove('hidden');
  document.getElementById('formLoginComunidad').classList.add('hidden');
});

document.getElementById('formLoginComunidad').addEventListener('submit', async (e) => {
  e.preventDefault();
  const err = document.getElementById('loginError');
  const spinner = document.getElementById('loginSpinner');
  err.classList.add('hidden');
  spinner.classList.remove('hidden');
  try{
    const res = await fetch('/api/auth/login', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        email: document.getElementById('loginEmail').value.trim(),
        password: document.getElementById('loginPassword').value,
      }),
    });
    const data = await res.json();
    if(!res.ok) throw new Error(data.error || 'No se pudo iniciar sesión');
    SESION = { isLoggedIn: true, user: data.user };
    actualizarVistaSesion();
  }catch(err2){
    err.textContent = err2.message;
    err.classList.remove('hidden');
  }finally{
    spinner.classList.add('hidden');
  }
});

document.getElementById('formRegistroComunidad').addEventListener('submit', async (e) => {
  e.preventDefault();
  const err = document.getElementById('registroError');
  const spinner = document.getElementById('registroSpinner');
  err.classList.add('hidden');
  spinner.classList.remove('hidden');
  try{
    const res = await fetch('/api/auth/register', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        nombre: document.getElementById('registroNombre').value.trim(),
        email: document.getElementById('registroEmail').value.trim(),
        telefono: document.getElementById('registroTelefono').value.trim(),
        password: document.getElementById('registroPassword').value,
      }),
    });
    const data = await res.json();
    if(!res.ok) throw new Error(data.error || 'No se pudo crear la cuenta');
    SESION = { isLoggedIn: true, user: data.user };
    actualizarVistaSesion();
  }catch(err2){
    err.textContent = err2.message;
    err.classList.remove('hidden');
  }finally{
    spinner.classList.add('hidden');
  }
});

document.getElementById('btnCerrarSesionComunidad').addEventListener('click', async () => {
  try{ await fetch('/api/auth/logout', { method: 'POST' }); }catch(e){}
  SESION = { isLoggedIn: false, user: null };
  actualizarVistaSesion();
});

cargarPublicaciones();
cargarSesion();
</script>
