<script>
  tailwind.config = {
    theme: {
      extend: {
        colors: { carbon: '#1B0720', vino: '#4E1454', uva: '#5C2360', morado: '#7A2E7E', flama: '#F5A623', crema: '#FBF4E9', humo: '#9C9C9C' },
        fontFamily: {
          display: ['"Baloo 2"', 'sans-serif'],
          titulo: ['"Baloo 2"', 'sans-serif'],
          cuerpo: ['Poppins', 'sans-serif'],
          ui: ['Montserrat', 'sans-serif']
        }
      }
    }
  }
</script>
<style>
body { background: #FBF4E9; }
.font-display, .font-titulo { font-weight: 800; }
:focus-visible { outline: 3px solid #F5A623; outline-offset: 3px; }
.campo-registro { width: 100%; border-radius: 0.9rem; border: 1px solid rgba(78,20,84,.18); background: #fff; padding: 0.85rem 1rem; font-size: 1rem; color: #1B0720; }
.campo-registro:focus { border-color: #4E1454; }
</style>

<body class="font-cuerpo text-carbon antialiased">

<main class="mx-auto flex min-h-screen max-w-md flex-col justify-center px-5 py-10">
  <div class="mb-6 text-center">
    <img src="/logo-endulcora.png" alt="Endulcora · Estudio Gastronómico" class="mx-auto h-14 w-auto">
    <div class="mt-3 flex items-center justify-center gap-2">
      <div class="h-6 w-px bg-carbon/15"></div>
      <img src="/levent-icono.png" alt="" class="h-6 w-6 opacity-70">
    </div>
  </div>

  <form id="formRegistro" class="space-y-4 rounded-3xl bg-white p-6 shadow-[0_2px_0_rgba(78,20,84,.06)] ring-1 ring-vino/10 sm:p-8" novalidate>
    <div class="mb-2 text-center">
      <h1 class="font-display text-2xl text-vino">¡Bienvenido!</h1>
      <p class="mt-2 text-sm text-carbon/60">Déjanos tus datos y no te pierdas nada de Endulcora y el grupo.</p>
    </div>

    <input id="campoNombre" name="nombre" type="text" required autocomplete="name" class="campo-registro" placeholder="Tu nombre completo">
    <input id="campoWhatsapp" name="whatsapp" type="tel" required autocomplete="tel" class="campo-registro" placeholder="Tu WhatsApp">
    <input id="campoCorreo" name="correo" type="email" required autocomplete="email" class="campo-registro" placeholder="Tu correo">

    <select id="campoMarcaInteres" name="marcaInteres" class="campo-registro">
      <option value="">¿Qué te interesa? (opcional)</option>
      <option value="Endulcora">Endulcora — repostería y talleres</option>
      <option value="Crenef">Crenef — salud e inhaloterapia</option>
      <option value="Instituto Justo">Instituto Justo</option>
      <option value="Silman">Silman</option>
      <option value="Otro">Otro / no estoy seguro</option>
    </select>

    <div class="space-y-3 pt-2">
      <label class="flex items-start gap-3 text-sm text-carbon/80">
        <input id="campoAceptaPrivacidad" name="aceptaAvisoPrivacidad" type="checkbox" required class="mt-0.5 h-4 w-4 rounded border-vino/30">
        <span>He leído y acepto el <a href="#" onclick="abrirModalPrivacidad(event)" class="text-vino underline">aviso de privacidad</a>, incluyendo que mis datos de contacto pueden compartirse con las demás marcas del grupo Levent para fines de mercadotecnia. *</span>
      </label>
      <label class="flex items-start gap-3 text-sm text-carbon/80">
        <input name="aceptaPromociones" type="checkbox" class="mt-0.5 h-4 w-4 rounded border-vino/30">
        <span>Quiero recibir promociones y novedades por WhatsApp o correo.</span>
      </label>
    </div>

    <p id="errorRegistro" class="hidden rounded-xl bg-red-50 px-4 py-3 text-sm text-red-700"></p>

    <button type="submit" id="btnEnviarRegistro" class="w-full rounded-full bg-vino py-3.5 font-ui text-sm font-700 uppercase tracking-wider text-crema transition hover:bg-uva disabled:opacity-60">
      Registrarme
    </button>
  </form>

  <div id="tarjetaExitoRegistro" class="hidden rounded-3xl bg-vino p-8 text-center text-crema shadow-[0_2px_0_rgba(78,20,84,.06)]">
    <p class="font-display text-2xl">¡Gracias por registrarte!</p>
    <p class="mt-3 text-sm leading-relaxed text-crema/85">Ya quedaste en nuestra lista. Míranos en vivo ahora mismo:</p>
    <a href="/endulcora-en-vivo" class="mt-6 inline-flex items-center gap-2 rounded-full bg-flama px-6 py-3 font-ui text-[12px] font-700 uppercase tracking-wider text-carbon transition hover:brightness-105">Ver la transmisión en vivo</a>
  </div>
</main>

<!-- Modal del aviso de privacidad -->
<div id="modalPrivacidad" class="fixed inset-0 z-[60] hidden items-center justify-center bg-carbon/50 p-4">
  <div class="max-h-[80vh] w-full max-w-lg overflow-y-auto rounded-2xl bg-white p-6">
    <div class="flex items-center justify-between gap-4">
      <h3 class="font-titulo text-xl text-vino">Aviso de privacidad</h3>
      <button type="button" onclick="cerrarModalPrivacidad()" aria-label="Cerrar" class="grid h-8 w-8 shrink-0 place-items-center rounded-full text-carbon/50 hover:bg-vino/10 hover:text-vino">✕</button>
    </div>
    <div id="textoPrivacidad" class="mt-4 space-y-3 text-sm leading-relaxed text-carbon/75"></div>
  </div>
</div>

<script>
function escapeHtml(s){
  return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

async function abrirModalPrivacidad(e){
  if (e) e.preventDefault();
  const modal = document.getElementById('modalPrivacidad');
  modal.classList.remove('hidden');
  modal.classList.add('flex');
  const cont = document.getElementById('textoPrivacidad');
  cont.innerHTML = '<p class="text-carbon/50">Cargando…</p>';
  try{
    const c = await fetch('/api/content').then(r => r.json());
    const texto = c.legal_privacidad || '';
    cont.innerHTML = texto.split('\n\n').map(p => `<p>${escapeHtml(p).replace(/\n/g,'<br>')}</p>`).join('');
  }catch(err){
    cont.innerHTML = '<p class="text-red-600">No se pudo cargar el aviso de privacidad.</p>';
  }
}
function cerrarModalPrivacidad(){
  const modal = document.getElementById('modalPrivacidad');
  modal.classList.add('hidden');
  modal.classList.remove('flex');
}
document.getElementById('modalPrivacidad').addEventListener('click', (e) => {
  if (e.target.id === 'modalPrivacidad') cerrarModalPrivacidad();
});

const form = document.getElementById('formRegistro');
const errorBox = document.getElementById('errorRegistro');
const btnEnviar = document.getElementById('btnEnviarRegistro');

form.addEventListener('submit', async (e) => {
  e.preventDefault();
  errorBox.classList.add('hidden');

  const datos = new FormData(form);
  const cuerpo = {
    nombre: datos.get('nombre'),
    whatsapp: datos.get('whatsapp'),
    correo: datos.get('correo'),
    marcaInteres: datos.get('marcaInteres'),
    aceptaPromociones: datos.get('aceptaPromociones') === 'on',
    aceptaAvisoPrivacidad: datos.get('aceptaAvisoPrivacidad') === 'on',
  };

  btnEnviar.disabled = true;
  btnEnviar.textContent = 'Enviando…';
  try{
    const res = await fetch('/api/registro', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(cuerpo),
    });
    const data = await res.json().catch(() => ({}));
    if (!res.ok) throw new Error(data.error || 'No se pudo enviar tu registro. Intenta de nuevo.');

    form.classList.add('hidden');
    document.getElementById('tarjetaExitoRegistro').classList.remove('hidden');
  }catch(err){
    errorBox.textContent = err.message;
    errorBox.classList.remove('hidden');
    btnEnviar.disabled = false;
    btnEnviar.textContent = 'Registrarme';
  }
});
</script>
</body>
</html>
