<script>
function escapeHtml(s){
  return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
document.getElementById('anioFooter').textContent = new Date().getFullYear();

function toEmbedUrl(url){
  try{
    const u = new URL(url);
    if(u.hostname.includes('youtube.com') || u.hostname === 'youtu.be'){
      let id = u.searchParams.get('v');
      if(!id && u.hostname === 'youtu.be') id = u.pathname.slice(1);
      if(id) return `https://www.youtube.com/embed/${id}`;
    }
    if(u.hostname.includes('vimeo.com')){
      const id = u.pathname.split('/').filter(Boolean).pop();
      if(id) return `https://player.vimeo.com/video/${id}`;
    }
  }catch(e){}
  return url;
}

function tarjetaMedia(m){
  const titulo = m.title ? `<p class="p-4 font-ui text-sm text-vino">${escapeHtml(m.title)}</p>` : '';
  if(m.kind === 'photo'){
    return `<figure class="tarjeta-viva overflow-hidden rounded-2xl bg-white ring-1 ring-vino/10">
      <img src="${m.url}" alt="${escapeHtml(m.title || 'Foto de Endulcora')}" loading="lazy" class="aspect-[4/3] w-full object-cover">
      ${titulo}
    </figure>`;
  }
  if(m.source === 'embed'){
    const embedUrl = toEmbedUrl(m.url);
    return `<figure class="tarjeta-viva overflow-hidden rounded-2xl bg-white ring-1 ring-vino/10">
      <div class="aspect-video w-full"><iframe class="h-full w-full" src="${embedUrl}" title="${escapeHtml(m.title || 'Video de Endulcora')}" loading="lazy" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe></div>
      ${titulo}
    </figure>`;
  }
  return `<figure class="tarjeta-viva overflow-hidden rounded-2xl bg-white ring-1 ring-vino/10">
    <video class="aspect-video w-full bg-black" src="${m.url}" controls preload="metadata"></video>
    ${titulo}
  </figure>`;
}

async function cargarGaleria(){
  const cont = document.getElementById('listaGaleria');
  try{
    const res = await fetch('/api/media');
    const items = await res.json();
    if(!items.length){
      cont.innerHTML = '<p class="text-sm text-carbon/50">Aún no hay fotos ni videos en la galería.</p>';
      return;
    }
    cont.innerHTML = items.map(tarjetaMedia).join('');
  }catch(e){
    cont.innerHTML = '<p class="text-sm text-carbon/50">No se pudo cargar la galería.</p>';
  }
}
cargarGaleria();
</script>
