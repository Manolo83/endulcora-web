<!DOCTYPE html>
<html lang="es-MX">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Confirma tu lugar · Endulcora</title>
<meta name="robots" content="noindex, nofollow">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Poppins:wght@400;500;600;700&family=Bebas+Neue&display=swap" rel="stylesheet">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = {
    theme: {
      extend: {
        colors: { carbon: '#1B0720', vino: '#4E1454', morado: '#7A2E7E', flama: '#F5A623', crema: '#FBF4E9', verde: '#1E7A46' },
        fontFamily: { titulo: ['"Baloo 2"', 'sans-serif'], cuerpo: ['Poppins', 'sans-serif'], numero: ['"Bebas Neue"', 'sans-serif'] }
      }
    }
  }
</script>
<style>
  body { background: #FBF4E9; }
  .spinner { border: 3px solid rgba(0,0,0,.1); border-top-color: #7A2E7E; border-radius: 50%; width: 20px; height: 20px; animation: spin .7s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .bib {
    position: relative;
    background: #F5A623;
    background-image: repeating-linear-gradient(135deg, rgba(255,255,255,.14) 0 10px, transparent 10px 20px);
    border-radius: 16px;
    padding: 22px 18px 24px;
  }
  .bib::before, .bib::after {
    content: ''; position: absolute; width: 16px; height: 16px; border-radius: 50%;
    background: #FBF4E9; top: 10px;
  }
  .bib::before { left: 10px; }
  .bib::after { right: 10px; }
</style>
</head>
<body class="font-cuerpo text-carbon antialiased">

<main class="flex min-h-screen items-center justify-center px-5 py-10">
  <div class="w-full max-w-md rounded-3xl bg-white p-8 text-center shadow-2xl">
    <p class="font-titulo text-[12px] tracking-[.34em] text-morado">ENDULCORA</p>
    <h1 id="titulo" class="mt-1 font-titulo text-2xl tracking-wide text-vino">Confirma tu lugar</h1>

    <!-- Formulario (solo cuando llega del grupo de WhatsApp, sin link personal) -->
    <div id="vistaFormulario" class="hidden">
      <p class="mt-3 text-base text-carbon/70">Clase gratis de Pan de muerto — escribe el correo con el que te registraste para confirmar tu lugar.</p>
      <form id="formBuscar" class="mt-5">
        <input id="correoInput" type="email" required placeholder="tu@correo.com"
          class="w-full rounded-2xl border border-vino/20 bg-crema/60 px-4 py-3.5 text-base">
        <button type="submit" class="mt-4 flex w-full items-center justify-center gap-2 rounded-full bg-vino py-3.5 text-base font-700 text-crema hover:bg-morado transition">
          <span id="spinnerFormulario" class="spinner hidden" style="border-top-color:#FBF4E9"></span>
          CONFIRMO MI LUGAR
        </button>
      </form>
    </div>

    <!-- Cargando (cuando llega del correo personal, con id+token) -->
    <div id="vistaCargando" class="hidden py-6">
      <div class="spinner mx-auto"></div>
      <p class="mt-4 text-base text-carbon/60">Un momento…</p>
    </div>

    <!-- Resultado: ficha con numero de inscrito (confirmado) -->
    <div id="vistaBib" class="hidden">
      <div class="bib mt-4">
        <p class="font-ui text-[10px] font-700 uppercase tracking-[.2em] text-vino">Endulcora · Pan de muerto</p>
        <p id="bibHorario" class="font-titulo text-sm text-vino"></p>
        <p id="bibNumero" class="font-numero leading-none text-carbon" style="font-size:88px;"></p>
        <p id="bibNombre" class="font-700 text-base text-carbon"></p>
      </div>
      <p class="mt-3 text-sm font-700 text-vino">Muestra esta ficha al llegar — es tu pase de entrada.</p>
      <div id="bibDetalle" class="mt-4 rounded-2xl bg-crema/60 p-4 text-sm text-carbon/70 text-left"></div>
      <a id="botonCalendario" href="#" target="_blank" class="mt-5 hidden items-center justify-center gap-2 rounded-full bg-flama px-6 py-3 text-sm font-700 text-vino hover:brightness-95 transition">📅 Agregar a mi calendario</a>
    </div>

    <!-- Resultado: invitacion a transmision en vivo (no viene, o cupo lleno) -->
    <div id="vistaInvitacion" class="hidden">
      <div class="mx-auto mt-2 grid h-14 w-14 place-items-center rounded-full bg-vino text-2xl text-crema">▶</div>
      <p id="invitacionMensaje" class="mt-3 text-base leading-relaxed text-carbon/80"></p>
      <a id="botonClasesEnVivo" href="/clases-en-vivo" class="mt-5 inline-flex items-center justify-center gap-2 rounded-full bg-vino px-6 py-3 text-sm font-700 text-crema hover:bg-morado transition">Ver transmisión en vivo</a>
    </div>

    <p id="error" class="mt-4 hidden rounded-xl bg-red-50 px-4 py-3 text-sm text-red-700"></p>
  </div>
</main>

<script>
function escapeHtml(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}
function formatoFecha(iso) {
  if (!iso) return '';
  const [a, m, d] = iso.split('-').map(Number);
  return new Date(a, m - 1, d).toLocaleDateString('es-MX', { weekday: 'long', day: 'numeric', month: 'long' });
}

async function confirmar(body) {
  const res = await fetch('/api/clase-gratis/confirmar', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(body),
  });
  const data = await res.json();
  if (!res.ok) throw new Error(data.error || 'Algo salió mal');
  return data;
}

function mostrarResultado(data) {
  document.getElementById('vistaFormulario').classList.add('hidden');
  document.getElementById('vistaCargando').classList.add('hidden');
  const titulo = document.getElementById('titulo');

  if (data.resultado === 'confirmado' || data.resultado === 'yaConfirmado') {
    titulo.textContent = '¡Ya quedaste inscrito!';
    document.getElementById('vistaBib').classList.remove('hidden');
    document.getElementById('bibHorario').textContent = data.horario ? `Horario: ${data.horario}` : '';
    document.getElementById('bibNumero').textContent = String(data.numeroInscrito || '').padStart(3, '0');
    document.getElementById('bibNombre').textContent = data.nombre ? `Hola, ${data.nombre}` : '';
    document.getElementById('bibDetalle').innerHTML = `
      ${data.fecha ? `<p>📅 ${escapeHtml(formatoFecha(data.fecha))}</p>` : ''}
      ${data.horario ? `<p class="mt-1">🕐 Horario: ${escapeHtml(data.horario)}</p>` : ''}
      ${data.ubicacion ? `<p class="mt-1">📍 ${escapeHtml(data.ubicacion)}</p>` : ''}
    `;
    if (data.calendarLink) {
      const btn = document.getElementById('botonCalendario');
      btn.href = data.calendarLink;
      btn.classList.remove('hidden');
      btn.classList.add('inline-flex');
    }
    return;
  }

  // 'declinado' | 'yaRespondidoNo' | 'cupoLleno'
  document.getElementById('vistaInvitacion').classList.remove('hidden');
  const mensaje = document.getElementById('invitacionMensaje');
  if (data.resultado === 'cupoLleno') {
    titulo.textContent = 'Ese horario ya se llenó';
    mensaje.textContent = 'Tu horario ya alcanzó su cupo de 100 personas. No te la pierdas: síguela en vivo desde endulcora.com.';
  } else {
    titulo.textContent = 'Gracias por avisarnos';
    mensaje.textContent = 'Quedó anotado que no podrás venir. Te invitamos a ver la Master Class en vivo desde endulcora.com.';
  }
  if (data.linkClasesEnVivo) {
    document.getElementById('botonClasesEnVivo').href = data.linkClasesEnVivo;
  }
}

function mostrarError(msg) {
  document.getElementById('vistaCargando').classList.add('hidden');
  const err = document.getElementById('error');
  err.textContent = msg;
  err.classList.remove('hidden');
}

(function arrancar() {
  const params = new URLSearchParams(location.search);
  const id = params.get('id');
  const token = params.get('token');
  const va = params.get('va') === 'no' ? 'no' : 'si';

  if (id && token) {
    document.getElementById('vistaCargando').classList.remove('hidden');
    confirmar({ id, token, respuesta: va }).then(mostrarResultado).catch((e) => mostrarError(e.message));
    return;
  }

  document.getElementById('vistaFormulario').classList.remove('hidden');
  document.getElementById('formBuscar').addEventListener('submit', async (e) => {
    e.preventDefault();
    const spinner = document.getElementById('spinnerFormulario');
    const err = document.getElementById('error');
    err.classList.add('hidden');
    spinner.classList.remove('hidden');
    try {
      const data = await confirmar({ correo: document.getElementById('correoInput').value.trim(), respuesta: 'si' });
      mostrarResultado(data);
    } catch (e) {
      spinner.classList.add('hidden');
      err.textContent = e.message;
      err.classList.remove('hidden');
    }
  });
})();
</script>
</body>
</html>
