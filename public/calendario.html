<script>
function escapeHtml(s){
  return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
document.getElementById('anioFooter').textContent = new Date().getFullYear();

let NUMERO_WHATSAPP = '5665271901';
fetch('/api/content').then(r => r.json()).then(c => { if(c.whatsapp_numero) NUMERO_WHATSAPP = c.whatsapp_numero; }).catch(()=>{});

let SEDES = [];
let SESIONES = [];
let sedeId = null;
let mesActual = new Date(new Date().getFullYear(), new Date().getMonth(), 1);

const NOMBRES_MES = ['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];
const NOMBRES_DIA = ['Lun','Mar','Mié','Jue','Vie','Sáb','Dom'];
const ESTADO_INFO = {
  disponible: { texto: 'Disponible', clase: 'bg-[#3F8F5F] hover:brightness-110 cursor-pointer' },
  casi_lleno: { texto: 'Casi lleno', clase: 'bg-flama hover:brightness-110 cursor-pointer' },
  agotado: { texto: 'Agotado', clase: 'bg-humo/70 cursor-not-allowed' },
};

async function cargarCalendario(){
  const cont = document.getElementById('calendarioGrid');
  try{
    const res = await fetch('/api/sedes');
    SEDES = await res.json();
    if(!SEDES.length){
      document.getElementById('sedeTabsCalendario').innerHTML = '';
      cont.innerHTML = '<p class="col-span-7 text-sm text-carbon/50">Todavía no hay talleres programados.</p>';
      return;
    }
    sedeId = SEDES[0].id;
    pintarTabsSede();
    await cargarSesiones();
  }catch(e){
    cont.innerHTML = '<p class="col-span-7 text-sm text-carbon/50">No se pudo cargar el calendario.</p>';
  }
}

function pintarTabsSede(){
  document.getElementById('sedeTabsCalendario').innerHTML = SEDES.map(s => `
    <button type="button" data-id="${s.id}" class="btnSede rounded-full px-5 py-2.5 font-ui text-[12px] font-700 uppercase tracking-wider transition ${s.id === sedeId ? 'bg-vino text-crema' : 'border border-vino/20 text-vino hover:border-vino'}">
      ${escapeHtml(s.nombre)}
    </button>`).join('');
  document.querySelectorAll('.btnSede').forEach(btn => {
    btn.addEventListener('click', async () => {
      sedeId = Number(btn.dataset.id);
      pintarTabsSede();
      await cargarSesiones();
    });
  });
  const sedeActual = SEDES.find(s => s.id === sedeId);
  document.getElementById('calendarioTarjeta').style.backgroundImage = sedeActual && sedeActual.imagenFondo ? `url('${sedeActual.imagenFondo}')` : '';
}

async function cargarSesiones(){
  const res = await fetch(`/api/sesiones-taller?sedeId=${sedeId}`);
  SESIONES = await res.json();
  pintarCalendario();
}

document.getElementById('btnMesAnterior').addEventListener('click', () => { mesActual = new Date(mesActual.getFullYear(), mesActual.getMonth() - 1, 1); pintarCalendario(); });
document.getElementById('btnMesSiguiente').addEventListener('click', () => { mesActual = new Date(mesActual.getFullYear(), mesActual.getMonth() + 1, 1); pintarCalendario(); });

function fechaISO(date){
  return `${date.getFullYear()}-${String(date.getMonth()+1).padStart(2,'0')}-${String(date.getDate()).padStart(2,'0')}`;
}

function pintarCalendario(){
  document.getElementById('calendarioMesTexto').textContent = `${NOMBRES_MES[mesActual.getMonth()]} ${mesActual.getFullYear()}`;
  const anio = mesActual.getFullYear();
  const mes = mesActual.getMonth();
  const primerDia = new Date(anio, mes, 1);
  const diasEnMes = new Date(anio, mes + 1, 0).getDate();
  const offset = (primerDia.getDay() + 6) % 7;

  const sesionesPorFecha = {};
  SESIONES.forEach(s => { (sesionesPorFecha[s.fecha] = sesionesPorFecha[s.fecha] || []).push(s); });

  let celdas = NOMBRES_DIA.map(d => `<div class="pb-1 text-center font-ui text-[10px] font-700 uppercase tracking-wider text-carbon/40">${d}</div>`).join('');
  for(let i = 0; i < offset; i++) celdas += '<div></div>';

  const hoy = new Date();
  const esMismoMes = hoy.getFullYear() === anio && hoy.getMonth() === mes;
  const fechaISOHoy = fechaISO(hoy);

  for(let dia = 1; dia <= diasEnMes; dia++){
    const fecha = `${anio}-${String(mes+1).padStart(2,'0')}-${String(dia).padStart(2,'0')}`;
    const sesiones = (sesionesPorFecha[fecha] || []).sort((a,b) => (a.orden ?? 0) - (b.orden ?? 0));
    const esHoy = esMismoMes && hoy.getDate() === dia;
    const esPasado = fecha < fechaISOHoy;
    const chips = sesiones.map(s => {
      const info = esPasado ? ESTADO_INFO.agotado : (ESTADO_INFO[s.estado] || ESTADO_INFO.disponible);
      const accion = (esPasado || s.estado === 'agotado') ? '' : `data-sesion="${s.id}"`;
      const etiqueta = esPasado ? 'No disponible' : info.texto;
      return `<button type="button" ${accion} class="chipSesion w-full truncate rounded-md px-1.5 py-1 text-left text-[10px] leading-tight text-crema transition ${info.clase}" title="${escapeHtml(s.titulo)} · ${etiqueta}">${escapeHtml(s.titulo)}</button>`;
    }).join('');
    celdas += `
      <div class="min-h-[64px] rounded-lg border p-1.5 sm:min-h-[84px] ${esHoy ? 'border-flama bg-[#FDF1D8]' : 'border-vino/10 bg-white/90'}">
        <span class="inline-flex h-5 min-w-[20px] items-center justify-center rounded-full bg-flama/25 px-1 font-ui text-[10px] font-700 text-vino">${dia}</span>
        <div class="mt-1 space-y-1">${chips}</div>
      </div>`;
  }

  document.getElementById('calendarioGrid').innerHTML = celdas;
  document.querySelectorAll('.chipSesion[data-sesion]').forEach(btn => {
    btn.addEventListener('click', () => registrarTallerWhatsApp(Number(btn.dataset.sesion)));
  });
}

function registrarTallerWhatsApp(sesionId){
  const sesion = SESIONES.find(s => s.id === sesionId);
  const sede = SEDES.find(s => s.id === sedeId);
  if(!sesion) return;
  const fechaLegible = new Date(sesion.fecha + 'T00:00:00').toLocaleDateString('es-MX', { day: 'numeric', month: 'long', year: 'numeric' });
  const mensaje = `Hola, quiero apartar mi lugar en el taller "${sesion.titulo}" del ${fechaLegible}${sede ? ` en la sede ${sede.nombre}` : ''}.`;
  window.open(`https://wa.me/52${NUMERO_WHATSAPP}?text=${encodeURIComponent(mensaje)}`, '_blank');
}

cargarCalendario();
</script>
