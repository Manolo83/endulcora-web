<script>
function toggleMenu(){
  const m = document.getElementById('menuMovil');
  const b = document.getElementById('btnMenu');
  const abierto = m.classList.toggle('hidden') === false;
  b.setAttribute('aria-expanded', abierto);
}
function escapeHtml(s){
  return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
document.getElementById('anioFooter').textContent = new Date().getFullYear();

function tarjetaCTA(p){
  if(p.productoRelacionado){
    return `<div class="mt-10 rounded-3xl bg-vino p-6 text-crema sm:p-8">
      <p class="font-ui text-[11px] font-700 uppercase tracking-widest text-flama">¿Quieres la receta completa?</p>
      <h2 class="mt-2 font-display text-xl">${escapeHtml(p.productoRelacionado.titulo)}</h2>
      <a href="/${p.productoRelacionado.prefijo}/${p.productoRelacionado.slug}" class="mt-4 inline-flex items-center gap-2 rounded-full boton-vivo bg-flama px-6 py-3 font-ui text-[13px] font-700 uppercase tracking-wider text-carbon hover:bg-crema transition">Ver producto</a>
    </div>`;
  }
  return `<div class="mt-10 rounded-3xl bg-vino p-6 text-crema sm:p-8">
    <p class="font-ui text-[11px] font-700 uppercase tracking-widest text-flama">¿Te gustó esta receta?</p>
    <h2 class="mt-2 font-display text-xl">Con la membresía Endulcora tienes una nueva cada mes</h2>
    <a href="/membresia" class="mt-4 inline-flex items-center gap-2 rounded-full boton-vivo bg-flama px-6 py-3 font-ui text-[13px] font-700 uppercase tracking-wider text-carbon hover:bg-crema transition">Conocer la membresía</a>
  </div>`;
}

async function cargarPost(){
  const cont = document.getElementById('articuloBlog');
  const slug = window.location.pathname.split('/').filter(Boolean).pop();
  try{
    const res = await fetch(`/api/blog/${slug}`);
    const p = await res.json();
    if(!res.ok) throw new Error(p.error || 'No se encontró esta entrada.');
    const fecha = new Date(p.createdAt).toLocaleDateString('es-MX', { day: 'numeric', month: 'long', year: 'numeric' });
    cont.innerHTML = `
      ${p.imagen ? `<img src="${p.imagen}" alt="${escapeHtml(p.titulo)}" class="aspect-[16/9] w-full rounded-2xl object-cover">` : ''}
      <p class="mt-6 font-ui text-[11px] uppercase tracking-widest text-humo">${fecha}</p>
      <h1 class="mt-1 font-display text-3xl leading-tight text-vino">${escapeHtml(p.titulo)}</h1>
      <div class="mt-6 whitespace-pre-line text-[15px] leading-relaxed text-carbon/80">${escapeHtml(p.contenido)}</div>
      ${tarjetaCTA(p)}
    `;
  }catch(e){
    cont.innerHTML = `<p class="text-sm text-red-600">${escapeHtml(e.message)}</p>`;
  }
}
cargarPost();

async function cargarLeadmagnetTexto(){
  try{
    const res = await fetch('/api/content');
    const c = await res.json();
    if(c.leadmagnet_descripcion) document.getElementById('leadmagnetTexto').textContent = c.leadmagnet_descripcion;
  }catch(e){}
}
cargarLeadmagnetTexto();

document.getElementById('btnSuscribirBlog').addEventListener('click', async () => {
  const input = document.getElementById('correoBlog');
  const msg = document.getElementById('suscribirBlogMsg');
  const spinner = document.getElementById('suscribirBlogSpinner');
  const correo = input.value.trim();
  if(!correo){ return; }
  spinner.classList.remove('hidden');
  msg.classList.add('hidden');
  try{
    const res = await fetch('/api/newsletter/suscribir', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ email: correo }),
    });
    const data = await res.json();
    if(!res.ok) throw new Error(data.error || 'No se pudo suscribir.');
    input.value = '';
    msg.textContent = '¡Listo! Revisa tu correo.';
    msg.className = 'mt-2 text-xs text-morado';
  }catch(e){
    msg.textContent = e.message;
    msg.className = 'mt-2 text-xs text-red-600';
  }finally{
    spinner.classList.add('hidden');
  }
});
</script>
