<style>
body { background: #FBF4E9; }
.font-display, .font-titulo { font-weight: 800; }
:focus-visible { outline: 3px solid #F5A623; outline-offset: 3px; }
.campo-sala { width: 100%; border-radius: 0.9rem; border: 1px solid rgba(78,20,84,.18); background: #fff; padding: 0.85rem 1rem; font-size: 1rem; color: #1B0720; }

<body class="font-cuerpo text-carbon antialiased">

<header class="border-b border-vino/10 bg-crema py-4">
  <div class="mx-auto flex max-w-md items-center justify-center px-5">
    <img src="/logo-endulcora.png" alt="Endulcora · Estudio Gastronómico" class="h-10 w-auto">
  </div>
</header>

<main class="mx-auto max-w-md px-5 py-10">
  <div class="rounded-3xl bg-white p-6 shadow-[0_2px_0_rgba(78,20,84,.06)] ring-1 ring-vino/10 sm:p-8">
    <div class="text-center">
      <h1 class="font-display text-2xl text-vino">Recetario Pan de Muerto</h1>
      <p class="mt-2 text-sm text-carbon/60">El PDF completo de la receta de hoy, paso a paso.</p>
      <p id="precioRecetarioSala" class="mt-4 font-display text-3xl text-vino">—</p>
    </div>

    <label class="mt-6 block">
      <span class="mb-1.5 block text-xs font-600 text-carbon/60">Tu correo (ahí te mandamos el PDF)</span>
      <input id="correoCompraSuelta" type="email" placeholder="tu@correo.com" class="campo-sala">
    </label>

    <p id="errorRecetarioSala" class="mt-3 hidden text-xs text-red-600"></p>

    <button type="button" id="btnComprarRecetarioSala" class="mt-5 w-full rounded-full bg-vino py-3.5 font-ui text-sm font-700 uppercase tracking-wider text-crema transition hover:bg-uva disabled:opacity-60">Comprar recetario</button>
    <p class="mt-3 text-center font-ui text-[11px] uppercase tracking-widest text-carbon/35">Pago seguro con Mercado Pago</p>
  </div>
</main>

<footer class="mt-6 pb-10">
  <div class="mx-auto max-w-md px-5 text-center">
    <p class="font-ui text-[11px] uppercase tracking-widest text-carbon/35">© <span id="anioFooter"></span> Endulcora · Ciudad de México</p>
  </div>
</footer>

<script>
document.getElementById('anioFooter').textContent = new Date().getFullYear();

function abrirCheckoutVentana(url){
  const ancho = 460, alto = 720;
  const izquierda = (window.screen.width - ancho) / 2;
  const arriba = (window.screen.height - alto) / 2;
  const ventana = window.open(url, 'mp_checkout', `width=${ancho},height=${alto},left=${izquierda},top=${arriba}`);
  if(!ventana) window.location.href = url;
}

async function prellenarCorreoSesion(){
  try{
    const res = await fetch('/api/auth/session');
    const sesion = await res.json();
    if(sesion.isLoggedIn && sesion.user && sesion.user.email){
      document.getElementById('correoCompraSuelta').value = sesion.user.email;
    }
  }catch(e){}
}
prellenarCorreoSesion();

let RECETARIO_SALA = null;

async function cargarRecetarioSala(){
  const btn = document.getElementById('btnComprarRecetarioSala');
  try{
    const productos = await fetch('/api/products').then(r => r.json());
    RECETARIO_SALA = productos.find(p => p.titulo === 'Recetario Pan de Muerto') || null;
    if(RECETARIO_SALA){
      document.getElementById('precioRecetarioSala').textContent = `$${RECETARIO_SALA.precio} MXN`;
    }else{
      document.getElementById('precioRecetarioSala').textContent = 'Próximamente';
      btn.disabled = true;
    }
  }catch(e){
    document.getElementById('precioRecetarioSala').textContent = 'No disponible';
    btn.disabled = true;
  }
}
cargarRecetarioSala();

document.getElementById('btnComprarRecetarioSala').addEventListener('click', async () => {
  if(!RECETARIO_SALA) return;
  const errorBox = document.getElementById('errorRecetarioSala');
  const btn = document.getElementById('btnComprarRecetarioSala');
  errorBox.classList.add('hidden');
  const correo = document.getElementById('correoCompraSuelta').value.trim();
  if(!correo){
    errorBox.textContent = 'Escribe tu correo para poder mandarte el recetario.';
    errorBox.classList.remove('hidden');
    return;
  }
  const textoOriginal = btn.textContent;
  btn.disabled = true;
  btn.textContent = 'Procesando…';
  try{
    if(typeof fbq === 'function') fbq('track', 'InitiateCheckout', { content_name: 'Recetario Pan de Muerto' });
    const res = await fetch('/api/checkout/preference', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ items: [{ tipo: 'producto', id: RECETARIO_SALA.id, cantidad: 1 }], email: correo }),
    });
    const data = await res.json();
    if(!res.ok) throw new Error(data.error || 'No se pudo iniciar el pago.');
    btn.disabled = false;
    btn.textContent = textoOriginal;
    abrirCheckoutVentana(data.url);
  }catch(e){
    errorBox.textContent = e.message;
    errorBox.classList.remove('hidden');
    btn.disabled = false;
    btn.textContent = textoOriginal;
  }
});
</script>
