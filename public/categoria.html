<script>
function toggleMenu(){
  const m = document.getElementById('menuMovil');
  const b = document.getElementById('btnMenu');
  const abierto = m.classList.toggle('hidden') === false;
  b.setAttribute('aria-expanded', abierto);
}
function escapeHtml(s){
  return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function formatoMonto(n){
  return Number(String(n).replace(/,/g,'')).toLocaleString('es-MX');
}
document.getElementById('anioFooter').textContent = new Date().getFullYear();

const PREFIJO_POR_CATEGORIA = { ebook: 'ebooks', anexo: 'anexos', recetario: 'recetarios' };
const INFO_CATEGORIA = {
  tienda: { titulo: 'Tienda', desc: 'Todo lo que tenemos para vender: eBooks y anexos.', filtro: null },
  ebooks: { titulo: 'eBooks', desc: 'Manuales técnicos completos, listos para descargar.', filtro: 'ebook' },
  anexos: { titulo: 'Anexos', desc: 'Hojas de cálculo de costeo, listas para usar.', filtro: 'anexo' },
};

const seg = window.location.pathname.replace(/^\/|\/$/g, '') || 'tienda';
const info = INFO_CATEGORIA[seg] || INFO_CATEGORIA.tienda;

document.getElementById('tituloPagina').textContent = `${info.titulo} · Endulcora`;
document.getElementById('metaDescripcion').setAttribute('content', info.desc);
document.getElementById('linkCanonico').setAttribute('href', `https://www.endulcora.com/${seg}`);
document.getElementById('ogUrl').setAttribute('content', `https://www.endulcora.com/${seg}`);
document.getElementById('ogTitulo').setAttribute('content', `${info.titulo} · Endulcora`);
document.getElementById('ogDescripcion').setAttribute('content', info.desc);
document.getElementById('h1Categoria').textContent = info.titulo;
document.getElementById('descripcionCategoria').textContent = info.desc;

function actualizarBadgeCarrito(){
  let carrito = [];
  try{ carrito = JSON.parse(localStorage.getItem('endulcora_carrito') || '[]'); }catch(e){ carrito = []; }
  const total = carrito.reduce((a, i) => a + i.cantidad, 0);
  const badge = document.getElementById('carritoBadge');
  badge.textContent = total;
  badge.classList.toggle('hidden', !total);
}
actualizarBadgeCarrito();

function tarjetaProducto(p){
  const imagenEstilo = p.imagen ? `background-image:url('${p.imagen}');background-size:cover;background-position:center;` : '';
  const anteriorNum = parseFloat(String(p.precioAnterior || '').replace(/,/g, ''));
  const anteriorPrecio = Number.isFinite(anteriorNum) && anteriorNum > 0 ? `<span class="pb-1 text-sm text-humo line-through">$${formatoMonto(anteriorNum)}</span>` : '';
  const destacado = p.destacado ? `<span class="absolute right-5 top-5 rounded-full bg-flama px-3 py-1 font-ui text-[10px] font-700 uppercase tracking-widest text-carbon">${escapeHtml(p.destacado)}</span>` : '';
  const subtitulo = p.subtitulo ? `<p class="relative mt-2 font-firma text-xl text-flama">${escapeHtml(p.subtitulo)}</p>` : '';
  const prefijo = PREFIJO_POR_CATEGORIA[p.categoria] || 'tienda';
  const href = p.slug ? `/${prefijo}/${p.slug}` : '/tienda';
  return `
    <a href="${href}" class="reveal visible tarjeta-viva group flex flex-col overflow-hidden rounded-3xl bg-white shadow-[0_2px_0_rgba(78,20,84,.08)] ring-1 ring-vino/10">
      <div class="relative aspect-[4/3] bg-gradient-to-br from-vino to-uva p-7" style="${imagenEstilo}">
        <div class="absolute inset-0 bg-gradient-to-t from-black/80 via-black/45 to-black/30"></div>
        ${destacado}
        <p class="relative font-titulo text-[11px] tracking-[.3em] text-flama">${escapeHtml(p.etiqueta || '')}</p>
        <h3 class="relative mt-2 font-display text-2xl leading-tight text-crema">${escapeHtml(p.titulo || '')}</h3>
        ${subtitulo}
        <p class="absolute bottom-6 left-7 right-7 font-ui text-[10px] uppercase tracking-[.2em] text-crema/80">${escapeHtml(p.descripcionCorta || '')}</p>
      </div>
      <div class="flex flex-1 flex-col p-7">
        <div class="flex items-end gap-3">
          <span class="font-display text-3xl text-vino">$${formatoMonto(p.precio || '0')}</span>
          ${anteriorPrecio}
          <span class="pb-1 font-ui text-[11px] uppercase tracking-wider text-humo">MXN</span>
        </div>
        <span class="mt-5 inline-flex w-full items-center justify-center rounded-full boton-vivo bg-vino py-3.5 font-ui text-[13px] font-700 uppercase tracking-wider text-crema transition group-hover:bg-morado">
          Ver detalles
        </span>
      </div>
    </a>`;
}

let TODOS = [];

function pintar(){
  const q = document.getElementById('buscador').value.trim().toLowerCase();
  // Los productos que forman parte de algún paquete no se muestran como
  // tarjetas propias en el catálogo: solo se compran dentro de la página
  // del paquete, al final, como opción individual.
  const componentesDePaquete = new Set();
  TODOS.forEach(p => {
    if(p.esPaquete) (p.productosRelacionados || []).forEach(id => componentesDePaquete.add(id));
  });
  let items = TODOS.filter(p => !componentesDePaquete.has(p.id) && !p.ocultoEnCatalogo);
  if(info.filtro) items = items.filter(p => (p.categoria || 'ebook') === info.filtro);
  if(q){
    items = items.filter(p => `${p.titulo || ''} ${p.subtitulo || ''} ${p.etiqueta || ''} ${p.descripcionCorta || ''}`.toLowerCase().includes(q));
  }
  const cont = document.getElementById('listaProductos');
  if(!items.length){
    cont.innerHTML = `<p class="text-sm text-carbon/50">${q ? `Sin resultados para "${escapeHtml(q)}".` : 'Todavía no hay productos publicados.'}</p>`;
    return;
  }
  cont.innerHTML = items.map(tarjetaProducto).join('');
}

async function cargar(){
  try{
    const res = await fetch('/api/products');
    TODOS = await res.json();
  }catch(e){
    TODOS = [];
  }
  pintar();
}
document.getElementById('buscador').addEventListener('input', pintar);
cargar();
</script>
