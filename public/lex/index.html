<!DOCTYPE html>
<html lang="es-MX">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Portal de Lex · Endulcora</title>
<meta name="robots" content="noindex, nofollow">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = {
    theme: {
      extend: {
        colors: { carbon: '#1B0720', vino: '#4E1454', morado: '#7A2E7E', flama: '#F5A623', crema: '#FBF4E9', verde: '#1E7A46' },
        fontFamily: { titulo: ['"Baloo 2"', 'sans-serif'], cuerpo: ['Poppins', 'sans-serif'] }
      }
    }
  }
</script>
<style>
  body { background: #FBF4E9; }
  .spinner { border: 3px solid rgba(0,0,0,.1); border-top-color: #7A2E7E; border-radius: 50%; width: 20px; height: 20px; animation: spin .7s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .tarjeta-taller:hover { transform: translateY(-2px); box-shadow: 0 10px 24px rgba(78,20,84,.12); }
  .tarjeta-taller { transition: transform .15s ease, box-shadow .15s ease; }
</style>
</head>
<body class="font-cuerpo text-carbon antialiased">

<!-- ---------- CÓDIGO DE ENTRADA ---------- -->
<section id="vistaCodigo" class="flex min-h-screen items-center justify-center bg-carbon px-5">
  <form id="formCodigo" class="w-full max-w-sm rounded-3xl bg-white p-8 text-center shadow-2xl">
    <p class="font-titulo text-[12px] tracking-[.34em] text-morado">ENDULCORA</p>
    <h1 class="mt-1 font-titulo text-3xl tracking-wide text-vino">Portal de Lex</h1>
    <p class="mt-3 text-base text-carbon/60">Escribe tu código para entrar.</p>
    <input id="codigoInput" type="text" inputmode="numeric" autofocus required
      class="mt-6 w-full rounded-2xl border border-vino/20 bg-crema/60 px-4 py-4 text-center text-3xl tracking-[.3em] font-700">
    <button type="submit" class="mt-6 flex w-full items-center justify-center gap-2 rounded-full bg-vino py-4 text-lg font-700 text-crema hover:bg-morado transition">
      <span id="codigoSpinner" class="spinner hidden" style="border-top-color:#FBF4E9"></span>
      Entrar
    </button>
    <p id="codigoError" class="mt-4 hidden rounded-xl bg-red-50 px-4 py-3 text-base text-red-700"></p>
  </form>
</section>

<!-- ---------- LISTA DE TALLERES ---------- -->
<section id="vistaTalleres" class="hidden min-h-screen">
  <header class="sticky top-0 z-10 border-b border-vino/10 bg-white/90 backdrop-blur">
    <div class="mx-auto max-w-5xl px-5 py-6">
      <p class="font-titulo text-[11px] tracking-[.34em] text-morado">ENDULCORA</p>
      <h1 class="font-titulo text-3xl tracking-wide text-vino">Talleres</h1>
      <div id="tabsSede" class="mt-4 flex flex-wrap gap-2"></div>
    </div>
  </header>
  <main class="mx-auto max-w-5xl px-5 py-6">
    <div id="listaTalleres" class="grid grid-cols-1 gap-4 sm:grid-cols-2"></div>
    <p id="sinTalleres" class="hidden py-10 text-center text-lg text-carbon/50">No hay talleres próximos en esta sede.</p>
  </main>
</section>

<!-- ---------- DETALLE DE UN TALLER ---------- -->
<section id="vistaDetalle" class="hidden min-h-screen">
  <header class="sticky top-0 z-10 border-b border-vino/10 bg-white/90 backdrop-blur">
    <div class="mx-auto max-w-5xl px-5 py-6">
      <button id="btnVolver" type="button" class="font-700 text-vino hover:underline">&larr; Talleres</button>
      <h1 id="tituloDetalle" class="mt-2 font-titulo text-3xl tracking-wide text-vino"></h1>
      <p id="subtituloDetalle" class="mt-1 text-lg text-carbon/60"></p>
    </div>
  </header>
  <main class="mx-auto max-w-5xl px-5 py-6">
    <div id="listaInscritos" class="space-y-4"></div>
    <p id="sinInscritos" class="hidden py-10 text-center text-lg text-carbon/50">Todavía nadie se ha inscrito a este taller.</p>
  </main>
</section>

<div id="toast" class="fixed bottom-6 left-1/2 z-50 hidden -translate-x-1/2 rounded-full bg-carbon px-6 py-3 text-base text-crema shadow-xl"></div>

<script>
const $ = (id) => document.getElementById(id);
function toast(msg) {
  const t = $('toast');
  t.textContent = msg;
  t.classList.remove('hidden');
  clearTimeout(toast._t);
  toast._t = setTimeout(() => t.classList.add('hidden'), 2600);
}
function escapeHtml(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}
async function api(path, options = {}) {
  const res = await fetch(`/lex${path}`, {
    ...options,
    headers: { 'Content-Type': 'application/json', ...(options.headers || {}) },
  });
  if (!res.ok) {
    const data = await res.json().catch(() => ({}));
    throw new Error(data.error || 'Algo salió mal');
  }
  return res.json();
}

function mostrarVista(id) {
  ['vistaCodigo', 'vistaTalleres', 'vistaDetalle'].forEach((v) => $(v).classList.toggle('hidden', v !== id));
}

// ---------- Código de entrada ----------
$('formCodigo').addEventListener('submit', async (e) => {
  e.preventDefault();
  const spinner = $('codigoSpinner');
  const error = $('codigoError');
  error.classList.add('hidden');
  spinner.classList.remove('hidden');
  try {
    await api('/codigo', { method: 'POST', body: JSON.stringify({ codigo: $('codigoInput').value.trim() }) });
    cargarTalleres();
  } catch (e) {
    error.textContent = e.message;
    error.classList.remove('hidden');
  } finally {
    spinner.classList.add('hidden');
  }
});

// ---------- Lista de talleres ----------
let talleresCache = [];
let sedeActiva = 'todas';

async function cargarTalleres() {
  mostrarVista('vistaTalleres');
  const data = await api('/api/talleres');
  talleresCache = data.talleres;
  const sedes = [...new Set(talleresCache.map((t) => t.sede).filter(Boolean))];
  $('tabsSede').innerHTML = ['todas', ...sedes].map((s) => `
    <button type="button" data-sede="${escapeHtml(s)}"
      class="tabSede rounded-full border px-5 py-2.5 text-base font-600 transition ${s === sedeActiva ? 'border-vino bg-vino text-crema' : 'border-vino/20 text-vino hover:border-vino'}">
      ${s === 'todas' ? 'Todas' : escapeHtml(s)}
    </button>`).join('');
  $('tabsSede').querySelectorAll('.tabSede').forEach((btn) => {
    btn.addEventListener('click', () => { sedeActiva = btn.dataset.sede; pintarTalleres(); });
  });
  pintarTalleres();
}

function pintarTalleres() {
  $('tabsSede').querySelectorAll('.tabSede').forEach((btn) => {
    const activo = btn.dataset.sede === sedeActiva;
    btn.className = `tabSede rounded-full border px-5 py-2.5 text-base font-600 transition ${activo ? 'border-vino bg-vino text-crema' : 'border-vino/20 text-vino hover:border-vino'}`;
  });
  const lista = sedeActiva === 'todas' ? talleresCache : talleresCache.filter((t) => t.sede === sedeActiva);
  $('sinTalleres').classList.toggle('hidden', lista.length > 0);
  $('listaTalleres').innerHTML = lista.map((t) => {
    const faltan = t.totalInscritos - t.totalLiquidados;
    return `
    <button type="button" data-id="${t.id}" class="tarjeta-taller rounded-2xl bg-white p-5 text-left shadow ring-1 ring-vino/10">
      <p class="text-sm font-600 uppercase tracking-wider text-morado">${escapeHtml(t.sede)} · ${escapeHtml(formatoFecha(t.fecha))}</p>
      <h2 class="mt-1 font-titulo text-2xl text-vino">${escapeHtml(t.titulo)}</h2>
      <p class="mt-1 text-base text-carbon/60">${t.horario === 'tarde' ? '4:00 pm' : '10:00 am'}</p>
      <div class="mt-3 flex flex-wrap gap-2">
        <span class="rounded-full bg-crema px-3 py-1 text-sm font-600 text-carbon/70">${t.totalInscritos} inscrito${t.totalInscritos === 1 ? '' : 's'}</span>
        ${faltan > 0 ? `<span class="rounded-full bg-flama/20 px-3 py-1 text-sm font-600 text-vino">${faltan} por liquidar</span>` : ''}
        ${t.totalInscritos > 0 && faltan === 0 ? `<span class="rounded-full bg-verde/15 px-3 py-1 text-sm font-600 text-verde">Todos al corriente</span>` : ''}
      </div>
    </button>`;
  }).join('');
  $('listaTalleres').querySelectorAll('.tarjeta-taller').forEach((btn) => {
    btn.addEventListener('click', () => abrirTaller(btn.dataset.id));
  });
}

function formatoFecha(iso) {
  const [a, m, d] = iso.split('-').map(Number);
  return new Date(a, m - 1, d).toLocaleDateString('es-MX', { weekday: 'long', day: 'numeric', month: 'long' });
}

$('btnVolver').addEventListener('click', cargarTalleres);

// ---------- Detalle de un taller ----------
let formasPagoCache = [];
let tallerActualId = null;

async function abrirTaller(id) {
  tallerActualId = id;
  mostrarVista('vistaDetalle');
  $('listaInscritos').innerHTML = '<p class="py-10 text-center text-lg text-carbon/50">Cargando…</p>';
  const data = await api(`/api/talleres/${id}/inscritos`);
  formasPagoCache = data.formasPago;
  $('tituloDetalle').textContent = data.taller.titulo;
  $('subtituloDetalle').textContent = `${data.taller.sede} · ${formatoFecha(data.taller.fecha)} · Precio del taller: $${data.taller.precioTotal || 0}`;
  pintarInscritos(data.inscritos);
}

function pintarInscritos(inscritos) {
  $('sinInscritos').classList.toggle('hidden', inscritos.length > 0);
  $('listaInscritos').innerHTML = inscritos.map((i) => {
    const falta = i.saldo == null ? null : i.saldo;
    const liquidado = i.estadoPago === 'pagado' && (falta || 0) <= 0;
    return `
    <div class="rounded-2xl bg-white p-5 shadow ring-1 ring-vino/10" data-fila="${i.id}">
      <div class="flex flex-wrap items-start justify-between gap-3">
        <div>
          <p class="font-titulo text-xl text-vino">${escapeHtml(i.nombre)}</p>
          <p class="text-base text-carbon/60">${escapeHtml(i.whatsapp)}${i.correo ? ' · ' + escapeHtml(i.correo) : ''}</p>
        </div>
        <span class="rounded-full px-3 py-1 text-sm font-700 ${liquidado ? 'bg-verde/15 text-verde' : 'bg-flama/20 text-vino'}">
          ${liquidado ? 'Liquidado' : (falta != null ? `Falta $${falta}` : 'Sin registrar')}
        </span>
      </div>
      <div class="mt-4 grid grid-cols-1 gap-3 sm:grid-cols-3">
        <label class="block">
          <span class="text-sm font-600 uppercase tracking-wider text-carbon/50">Dio de pago</span>
          <input type="text" inputmode="numeric" class="campoMonto mt-1 w-full rounded-xl border border-vino/15 bg-crema/60 px-3 py-3 text-lg" value="${i.montoPagado || ''}" placeholder="$0">
        </label>
        <label class="block">
          <span class="text-sm font-600 uppercase tracking-wider text-carbon/50">Estado</span>
          <select class="campoEstado mt-1 w-full rounded-xl border border-vino/15 bg-crema/60 px-3 py-3 text-lg">
            <option value="pendiente" ${i.estadoPago === 'pendiente' ? 'selected' : ''}>Pendiente</option>
            <option value="pagado" ${i.estadoPago === 'pagado' ? 'selected' : ''}>Pagado</option>
            <option value="cancelado" ${i.estadoPago === 'cancelado' ? 'selected' : ''}>Cancelado</option>
          </select>
        </label>
        <label class="block">
          <span class="text-sm font-600 uppercase tracking-wider text-carbon/50">Forma de pago</span>
          <select class="campoForma mt-1 w-full rounded-xl border border-vino/15 bg-crema/60 px-3 py-3 text-lg">
            <option value="">—</option>
            ${formasPagoCache.map((f) => `<option value="${escapeHtml(f)}" ${i.formaPago === f ? 'selected' : ''}>${escapeHtml(f)}</option>`).join('')}
          </select>
        </label>
      </div>
      <button type="button" class="btnGuardarPago mt-4 rounded-full bg-vino px-6 py-3 text-base font-700 text-crema hover:bg-morado transition">Guardar</button>
    </div>`;
  }).join('');

  $('listaInscritos').querySelectorAll('[data-fila]').forEach((fila) => {
    fila.querySelector('.btnGuardarPago').addEventListener('click', async () => {
      const id = fila.dataset.fila;
      const montoPagado = fila.querySelector('.campoMonto').value;
      const estadoPago = fila.querySelector('.campoEstado').value;
      const formaPago = fila.querySelector('.campoForma').value;
      try {
        await api(`/api/inscripciones/${id}/pago`, { method: 'PATCH', body: JSON.stringify({ montoPagado, estadoPago, formaPago }) });
        toast('Guardado');
        if (tallerActualId) abrirTaller(tallerActualId);
      } catch (e) {
        toast(e.message);
      }
    });
  });
}

// ---------- Arranque ----------
(async () => {
  try {
    const data = await api('/api/sesion');
    if (data.isLex) cargarTalleres();
    else mostrarVista('vistaCodigo');
  } catch (e) {
    mostrarVista('vistaCodigo');
  }
})();
</script>
</body>
</html>
