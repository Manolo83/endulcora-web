<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pumpkin Spice · Costeo · Endulcora</title>
<style>
:root{--purple:#7A2E7E;--deep:#4E1454;--plum:#A25AA6;--lilac:#C98BCB;--yellow:#F8B818;--cream:#FBF4E9;--ink:#2A1330;--soft:#6B5470;--good:#2E7D57;--ember:#E4572E;--arena:#F1EFE8;--terra:#D85A30}
*{box-sizing:border-box}body{margin:0;font-family:Poppins,system-ui,sans-serif;color:var(--ink);background:var(--cream);display:flex;min-height:100vh}
nav{width:220px;background:var(--deep);color:#fff;padding:18px 12px;flex-shrink:0}nav img.lg{width:130px;margin:0 0 6px 6px}
nav button{display:block;width:100%;text-align:left;background:none;border:0;color:#fff;padding:9px 10px;border-radius:8px;font:inherit;cursor:pointer}
nav button.on,nav button:hover{background:var(--purple)}
.lvb{background:var(--arena);border-radius:8px;padding:8px;margin-top:16px;text-align:center}.lvb small{display:block;color:var(--terra);font-size:9px;letter-spacing:.2em;font-weight:600;margin-bottom:4px}.lvb img{width:120px}
main{flex:1;padding:22px;overflow:auto}h1{color:var(--deep);margin:0 0 14px;font-size:24px}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:16px}
.card{background:#fff;border-radius:12px;padding:14px;box-shadow:0 1px 3px #0001}.card b{display:block;font-size:22px;color:var(--purple)}.card span{font-size:12px;color:var(--soft)}
table{width:100%;border-collapse:collapse;background:#fff;border-radius:10px;overflow:hidden;font-size:13px}th{background:var(--purple);color:#fff;text-align:left;padding:7px}td{padding:6px 7px;border-bottom:1px solid #eee}
td.r,th.r{text-align:right}input,select{font:inherit;padding:5px;border:1px solid #d9c3da;border-radius:6px;background:#FFF8E6}input[type=number]{width:90px}
.thumb{width:70px;height:36px;object-fit:cover;border-radius:5px}.row{display:flex;gap:16px;flex-wrap:wrap;align-items:flex-start}
.btn{background:var(--purple);color:#fff;border:0;border-radius:8px;padding:8px 14px;cursor:pointer;font:inherit}
@media(max-width:760px){body{flex-direction:column}nav{width:100%}}
</style></head><body>

if(!S)S={ins:Object.fromEntries(D0.ins.map(i=>[i.id,{q:i.q,p:i.p}])),neg:JSON.parse(JSON.stringify(D0.neg)),rec:Object.fromEntries(D0.rec.map(r=>[r.n,{pz:r.pz,min:r.min,emp:r.emp,en:r.en}])),prod:{},ventas:[]};
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};
const mx=v=>'$'+(+v).toLocaleString('es-MX',{minimumFractionDigits:2,maximumFractionDigits:2});
// ---- motor (idéntico al Excel) ----
function cu(id){const i=S.ins[id];return i&&i.q?i.p/i.q:0}
function mezcla(k){const B=D0.mz[k];const lote=B.f.reduce((s,[i,q])=>s+q*cu(i),0);return{lote,pg:lote/B.r}}
function peso(n){return D0.lin.filter(l=>l[0]==n&&(l[3]=='g'||l[3]=='ml')).reduce((s,l)=>s+l[2],0)}
function lote(n){return D0.lin.filter(l=>l[0]==n).reduce((s,l)=>s+l[2]*cuL(l[1]),0)}
function cuL(id){if(D0.mz[id])return mezcla(id).pg;if(id[0]==='F'&&/^F\d+$/.test(id)){const n=+id.slice(1);return lote(n)/peso(n)}return cu(id)}
function costo(n){const r=D0.rec.find(x=>x.n==n),e=S.rec[n],N=S.neg;
 const lt=lote(n);
 const ins=lt/e.pz,mo=e.min/e.pz*(N.su/N.hr/60),en=e.en/e.pz,ov=N.gf/N.pm,cb=ins+e.emp+en+mo+ov,tot=cb/(1-N.me);
 const pvp=N.can.map(([c,m])=>Math.ceil(Math.round(tot/(1-m)*1e6)/1e6));
 return{r,lote:lt,ins,mo,en,emp:e.emp,ov,cb,tot,var:(cb-ov)/(1-N.me),pvp}}
window.costo=costo;
const V={
Tablero(){const C=D0.rec.map(r=>costo(r.n)),pv=C.reduce((s,c)=>s+c.pvp[0],0)/C.length,va=C.reduce((s,c)=>s+c.var,0)/C.length,pe=Math.ceil(S.neg.gf/(pv-va));
 const ing=S.ventas.reduce((s,v)=>s+v.pz*v.pr,0),ut=S.ventas.reduce((s,v)=>s+v.pz*(v.pr-costo(v.n).tot),0);
 return`<h1>Tablero</h1><div class="cards"><div class="card"><b>${C.length}</b><span>recetas costeadas</span></div><div class="card"><b>${mx(pv)}</b><span>PVP mostrador promedio</span></div><div class="card"><b>${mx(va)}</b><span>costo variable promedio</span></div><div class="card"><b>${pe}</b><span>piezas/mes para equilibrio (${Math.ceil(pe/26)} al día)</span></div><div class="card"><b>${mx(ing)}</b><span>ingresos registrados</span></div><div class="card"><b>${mx(ut)}</b><span>utilidad registrada</span></div></div><p style="color:var(--soft)">Costos ilustrativos con precios de referencia CDMX 2026. Cámbialos en «Insumos».</p>`},
Calculadora(){const n=+(S.sel||1),c=costo(n),parts=[['Insumos',c.ins,'#7A2E7E'],['Empaque',c.emp,'#C98BCB'],['Energía',c.en,'#F8B818'],['Mano de obra',c.mo,'#A25AA6'],['Overhead',c.ov,'#E4572E'],['Merma',c.tot-c.cb,'#2E7D57']];
 let y=200,svg='';parts.forEach(([k,v,col])=>{const h=Math.max(4,v/c.tot*170);y-=h;svg+=`<rect x="40" y="${y}" width="200" height="${h}" fill="${col}"/><text x="250" y="${y+h/2+4}" font-size="12">${k} ${mx(v)}</text>`});
 return`<h1>Calculadora</h1><select onchange="S.sel=this.value;save();go('Calculadora')">${D0.rec.map(r=>`<option value="${r.n}"${r.n==n?' selected':''}>${r.n}. ${r.t}</option>`).join('')}</select>
 <div class="row" style="margin-top:14px"><svg width="400" height="230" viewBox="0 0 400 230"><title>Rebanada: descomposición del costo</title><path d="M40 30 L240 30 L240 200 L40 200 Z" fill="none"/>${svg}<polygon points="40,${y} 140,${y-24} 240,${y}" fill="#FBF4E9" stroke="#7A2E7E"/><circle cx="140" cy="${y-30}" r="7" fill="#E4572E"/></svg>
 <div class="card" style="min-width:260px"><span>Costo total por ${c.r.u}</span><b>${mx(c.tot)}</b>${S.neg.can.map(([k,m],i)=>`<div>${k} (${Math.round(m*100)} %): <b style="display:inline;font-size:15px">${mx(c.pvp[i])}</b> · utilidad ${mx(c.pvp[i]-c.tot)}</div>`).join('')}
 <hr><label>Piezas <input type="number" value="${S.rec[n].pz}" onchange="S.rec[${n}].pz=+this.value;save();go('Calculadora')"></label><br><label>Min. activos <input type="number" value="${S.rec[n].min}" onchange="S.rec[${n}].min=+this.value;save();go('Calculadora')"></label><br><label>Empaque/pza <input type="number" step="0.1" value="${S.rec[n].emp}" onchange="S.rec[${n}].emp=+this.value;save();go('Calculadora')"></label><br><label>Energía lote <input type="number" value="${S.rec[n].en}" onchange="S.rec[${n}].en=+this.value;save();go('Calculadora')"></label></div></div>`},
'Sub-recetas'(){const subs=[...new Set(D0.lin.filter(l=>/^F\d+$/.test(l[1])).map(l=>+l[1].slice(1)))].sort((a,b)=>a-b);return`<h1>Mezclas y sub-recetas</h1><p>Algunas fórmulas se usan dentro de otras. Su costo por gramo o mililitro sale solo: costo del lote ÷ peso del lote. Si cambias un precio, cambia en todas las recetas que la usan.</p><table><tr><th>Clave</th><th>Nombre</th><th class="r">Costo lote</th><th class="r">Peso lote</th><th class="r">Por kg / L</th></tr>${Object.entries(D0.mz).map(([k,B])=>{const c=mezcla(k);return`<tr><td>${k}</td><td><b>${B.n}</b><br><small>mezcla de especias</small></td><td class="r">${mx(c.lote)}</td><td class="r">${B.r} g</td><td class="r">${mx(c.pg*1000)}</td></tr>`}).join('')}${subs.map(n=>{const r=D0.rec.find(x=>x.n==n),lt=lote(n),p=peso(n);return`<tr><td>F${n}</td><td><b>${r.t}</b><br><small>sub-receta usada en otras fórmulas</small></td><td class="r">${mx(lt)}</td><td class="r">${p.toLocaleString('es-MX')}</td><td class="r">${mx(lt/p*1000)}</td></tr>`}).join('')}</table>`},
Recetas(){return`<h1>Recetas</h1><table><tr><th></th><th>#</th><th>Receta</th><th>Dificultad</th><th class="r">Costo total</th>${S.neg.can.map(c=>`<th class="r">${c[0]}</th>`).join('')}</tr>${D0.rec.map(r=>{const c=costo(r.n);return`<tr><td>${r.th?`<img class="thumb" src="${r.th}" alt="">`:''}</td><td>${r.n}</td><td>${r.t}<br><small>${r.pz} ${r.u} · ${r.uso}</small></td><td>${r.d}</td><td class="r">${mx(c.tot)}</td>${c.pvp.map(p=>`<td class="r">${mx(p)}</td>`).join('')}</tr>`}).join('')}</table>`},
Insumos(){return`<h1>Insumos</h1><table><tr><th>Insumo</th><th>Categoría</th><th>Cantidad comprada</th><th>Precio</th><th class="r">Costo/unidad</th></tr>${D0.ins.map(i=>`<tr><td>${i.n}</td><td>${i.c}</td><td><input type="number" value="${S.ins[i.id].q}" onchange="S.ins['${i.id}'].q=+this.value;save();go('Insumos')"> ${i.u}</td><td><input type="number" step="0.01" value="${S.ins[i.id].p}" onchange="S.ins['${i.id}'].p=+this.value;save();go('Insumos')"></td><td class="r">${mx(cu(i.id))}</td></tr>`).join('')}</table>`},
'Producción'(){let tot=0;const rows=D0.rec.map(r=>{const p=S.prod[r.n]||0,l=p>0?Math.ceil(p/S.rec[r.n].pz):0,c=l*costo(r.n).lote;tot+=c;return`<tr><td>${r.n}. ${r.t}</td><td><input type="number" value="${p}" onchange="S.prod[${r.n}]=+this.value;save();go('Producción')"></td><td>${S.rec[r.n].pz}</td><td>${l}</td><td class="r">${mx(c)}</td></tr>`}).join('');return`<h1>Producción</h1><p>Costo de insumos planeado: <b>${mx(tot)}</b></p><table><tr><th>Receta</th><th>Piezas a producir</th><th>Por lote</th><th>Lotes</th><th class="r">Insumos</th></tr>${rows}</table>`},
Ventas(){return`<h1>Ventas</h1><div class="row"><select id="vn">${D0.rec.map(r=>`<option value="${r.n}">${r.n}. ${r.t}</option>`).join('')}</select><select id="vc">${S.neg.can.map((c,i)=>`<option value="${i}">${c[0]}</option>`).join('')}</select><input id="vp" type="number" placeholder="piezas"><button class="btn" onclick="const n=+vn.value,c=+vc.value;S.ventas.push({f:new Date().toISOString().slice(0,10),n,c,pz:+vp.value||0,pr:costo(n).pvp[c]});save();go('Ventas')">Registrar</button></div><br><table><tr><th>Fecha</th><th>Receta</th><th>Canal</th><th>Piezas</th><th class="r">Ingreso</th><th class="r">Utilidad</th></tr>${S.ventas.map(v=>`<tr><td>${v.f}</td><td>${v.n}</td><td>${S.neg.can[v.c][0]}</td><td>${v.pz}</td><td class="r">${mx(v.pz*v.pr)}</td><td class="r">${mx(v.pz*(v.pr-costo(v.n).tot))}</td></tr>`).join('')}</table>`},
'Mi negocio'(){const N=S.neg,f=(k,l)=>`<tr><td>${l}</td><td><input type="number" step="any" value="${N[k]}" onchange="S.neg.${k}=+this.value;save();go('Mi negocio')"></td></tr>`;return`<h1>Mi negocio</h1><table>${f('gf','Gastos fijos mensuales')}${f('pm','Piezas vendidas al mes')}${f('su','Sueldo mensual de producción')}${f('hr','Horas al mes')}${f('me','% merma (0.08 = 8 %)')}${N.can.map((c,i)=>`<tr><td>Margen ${c[0]}</td><td><input type="number" step="0.01" value="${c[1]}" onchange="S.neg.can[${i}][1]=+this.value;save();go('Mi negocio')"></td></tr>`).join('')}</table><p>Overhead por pieza ${mx(N.gf/N.pm)} · mano de obra ${mx(N.su/N.hr/60)} por minuto.</p>`},
'Mis datos'(){return`<h1>Mis datos</h1><p>Tus datos viven solo en este navegador.</p><button class="btn" onclick="dl('respaldo_pumpkin_spice.json',JSON.stringify(S),'application/json')">Descargar respaldo JSON</button> <button class="btn" onclick="csv()">Exportar precios a CSV</button><br><br><label>Restaurar respaldo <input type="file" onchange="const r=new FileReader();r.onload=e=>{S=JSON.parse(e.target.result);save();go('Tablero')};r.readAsText(this.files[0])"></label><br><br><button class="btn" style="background:var(--ember)" onclick="if(confirm('¿Borrar tus datos?')){localStorage.removeItem(KEY);location.reload()}">Restablecer</button><p style="margin-top:20px;color:var(--terra)">Endulcora · Estudio Gastronómico — en colaboración con Levent.</p>`}};
function dl(n,t,m){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([t],{type:m}));a.download=n;a.click()}
function csv(){const h=['#','Receta','Costo total',...S.neg.can.map(c=>c[0])];dl('precios.csv','﻿'+[h,...D0.rec.map(r=>{const c=costo(r.n);return[r.n,'"'+r.t+'"',c.tot.toFixed(2),...c.pvp]})].map(x=>x.join(',')).join('\n'),'text/csv')}
function go(k){S.view=k;save();document.getElementById('v').innerHTML=V[k]();document.getElementById('menu').innerHTML=Object.keys(V).map(x=>`<button class="${x==k?'on':''}" onclick="go('${x}')">${x}</button>`).join('')}
go(V[S.view]?S.view:'Tablero');
</script></body></html>
