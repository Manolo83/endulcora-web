*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  font-family:'Poppins',system-ui,-apple-system,'Segoe UI',sans-serif; font-weight:300;
  color:var(--ink); background:var(--cream);
  background-image:radial-gradient(1100px 520px at 85% -10%, rgba(248,184,24,.16), transparent 60%),
                   radial-gradient(900px 520px at -10% 0%, rgba(122,46,126,.10), transparent 55%);
  background-attachment:fixed;
  -webkit-font-smoothing:antialiased; font-size:15px; line-height:1.5;
}
h1,h2,h3,h4{margin:0}
button{font-family:inherit}
a{color:var(--purple)}

.shell{display:grid;grid-template-columns:250px 1fr;min-height:100vh}
@media(min-width:901px){.shell{background:linear-gradient(90deg,#3A1520 0 250px,transparent 250px)}}
.shell>*{min-width:0}
.rail{
  background:linear-gradient(180deg,var(--deep) 0%, var(--deep2) 55%, #3A1520 100%);
  color:#fff;padding:20px 14px 26px;position:sticky;top:0;height:100vh;overflow-y:auto;
}
.brand{display:flex;flex-direction:column;gap:10px;padding:6px 8px 18px}
.brand img{width:152px;height:auto;opacity:.97}
.brand .dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--yellow);box-shadow:0 0 10px var(--yellow)}
.brand small{font-weight:600;font-size:9.5px;letter-spacing:.22em;text-transform:uppercase;color:rgba(255,255,255,.62)}
.navlist{display:flex;flex-direction:column;gap:2px;margin-top:4px}
.navbtn{
  display:flex;align-items:center;gap:11px;width:100%;text-align:left;cursor:pointer;
  background:transparent;border:0;color:rgba(255,255,255,.78);padding:10px 12px;border-radius:11px;
  font-size:13.5px;font-weight:400;transition:background .18s,color .18s;
}
.navbtn svg{width:17px;height:17px;flex:none;opacity:.85}
.navbtn:hover{background:rgba(255,255,255,.09);color:#fff}
.navbtn.on{background:rgba(255,255,255,.13);color:#fff;font-weight:500}
.navbtn.on svg{opacity:1;color:var(--yellow)}
.rail-foot{margin-top:22px;padding:12px;border-top:1px solid rgba(255,255,255,.14);font-size:10.5px;color:rgba(255,255,255,.5);line-height:1.6}
.rail-foot b{color:rgba(255,255,255,.78);font-weight:500}

main{padding:26px 30px 90px;max-width:1180px;width:100%;min-width:0}
.page-head{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:14px;margin-bottom:20px}
.eyebrow{font-weight:700;font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--plum);margin-bottom:5px}
h1.title{font-size:34px;line-height:1.06;letter-spacing:-.5px;color:var(--deep);font-weight:600}
.sub{color:var(--ink-soft);font-size:13px;max-width:64ch;margin-top:6px;font-weight:300}

.card{min-width:0;background:var(--card);border-radius:var(--r);box-shadow:var(--sh);padding:20px;border:1px solid rgba(58,29,26,.06)}
.card + .card{margin-top:16px}
.card h3{font-size:11px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--purple);margin-bottom:14px}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
@media(max-width:1000px){.g4{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:640px){.g2,.g3,.g4{grid-template-columns:1fr}}

.kpi{background:var(--card);border-radius:var(--r);padding:16px 18px;box-shadow:var(--sh);border:1px solid rgba(58,29,26,.06);position:relative;overflow:hidden}
.kpi::after{content:'';position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--yellow)}
.kpi .k-l{font-size:9.5px;font-weight:700;letter-spacing:.15em;text-transform:uppercase;color:var(--gray)}
.kpi .k-v{font-size:29px;line-height:1.1;color:var(--deep);margin-top:5px;font-weight:600;letter-spacing:-.5px}
.kpi .k-n{font-size:11px;color:var(--ink-soft);margin-top:2px;font-weight:300}
.kpi.dark{background:linear-gradient(135deg,var(--deep),var(--purple));color:#fff}
.kpi.dark .k-l{color:rgba(255,255,255,.6)} .kpi.dark .k-v{color:#fff} .kpi.dark .k-n{color:rgba(255,255,255,.7)}

label.f{display:block;font-size:9.5px;font-weight:700;letter-spacing:.13em;text-transform:uppercase;color:var(--gray);margin-bottom:5px}
input,select,textarea{
  width:100%;padding:9px 11px;border:1.5px solid var(--line);border-radius:10px;background:var(--cream2);
  font-family:inherit;font-size:14px;color:var(--deep);transition:border-color .15s,background .15s;
}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--purple);background:#fff;box-shadow:0 0 0 3px rgba(179,48,60,.10)}
input[type=range]{padding:0;border:0;background:transparent;accent-color:var(--purple);height:26px}
.field{margin-bottom:12px}
.row{display:flex;gap:10px;flex-wrap:wrap}
.row>.field{flex:1;min-width:120px}
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:7px;cursor:pointer;border:0;border-radius:11px;
  padding:10px 16px;font-weight:700;font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;
  background:var(--purple);color:#fff;transition:transform .12s, box-shadow .18s, background .18s;
  box-shadow:0 6px 16px -8px rgba(179,48,60,.8);
}
.btn:hover{background:var(--deep);transform:translateY(-1px)}
.btn:active{transform:translateY(0)}
.btn.ghost{background:transparent;color:var(--purple);border:1.5px solid var(--line);box-shadow:none}
.btn.ghost:hover{background:rgba(179,48,60,.07);color:var(--deep)}
.btn.gold{background:var(--yellow);color:var(--deep);box-shadow:0 6px 16px -8px rgba(201,162,39,.9)}
.btn.gold:hover{background:var(--amber)}
.btn.sm{padding:7px 11px;font-size:10px;border-radius:9px}
.btn.danger{background:transparent;color:var(--danger);border:1.5px solid rgba(192,57,43,.3);box-shadow:none}
.btn.danger:hover{background:rgba(192,57,43,.08)}
:focus-visible{outline:2.5px solid var(--yellow);outline-offset:2px}

.tw{overflow-x:auto;-webkit-overflow-scrolling:touch;margin:0 -6px;padding:0 6px;max-width:100%}
table{width:100%;border-collapse:collapse;font-size:13px;min-width:520px}
table.slim{min-width:300px}
th{font-size:9px;font-weight:700;letter-spacing:.13em;text-transform:uppercase;color:var(--gray);text-align:left;padding:8px 10px;border-bottom:1.5px solid var(--line);white-space:nowrap}
td{padding:9px 10px;border-bottom:1px solid rgba(58,29,26,.07);vertical-align:middle}
tr:last-child td{border-bottom:0}
tbody tr:hover{background:rgba(251,244,233,.75)}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
.mini{font-size:11.5px;color:var(--ink-soft)}
.pill{display:inline-block;padding:2px 9px;border-radius:99px;font-size:10.5px;font-weight:500;background:rgba(179,48,60,.10);color:var(--purple);white-space:nowrap}
.pill.g{background:rgba(46,125,87,.12);color:var(--good)}
.pill.r{background:rgba(228,87,46,.13);color:var(--ember)}
.pill.y{background:rgba(201,162,39,.20);color:#8a6200}
.x{background:none;border:0;color:var(--gray);cursor:pointer;font-size:16px;line-height:1;padding:4px 6px;border-radius:6px}
.x:hover{color:var(--danger);background:rgba(192,57,43,.08)}
.empty{text-align:center;padding:32px 16px;color:var(--gray);font-size:13px;font-weight:300}
.empty b{display:block;color:var(--ink-soft);font-weight:500;margin-bottom:4px;font-size:14px}

.bowl-wrap{display:grid;grid-template-columns:210px 1fr;gap:22px;align-items:center}
@media(max-width:640px){.bowl-wrap{grid-template-columns:1fr;gap:8px}}
.legend{display:flex;flex-direction:column;gap:1px}
.lg{display:flex;align-items:center;gap:9px;padding:7px 9px;border-radius:9px;transition:background .15s}
.lg:hover{background:var(--cream2)}
.lg .sw{width:11px;height:11px;border-radius:3px;flex:none}
.lg .nm{flex:1;font-size:12.5px}
.lg .vl{font-variant-numeric:tabular-nums;font-size:13px;font-weight:500}
.lg .pc{width:44px;text-align:right;font-size:11px;color:var(--gray);font-variant-numeric:tabular-nums}
.lg.tot{border-top:1.5px solid var(--line);margin-top:5px;padding-top:11px;font-weight:600}
.lg.tot .nm,.lg.tot .vl{font-size:14px;color:var(--deep)}
@keyframes ripple{0%,100%{transform:translateY(0) scale(1);opacity:.9}50%{transform:translateY(-1px) scale(1.03);opacity:1}}
.arilo{transform-origin:center;animation:ripple 3.4s ease-in-out infinite}
@media (prefers-reduced-motion:reduce){.arilo{animation:none}}

.price{border:1.5px solid var(--line);border-radius:var(--r-sm);padding:14px;background:var(--cream2);position:relative;transition:border-color .18s,transform .18s}
.price:hover{border-color:var(--plum);transform:translateY(-2px)}
.price .ch{font-size:9.5px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--purple);min-height:24px}
.price .pv{font-size:32px;line-height:1;color:var(--deep);margin:4px 0 2px;font-weight:600;letter-spacing:-.5px}
.price .ut{font-size:11.5px;color:var(--ink-soft)}
.price .ut b{color:var(--good);font-weight:600}

.note{background:rgba(201,162,39,.13);border-left:3px solid var(--yellow);border-radius:0 10px 10px 0;padding:11px 14px;font-size:12.5px;color:#6b4c00;margin-top:14px;font-weight:300}
.note b{font-weight:600;color:#573d00}
.bar{height:9px;border-radius:99px;background:rgba(58,29,26,.10);overflow:hidden}
.bar>i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--purple),var(--yellow));transition:width .5s ease}
.search{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.search input,.search select{max-width:280px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.chip{border:1.5px solid var(--line);background:#fff;color:var(--ink-soft);border-radius:99px;padding:5px 12px;font-size:11.5px;cursor:pointer;transition:.15s}
.chip:hover{border-color:var(--plum)}
.chip.on{background:var(--deep);color:#fff;border-color:var(--deep)}

.rthumb{width:100%;aspect-ratio:16/9;object-fit:cover;border-radius:var(--r-sm);display:block;
  box-shadow:0 2px 10px -4px rgba(58,29,26,.45)}
.tthumb{width:64px;height:40px;object-fit:cover;border-radius:7px;display:block}
.calc-hero{display:grid;grid-template-columns:260px 1fr;gap:18px;align-items:start}
@media(max-width:760px){.calc-hero{grid-template-columns:1fr}}
.salsa{border:1.5px solid var(--line);border-radius:var(--r-sm);padding:16px;background:#fff;transition:.18s}
.salsa:hover{border-color:var(--plum);transform:translateY(-2px)}
.salsa .sc{font-size:10px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--yellow);background:var(--deep);border-radius:99px;padding:3px 10px;display:inline-block}
.salsa h4{font-size:15px;color:var(--deep);margin:9px 0 4px;font-weight:600}
.salsa p{font-size:12px;color:var(--ink-soft);margin:0 0 10px;font-weight:300;min-height:34px}
.salsa .big{font-size:26px;font-weight:600;color:var(--purple);letter-spacing:-.5px}

#toast{position:fixed;left:50%;bottom:26px;transform:translate(-50%,24px);background:var(--deep);color:#fff;padding:12px 20px;border-radius:12px;font-size:13px;box-shadow:var(--sh-lg);opacity:0;pointer-events:none;transition:.28s;z-index:90;max-width:90vw;text-align:center}
#toast.on{opacity:1;transform:translate(-50%,0)}
.modal{position:fixed;inset:0;background:rgba(42,19,48,.55);display:none;align-items:center;justify-content:center;padding:18px;z-index:80;backdrop-filter:blur(3px)}
.modal.on{display:flex}
.modal .box{background:#fff;border-radius:20px;padding:24px;max-width:560px;width:100%;box-shadow:var(--sh-lg);max-height:88vh;overflow:auto}

@media(max-width:900px){
  .shell{grid-template-columns:1fr}
  .rail{position:sticky;top:0;height:auto;padding:12px 12px 0;z-index:50}
  .brand{flex-direction:row;align-items:center;justify-content:space-between;padding:2px 4px 12px}
  .brand img{width:108px}
  .brand small{display:none}
  .navlist{flex-direction:row;overflow-x:auto;gap:5px;padding-bottom:10px;scrollbar-width:none}
  .navlist::-webkit-scrollbar{display:none}
  .navbtn{flex:none;width:auto;padding:8px 13px;font-size:12.5px;border-radius:99px;background:rgba(255,255,255,.09)}
  .navbtn span{white-space:nowrap}
  .rail-foot{display:none}
  main{padding:18px 16px 70px}
  h1.title{font-size:27px}
  .card{padding:16px}
}
@media print{
  .rail,.btn,.search,.chips{display:none!important}
  body{background:#fff}.card{box-shadow:none;border:1px solid #ddd;break-inside:avoid}
  .shell{grid-template-columns:1fr}
}


/* Jerarquía del manual aplicada a la interfaz */
.title{font-family:'Archivo Black','Poppins',sans-serif;font-weight:400;letter-spacing:-.4px}
.eyebrow,.k-l,.sc,.chip,.pill{font-family:'Bebas Neue','Poppins',sans-serif;letter-spacing:.14em}
.eyebrow,.k-l{text-transform:uppercase}
.card h3,.salsa h4,.brand small{font-family:'Montserrat','Poppins',sans-serif;font-weight:600;letter-spacing:-.1px}
th{font-family:'Bebas Neue','Poppins',sans-serif;letter-spacing:.12em;text-transform:uppercase}
b,strong{font-weight:600}

.lvblock{margin:14px 6px 4px;background:#F1EFE8;border-radius:12px;padding:10px 12px}
.lvblock span{display:block;font-size:8.5px;font-weight:700;letter-spacing:.2em;color:#D85A30;margin-bottom:6px}
.lvblock img{width:128px;height:auto;display:block}
@media(max-width:900px){.lvblock{display:none}}
.salsa{background:#fff;border:1.5px solid var(--line);border-radius:16px;padding:14px 15px;position:relative}
.salsa .sc{position:absolute;top:12px;right:12px;font-size:10px;font-weight:700;color:var(--purple);letter-spacing:.06em}
.salsa h4{font-size:14px;color:var(--deep);margin:0 0 8px;padding-right:62px;line-height:1.25}
.salsa .big{font-size:22px;font-weight:600;color:var(--deep);line-height:1.1}
.salsa p{font-size:11.5px;color:var(--gray);margin:0;line-height:1.45}

<script>/* =========================================================
   Endulcora · Calculadora de Gomas y Gomitas
   Motor de cálculo espejo del Anexo 1 (Excel). No editar fórmulas sin editar el Excel.
   ========================================================= */
const KEY='endulcora_gomas_y_gomitas_v1';
let mem=null, canPersist=true;
const store={
  read(){ try{ const s=localStorage.getItem(KEY); return s?JSON.parse(s):null }catch(e){ canPersist=false; return mem } },
  write(o){ try{ localStorage.setItem(KEY,JSON.stringify(o)) }catch(e){ canPersist=false; mem=o } }
};
const clone=o=>JSON.parse(JSON.stringify(o));
function freshDB(){
  return { v:1, insumos:clone(SEED.insumos), recetas:clone(SEED.recetas),
    bloques:clone(SEED.bloques), sistemas:clone(SEED.sistemas), bases:clone(SEED.bases), params:clone(SEED.params), gf:clone(SEED.gf), prod:[], ventas:[], mes:new Date().toISOString().slice(0,7) };
}
let DB=store.read()||freshDB();
if(!DB.recetas||DB.recetas.length!==SEED.recetas.length||!DB.bloques||!DB.bases||!DB.sistemas){ const d=freshDB(); d.prod=DB.prod||[]; d.ventas=DB.ventas||[]; DB=d; }
const save=()=>store.write(DB);

const LIN=SEED.lineas, DERIV=SEED.deriv;
const insByName={}, linByRec={}, recByN={}, bloByCode={}, sisByCode={}, baseByIns={};
LIN.forEach(l=>{ (linByRec[l.n]=linByRec[l.n]||[]).push(l) });
function reindex(){
  Object.keys(insByName).forEach(k=>delete insByName[k]); DB.insumos.forEach(i=>insByName[i.nom]=i);
  Object.keys(recByN).forEach(k=>delete recByN[k]); DB.recetas.forEach(r=>recByN[r.n]=r);
  Object.keys(bloByCode).forEach(k=>delete bloByCode[k]); DB.bloques.forEach(x=>bloByCode[x.code]=x);
  Object.keys(sisByCode).forEach(k=>delete sisByCode[k]); DB.sistemas.forEach(x=>sisByCode[x.code]=x);
  Object.keys(baseByIns).forEach(k=>delete baseByIns[k]); DB.bases.forEach(x=>baseByIns[x.ins]=x);
}
reindex();

const nf=new Intl.NumberFormat('es-MX',{style:'currency',currency:'MXN',minimumFractionDigits:2});
const nf0=new Intl.NumberFormat('es-MX',{style:'currency',currency:'MXN',maximumFractionDigits:0});
const money=v=>nf.format(isFinite(v)?v:0), money0=v=>nf0.format(isFinite(v)?v:0);
const pct=v=>((isFinite(v)?v:0)*100).toFixed(1).replace('.0','')+'%';
const num=v=>new Intl.NumberFormat('es-MX').format(isFinite(v)?v:0);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const todayISO=()=>new Date().toISOString().slice(0,10);
const CLASES=[['gelificante','Sistema gelificante'],['azucar','Azúcares y jarabes'],['sabor','Fruta, ácido, color y aroma'],['acabado','Rebozado y brillo'],['molde','Molde y bandeja (amortizados)'],['empaque','Empaque y etiqueta']];
/* El molde y la bandeja no se consumen: se reparten entre las coladas que aguantan. */
const REUSO=()=>Math.max(1,+DB.params.reuso||1);
const uni=r=>r.unidad;

/* ---------- motor ---------- */
function loteReceta(n){ return (linByRec[n]||[]).reduce((s,l)=>s+(+l.cant||0)*costoUnidadBase(insByName[l.ins])*(l.clase==='molde'?1/REUSO():1),0); }
function costoUnidadBase(ins){ return (ins&&ins.pres>0)?ins.precio/ins.pres:0 }
/* Las preparaciones de la casa no se compran: su costo sale de su propia fórmula. */
function loteBase(b,_st){ const st=(_st||[]).concat([b.ins]);
  return (linByRec[b.rec]||[]).reduce((s,l)=>s+(+l.cant||0)*costoUnidad(insByName[l.ins],st),0); }
function costoUnidad(ins,_st){ if(!ins) return 0; const b=baseByIns[ins.nom];
  if(b){ if((_st||[]).indexOf(ins.nom)>=0) return 0; const rd=+b.rend||0; return rd>0?loteBase(b,_st)/rd:0; }
  return costoUnidadBase(ins); }
const gastosTotales=()=>DB.gf.lineas.reduce((s,l)=>s+(+l.monto||0),0);
const overhead=()=>DB.gf.piezasMes>0?gastosTotales()/DB.gf.piezasMes:0;
const recupera=()=>0;
const estufaHora=()=>{const cap=Math.max(1,+DB.gf.curadoCap||1); return (+DB.gf.curadoCosto||0)/(cap*24*Math.max(1,+DB.gf.dias||30))};
const techoDia=h=>Math.floor(Math.max(1,+DB.gf.curadoCap||1)*24/Math.max(1,h||1));
const costoHora=()=>DB.gf.horas>0?DB.gf.sueldo/DB.gf.horas:0;
const CANALES=SEED.canales;
const canalKey=nom=>(CANALES.find(c=>c.nom===nom)||{k:CANALES[0].k}).k;
const ceilN=(x,n)=>Math.ceil(Math.round(x/n*1e6)/1e6)*n;
function calc(n){
  const r=recByN[n]; if(!r) return null;
  const pz=Math.max(0.1,+r.piezas||1);
  const comp={gelificante:0,azucar:0,sabor:0,acabado:0,molde:0,empaque:0};
  (linByRec[n]||[]).forEach(l=>{ comp[l.clase]+=(+l.cant||0)*costoUnidad(insByName[l.ins])*(l.clase==='molde'?1/REUSO():1) });
  const lote=CLASES.reduce((s,[cl])=>s+comp[cl],0);
  const ins=lote/pz;
  const tanda=Math.max(1,+DB.gf.piezasTanda||1200);
  const minU=(+r.minFijo||0)/tanda+(+r.minPieza||0);
  const emp=+r.empaque||0, ene=+r.energia||0, mo=costoHora()*minU/60, oh=overhead();
  const cur=(+r.curado||0)*estufaHora();
  const base=ins+emp+ene+mo+oh+cur;
  const merma=(r.merma==null?DB.params.mermaDefault:r.merma);
  const total=merma<1?base/(1-merma):base;
  const red=Math.max(1,+DB.params.redondeo||1);
  const cj=Math.max(1,+r.caja||1);
  /* El redondeo se aplica sobre la BOLSA, que es la unidad de venta real, y se devuelve a la
     pieza: una gomita no se cotiza en pesos cerrados. Espejo exacto del Anexo 1. */
  const precios={};
  CANALES.forEach(c=>{ const m=DB.params.margenes[c.k]; const pb=m<1?ceilN(total*cj/(1-m),red):0; const pvp=pb/cj;
    precios[c.k]={pvp,pb,util:pvp-total,margen:pvp>0?(pvp-total)/pvp:0}; });
  return {n,nom:r.nom,comp,lote,ins,emp,ene,mo,oh,cur,base,merma,mermaCosto:total-base,total,pz,minU,precios,cj,pc:total*cj,techo:techoDia(r.curado)};
}
const costoTotalDe=n=>(calc(n)||{total:0}).total;
const mediana=a=>{const b=[...a].sort((x,y)=>x-y),m=b.length>>1;return b.length%2?b[m]:(b[m-1]+b[m])/2};
function equilibrio(){
  /* la perla de isomalt y la pastilla funcional rompen cualquier promedio: se usa la MEDIANA */
  const cs=DB.recetas.map(r=>calc(r.n));
  const avgP=mediana(cs.map(c=>c.precios[CANALES[0].k].pvp));
  const avgC=mediana(cs.map(c=>c.total));
  const mc=avgP-avgC, gf=gastosTotales();
  return {avgP,avgC,mc,gf,piezas:mc>0?Math.ceil(gf/mc):0};
}
window.__engine={calc,equilibrio,loteReceta,costoUnidad,loteBase,recupera,estufaHora,techoDia,insByName,DB:()=>DB};

function vTablero(){

  const ingreso=ven.reduce((s,v)=>s+v.piezas*v.precio,0), piezas=ven.reduce((s,v)=>s+(+v.piezas||0),0);
  const costo=ven.reduce((s,v)=>s+v.piezas*costoTotalDe(v.n),0), comis=ven.reduce((s,v)=>s+v.piezas*v.precio*(+v.comision||0),0);
  const utilidad=ingreso-costo-comis;
  const buenas=pro.reduce((s,p)=>s+(+p.buenas||0),0), fallas=pro.reduce((s,p)=>s+(+p.fallas||0),0);
  const mermaPct=(buenas+fallas)>0?fallas/(buenas+fallas):0, mermaMXN=pro.reduce((s,p)=>s+(+p.fallas||0)*costoTotalDe(p.n),0);
  const eq=equilibrio(), gf=gastosTotales();

  const pe=mcReal>0?Math.ceil(gf/mcReal):eq.piezas, avance=pe>0?piezas/pe:0;

  const maxCanal=Math.max(1,...porCanal.map(x=>x.ingreso));
  const porRec={}; ven.forEach(v=>{ const o=porRec[v.n]=porRec[v.n]||{n:v.n,piezas:0,ingreso:0,util:0}; o.piezas+=v.piezas; o.ingreso+=v.piezas*v.precio; o.util+=v.piezas*v.precio-v.piezas*costoTotalDe(v.n)-v.piezas*v.precio*(+v.comision||0); });
  const top=Object.values(porRec).sort((a,b)=>b.util-a.util).slice(0,6);
  const mesNom=new Date(mes+'-02').toLocaleDateString('es-MX',{month:'long',year:'numeric'});

   <p class="sub">Todo lo que registres en Producción y Ventas se resume aquí. Cambia el mes para ver otro periodo. Todo se cuenta por pieza: la bolsa de 100 g son las piezas que quepan en ella.</p></div>

   <div class="kpi"><div class="k-l">Utilidad neta</div><div class="k-v" style="color:${utilidad>=0?'var(--good)':'var(--danger)'}">${money0(utilidad)}</div><div class="k-n">Margen ${pct(ingreso>0?utilidad/ingreso:0)}</div></div>
   <div class="kpi"><div class="k-l">Ticket promedio</div><div class="k-v">${money(piezas>0?ingreso/piezas:0)}</div><div class="k-n">por pieza vendida</div></div>
   <div class="kpi"><div class="k-l">Merma del mes</div><div class="k-v" style="color:${mermaPct>DB.params.mermaDefault?'var(--ember)':'var(--deep)'}">${pct(mermaPct)}</div><div class="k-n">${money0(mermaMXN)} perdidos · ${num(fallas)} piezas</div></div>
  </div>
  <div class="card" style="margin-top:16px"><h3>Punto de equilibrio</h3>
   <div style="display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:9px">
    <div><span style="font-size:26px;font-weight:600;color:var(--deep)">${num(piezas)}</span><span class="mini"> de ${num(pe)} piezas necesarias en el mes</span></div>
    <div class="mini">Gastos fijos ${money0(gf)} · margen de contribución ${money(mcReal>0?mcReal:eq.mc)}/pieza ${mcReal>0?'(real de tus ventas)':'(mediana del recetario)'}</div></div>
   <div class="bar"><i style="width:${Math.min(100,avance*100).toFixed(1)}%"></i></div>
   <p class="mini" style="margin:9px 0 0">${avance>=1?'✔ Ya cubriste tus gastos fijos. Cada pieza extra es ganancia real.':'Te faltan <b>'+num(Math.max(0,pe-piezas))+'</b> piezas para cubrir los gastos fijos del mes (≈ '+num(Math.ceil(Math.max(0,pe-piezas)/Math.max(1,+DB.gf.dias||30)))+' al día en '+num(DB.gf.dias)+' días).'}</p>
   <p class="mini" style="margin:4px 0 0">Utilidad después de gastos fijos: <b style="color:${(utilidad-gf)>=0?'var(--good)':'var(--danger)'}">${money0(utilidad-gf)}</b></p></div>

   <div class="card"><h3>Lo más rentable del mes</h3>${top.length?`<div class="tw"><table class="slim"><thead><tr><th>Fórmula</th><th class="num">Piezas</th><th class="num">Utilidad</th></tr></thead><tbody>${top.map(t=>`<tr><td style="font-size:12.5px">${esc((recByN[t.n]||{}).nom||'')}<div class="mini">${money0(t.ingreso)} de ingreso</div></td><td class="num">${num(t.piezas)}</td><td class="num" style="color:${t.util>=0?'var(--good)':'var(--danger)'}">${money0(t.util)}</td></tr>`).join('')}</tbody></table></div>`:`<div class="empty"><b>Sin datos todavía</b>Aquí verás qué fórmulas te dejan más dinero, no sólo cuáles vendes más.</div>`}</div>
  </div>
  <div class="note"><b>Cómo se usa:</b> 1) Captura el precio de tu <b>doypack</b> y el resto de tus insumos → 2) Revisa tus lugares de bandeja en <b>Preparaciones</b> → 3) Ajusta minutos y horas de estufado en la Calculadora → 4) Registra cada colada en <b>Producción</b> y cada venta en <b>Ventas</b> → 5) Vuelve aquí cada semana.</div>`;
}

function segsDe(c){ return [

  ['Fruta, ácido, color y aroma',c.comp.sabor/c.pz,'#C06A18'],['Rebozado y brillo',c.comp.acabado/c.pz,'#E6D9E8'],
  ['Molde y bandeja',c.comp.molde/c.pz,'#9C9C9C'],['Empaque y etiqueta',c.comp.empaque/c.pz,'#4E1454'],
  ['Cocción y luz',c.ene,'#B99AA4'],['Mano de obra',c.mo,'#1B0720'],['Gastos fijos',c.oh,'#CFC2D4'],
  ['Estufado',c.cur,'#5C7A4E'],['Costo de la merma',c.mermaCosto,'#FBF4E9']]; }
function panSVG(c){
  const segs=segsDe(c).filter(s=>s[1]>0.0001), tot=segs.reduce((s,x)=>s+x[1],0)||1;
  const CX=100, CY=112, R=62; let acc=0, out='';
  segs.forEach(([nm,v,col])=>{ const r0=R*Math.sqrt(acc/tot); acc+=v; const r1=R*Math.sqrt(acc/tot);
    out+=`<circle cx="${CX}" cy="${CY}" r="${((r0+r1)/2).toFixed(2)}" fill="none" stroke="${col}" stroke-width="${Math.max(r1-r0,.8).toFixed(2)}"/>`; });
  return `<svg viewBox="0 0 200 200" width="100%" style="max-width:250px;display:block;margin:0 auto" role="img" aria-label="Composición del costo por pieza">
   ${out}
   <circle cx="${CX}" cy="${CY}" r="${R}" fill="none" stroke="rgba(27,7,32,.55)" stroke-width="2.6"/>
   <ellipse cx="${CX}" cy="${CY+R+9}" rx="${R}" ry="5" fill="rgba(27,7,32,.10)"/>
   <text x="100" y="26" text-anchor="middle" font-family="Poppins,sans-serif" font-size="11" fill="#4E1454" font-weight="600">Costo por pieza</text>
  </svg>`;
}

  const med=a=>{const t=a.slice().sort((x,y)=>x-y),h=t.length>>1;return !t.length?0:(t.length%2?t[h]:(t[h-1]+t[h])/2);};
  const tot={}, cuenta={};
  CLASES.forEach(([cl])=>{ const v=cs.map(c=>c.comp[cl]/c.pz).filter(x=>x>0.000001);
    tot[cl]=med(v); cuenta[cl]=v.length; });
  const suma=Object.values(tot).reduce((a,b)=>a+b,0)||1;
  const tanda=Math.max(1,+DB.gf.piezasTanda||1200);
  const prom=(arr)=>arr.length?arr.reduce((a,b)=>a+b,0)/arr.length:0;
  const grupo=(lista,attr)=>lista.map(x=>{ const rs=DB.recetas.filter(r=>r[attr]===x.code); const cc=rs.map(r=>calc(r.n));
    return {...x, n:rs.length, ins:med(cc.map(c=>c.ins*c.cj)), costo:med(cc.map(c=>c.pc)), precio:med(cc.map(c=>c.precios[CANALES[0].k].pb))} }).filter(x=>x.n>0);
  const r1=recByN[1]||DB.recetas[0], c1=calc(r1.n);
  const escala=[120,300,600,1200,3000].map(t=>{ const minU=(+r1.minFijo||0)/t+(+r1.minPieza||0); const mo=costoHora()*minU/60;
    const base=c1.ins+(+r1.empaque||0)+(+r1.energia||0)+mo+overhead()+(+r1.curado||0)*estufaHora();
    const total=c1.merma<1?base/(1-c1.merma):base;
    return {t,minU,mo,total} });
  const usosDe=ins=>new Set(LIN.filter(l=>l.ins===ins&&l.n<=50).map(l=>l.n)).size;
  const empMed=med(cs.map(c=>c.comp.empaque/c.pz*c.cj));

  const tabla=(titulo,lista,sub,nota)=>`<div class="card"><h3>${titulo}</h3><div class="tw"><table><thead><tr><th>${sub}</th><th>Qué significa</th><th class="num">Fórmulas</th><th class="num">Insumo/bolsa</th><th class="num">Costo/bolsa</th><th class="num">Mostrador</th></tr></thead><tbody>
   ${lista.map(x=>`<tr><td><span class="pill">${esc(x.code)}</span> ${esc(x.nom)}</td><td class="mini">${esc(x.desc)}</td><td class="num">${num(x.n)}</td><td class="num">${money(x.ins)}</td><td class="num">${money(x.costo)}</td><td class="num">${money0(x.precio)}</td></tr>`).join('')}</tbody></table></div>${nota?`<p class="mini">${nota}</p>`:''}</div>`;

   <p class="sub">Las tres partidas que el chef no escribe en su ficha y que deciden tu costo: la bolsa que cuesta más que el dulce, el molde que se reparte entre cientos de coladas y la cámara de estufado que te pone el techo. Aquí están también las dos clasificaciones que ordenan las 50 fórmulas (Capítulos 6, 14 y 15 del eBook).</p></div></div>
  <div class="grid g4">
   <div class="salsa"><span class="sc">EMPAQUE</span><h4>La bolsa contra el dulce</h4>
    <div class="big">${money(empMed)}</div><div class="mini">de envase en una bolsa de 100 g</div>
    <p style="margin-top:6px">Contra <b>${money(dulMed)}</b> de todo el contenido. ${empMed>=dulMed?'La bolsa cuesta más que lo que lleva dentro: pide precio por millar antes de tocar ninguna otra cosa.':'Con tus precios actuales el contenido pesa más que el envase.'}</p></div>
   <div class="salsa"><span class="sc">ESTUFA</span><h4>Lugares de bandeja</h4>
    <div class="big">${num(DB.gf.curadoCap)}</div><div class="mini">tu techo real de producción</div>
    <p style="margin-top:6px">Con ${num(DB.gf.curadoCap)} lugares: ${num(techoDia(18))} pz/día en fórmulas de 18 h, ${num(techoDia(24))} en las de 24 h, ${num(techoDia(36))} en las de 36 h y ${num(techoDia(48))} en las de 48 h.</p>
    <div style="margin-top:8px"><input type="number" min="1" step="100" id="fCap" value="${DB.gf.curadoCap}" style="width:100%;padding:8px;font-size:14px"></div></div>
   <div class="salsa"><span class="sc">MOLDE</span><h4>Coladas de vida útil</h4>
    <div class="big">${num(REUSO())}</div><div class="mini">antes de perder definición</div>
    <p style="margin-top:6px">El molde y la bandeja se reparten entre ellas: ${money(c1.comp.molde/c1.pz)} por pieza en la Fórmula 1. Por debajo de 300 coladas, revisa qué silicona compraste.</p>
    <div style="margin-top:8px"><input type="number" min="1" step="50" id="fReuso" value="${REUSO()}" style="width:100%;padding:8px;font-size:14px"></div></div>
   <div class="salsa"><span class="sc">COLADA</span><h4>Piezas por colada</h4>
    <div class="big">${num(tanda)}</div><div class="mini">la colada real de una planta</div>
    <p style="margin-top:6px">Cocer el jarabe cuesta casi lo mismo con 200 piezas que con 2 000; desmoldar, rebozar y empacar, no.</p>
    <div style="margin-top:8px"><input type="number" min="1" step="100" id="fTanda" value="${tanda}" style="width:100%;padding:8px;font-size:14px"></div></div></div>
  <div class="card" style="margin-top:16px"><h3>Las dos preparaciones de la casa</h3><div class="tw"><table><thead><tr><th>Preparación</th><th>Lo que lleva su lote</th><th class="num">Costo del lote</th><th class="num">Rinde</th><th class="num">Costo unitario</th><th class="num">Fórmulas</th></tr></thead><tbody>
   ${DB.bases.map((b,i)=>{const lote=loteBase(b), rd=Math.max(0.0001,+b.rend||0); return `<tr><td><span class="pill">${esc(b.code)}</span> ${esc(b.nom)}<div class="mini">${esc(b.uso)}</div></td>

   <td class="num">${money(lote)}</td><td class="num"><input type="number" min="1" step="10" data-bsr="${i}" value="${b.rend}" style="width:78px;text-align:right;padding:5px 7px;font-size:13px"> <span class="mini">${esc(b.u)}</span></td>
   <td class="num"><b>${money(lote/rd)}</b><div class="mini">por ${esc(b.u)}</div></td><td class="num">${num(usosDe(b.ins))}</td></tr>`}).join('')}</tbody></table></div>
   <p class="mini">Son dos y no seis porque en confitería de gomas <b>no hay componentes intermedios</b>: la pieza se hace de un tirón, del azúcar al molde. Estas dos existen por operación —velocidad de dosificación del ácido y disolución de la cera—, no porque sean subrecetas.</p></div>

  <div class="card"><h3>De qué está hecho el costo de insumos de una pieza</h3><div class="tw"><table><thead><tr><th>Componente</th><th class="num">Fórmulas que lo llevan</th><th class="num">Costo mediano por pieza</th><th class="num">% del insumo</th></tr></thead><tbody>
   ${CLASES.map(([cl,lbl])=>`<tr${cl==='empaque'?' style="font-weight:600;background:var(--cream)"':''}><td>${esc(lbl)}</td><td class="num">${num(cuenta[cl])}</td><td class="num">${money(tot[cl])}</td><td class="num">${pct(tot[cl]/suma)}</td></tr>`).join('')}</tbody></table></div>
   <p class="mini">Mediana <b>entre las fórmulas que llevan cada componente</b>, no promedio de las cincuenta. <b>El empaque se lleva la mayor parte del insumo</b>, y es justo la partida que ninguna ficha del chef escribe. El molde aparece en centavos porque ya está repartido entre sus ${num(REUSO())} coladas.</p></div>

  ${!canPersist?`<div class="note" style="margin:0 0 16px"><b>Estás viendo una vista previa.</b> Para que tus datos se guarden, descarga este archivo a tu computadora o celular y ábrelo desde ahí.</div>`:''}
  <div class="grid g2"><div class="card"><h3>Respaldar</h3><p class="mini">Descarga un archivo con tus precios, lotes y ventas. Guárdalo en tu nube o mándatelo por correo: es tu seguro contra borrar el historial del navegador.</p>
    <button class="btn" id="dExp">Descargar respaldo</button> <button class="btn ghost" id="dImp">Restaurar respaldo</button><input type="file" id="dFile" accept="application/json" style="display:none"></div>
   <div class="card"><h3>Exportar a Excel</h3><p class="mini">Baja tus bitácoras en CSV para abrirlas en Excel, Google Sheets o mandárselas a tu contador.</p>
    <button class="btn ghost" id="dCsvV">Ventas (${DB.ventas.length})</button> <button class="btn ghost" id="dCsvP">Producción (${DB.prod.length})</button> <button class="btn ghost" id="dCsvC">Costos de las 50 fórmulas</button> <button class="btn ghost" id="dCsvB">Costo de las preparaciones</button></div></div>
  <div class="card"><h3>Resumen de lo que tienes cargado</h3><div class="grid g4"><div><div class="mini">Insumos</div><b style="font-size:24px;color:var(--deep)">${DB.insumos.length}</b></div><div><div class="mini">Recetas</div><b style="font-size:24px;color:var(--deep)">${DB.recetas.length}</b></div><div><div class="mini">Coladas</div><b style="font-size:24px;color:var(--deep)">${DB.prod.length}</b></div><div><div class="mini">Ventas</div><b style="font-size:24px;color:var(--deep)">${DB.ventas.length}</b></div></div></div>
  <div class="card"><h3>Empezar de nuevo</h3><p class="mini">Vuelve a los precios de referencia y borra tus bitácoras. Esto no se puede deshacer: descarga antes un respaldo.</p><button class="btn danger" id="dReset">Restablecer todo</button></div>
  <div class="note"><b>Endulcora · Estudio Gastronómico, en colaboración con Levent.</b> Herramienta complementaria del eBook «Gomas y Gomitas: Ciencia de Coloides, Reología de Geles y 50 Formulaciones Estandarizadas». Contenido: Chef Luis Alfonso Jiménez Cárdenas · Edición: Manuel Ramiro Justo Guzmán · WhatsApp 56 6527 1901. Uso personal del comprador; no se autoriza su reventa ni redistribución. Costos y precios ilustrativos hasta que captures tus propios precios.</div>`;
}
function download(name,text,type){ const b=new Blob([type==='csv'?'\ufeff'+text:text],{type:(type==='csv'?'text/csv':'application/json')+';charset=utf-8'}); const a=document.createElement('a'); a.href=URL.createObjectURL(b); a.download=name; a.click(); setTimeout(()=>URL.revokeObjectURL(a.href),1500); }
const csvCell=v=>`"${String(v??'').replace(/"/g,'""')}"`;
function hookDatos(){
  const S=id=>document.getElementById(id);
  S('dExp').onclick=()=>{ download(`Endulcora_Gomitas_respaldo_${todayISO()}.json`,JSON.stringify(DB),'json'); toast('Respaldo descargado'); };
  S('dImp').onclick=()=>S('dFile').click();
  S('dFile').onchange=e=>{ const f=e.target.files[0]; if(!f) return; const rd=new FileReader(); rd.onload=()=>{ try{ const o=JSON.parse(rd.result); if(!o.insumos||!o.recetas) throw 0; DB=o; if(!DB.bases) DB.bases=clone(SEED.bases); if(!DB.bloques) DB.bloques=clone(SEED.bloques); if(!DB.sistemas) DB.sistemas=clone(SEED.sistemas); reindex(); save(); toast('Respaldo restaurado'); render(); }catch(err){ toast('Ese archivo no es un respaldo válido.'); } }; rd.readAsText(f); };
  S('dCsvV').onclick=()=>{ const h=['Fecha','Receta','Canal','Piezas','Precio unitario','Ingreso','Costo total','Comision','Utilidad neta','Margen','Cliente/Nota'];
    const rows=DB.ventas.map(v=>{const ing=v.piezas*v.precio,cst=v.piezas*costoTotalDe(v.n),com=ing*(+v.comision||0); return [v.fecha,(recByN[v.n]||{}).nom,v.canal,v.piezas,v.precio,ing,cst.toFixed(2),com.toFixed(2),(ing-cst-com).toFixed(2),ing>0?((ing-cst-com)/ing).toFixed(4):0,v.nota].map(csvCell).join(',');});
    download(`Endulcora_Gomitas_Ventas_${todayISO()}.csv`,[h.map(csvCell).join(','),...rows].join('\n'),'csv'); toast('CSV de ventas descargado'); };
  S('dCsvP').onclick=()=>{ const h=['Fecha','Lote','Receta','Planeadas','Buenas','Falladas','% merma','Costo merma','Causa','Notas'];
    const rows=DB.prod.map(p=>{const m=(p.buenas+p.fallas)>0?p.fallas/(p.buenas+p.fallas):0; return [p.fecha,p.lote,(recByN[p.n]||{}).nom,p.plan,p.buenas,p.fallas,m.toFixed(4),(p.fallas*costoTotalDe(p.n)).toFixed(2),p.causa,p.nota].map(csvCell).join(',');});
    download(`Endulcora_Gomitas_Produccion_${todayISO()}.csv`,[h.map(csvCell).join(','),...rows].join('\n'),'csv'); toast('CSV de producción descargado'); };
  S('dCsvC').onclick=()=>{ const h=['No','Formula','Capitulo','Bloque','Sistema','Vida util (meses)','Unidad','Rinde','Piezas por bolsa','Gelificante','Azucares','Sabor','Acabado','Molde','Empaque','Insumos/pieza','Empaque extra','Coccion y luz','Mano de obra','Gastos fijos','Horas de estufado','Estufado','Techo diario','Costo base','% merma','Costo por pieza','Costo de la bolsa',...CANALES.map(c=>'PVP pieza '+c.nom),...CANALES.map(c=>'PVP bolsa '+c.nom)];
    const rows=DB.recetas.map(r=>{const c=calc(r.n); return [String(r.n),r.nom,r.cap,r.blo,r.sis,r.vida,r.unidad,c.pz,c.cj,...[c.comp.gelificante,c.comp.azucar,c.comp.sabor,c.comp.acabado,c.comp.molde,c.comp.empaque,c.ins,c.emp,c.ene,c.mo,c.oh].map(x=>x.toFixed(4)),r.curado,c.cur.toFixed(4),c.techo,c.base.toFixed(4),c.merma.toFixed(3),c.total.toFixed(4),c.pc.toFixed(2),...CANALES.map(x=>c.precios[x.k].pvp.toFixed(4)),...CANALES.map(x=>c.precios[x.k].pb.toFixed(2))].map(csvCell).join(',');});
    download(`Endulcora_Gomitas_Costos_${todayISO()}.csv`,[h.map(csvCell).join(','),...rows].join('\n'),'csv'); toast('CSV de costos descargado'); };
  S('dCsvB').onclick=()=>{ const h=['Codigo','Preparacion','Para que sirve','Rendimiento','Unidad','Costo del lote','Costo unitario'];
    const rows=DB.bases.map(f=>{const l=loteBase(f), rd=Math.max(0.0001,+f.rend||0); return [f.code,f.nom,f.uso,f.rend,f.u,l.toFixed(2),(l/rd).toFixed(5)].map(csvCell).join(',');});
    download(`Endulcora_Gomitas_Preparaciones_${todayISO()}.csv`,[h.map(csvCell).join(','),...rows].join('\n'),'csv'); toast('CSV de preparaciones descargado'); };
  S('dReset').onclick=()=>{ openModal(`<h2 style="font-size:24px;color:var(--deep);margin-bottom:8px;font-weight:600">¿Restablecer todo?</h2><p class="mini">Se borrarán tus ${DB.ventas.length} ventas, ${DB.prod.length} coladas y los precios que hayas cambiado. Volverás a los valores de referencia del libro.</p><div style="display:flex;gap:8px;margin-top:16px"><button class="btn ghost" id="noReset">Cancelar</button><button class="btn danger" id="okReset">Sí, borrar todo</button></div>`);
    document.getElementById('noReset').onclick=closeModal; document.getElementById('okReset').onclick=()=>{ DB=freshDB(); reindex(); save(); closeModal(); toast('Todo restablecido'); go('tablero'); }; };
}

/* ---------- RENDER ---------- */
function render(){
  const v=document.getElementById('view');
  const map={tablero:vTablero,calc:vCalc,bases:vBases,recetas:vRecetas,insumos:vInsumos,prod:vProd,ventas:vVentas,negocio:vNegocio,datos:vDatos};
  const hooks={tablero:hookTablero,calc:hookCalc,bases:hookBases,recetas:hookRecetas,insumos:hookInsumos,prod:hookProd,ventas:hookVentas,negocio:hookNegocio,datos:hookDatos};
  v.innerHTML=map[current](); reindex(); hooks[current]();
}
buildNav(); render();
</script></body></html>
