<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>App Galletas NY · Endulcora</title>
<meta name="description" content="Costos, precios, producción y ventas para el eBook «Galletas Estilo Nueva York». Endulcora · Estudio Gastronómico.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Great+Vibes&family=Montserrat:wght@500;600;700&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --purple:#7A2E7E; --deep:#4E1454; --deep2:#5C2360; --plum:#A25AA6; --lilac:#C98BCB;
  --yellow:#F8B818; --amber:#E39B0C; --gray:#9C9C9C; --cream:#FBF4E9; --cream2:#FBF5EC;
  --ink:#2A1330; --ink-soft:#6B5470; --line:rgba(78,20,84,.13); --card:#FFFFFF;
  --danger:#C0392B; --ember:#E4572E; --good:#2E7D57; --cocoa:#6B3A17; --dough:#E7B980;
  --r:18px; --r-sm:12px;
  --sh:0 1px 2px rgba(78,20,84,.06), 0 8px 24px -12px rgba(78,20,84,.28);
  --sh-lg:0 24px 60px -28px rgba(78,20,84,.45);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  font-family:'Poppins',system-ui,-apple-system,'Segoe UI',sans-serif;
  color:var(--ink); background:var(--cream);
  background-image:radial-gradient(1100px 520px at 85% -10%, rgba(248,184,24,.16), transparent 60%),
                   radial-gradient(900px 520px at -10% 0%, rgba(122,46,126,.10), transparent 55%);
  background-attachment:fixed;
  -webkit-font-smoothing:antialiased; font-size:15px; line-height:1.5;
}
h1,h2,h3,h4{margin:0}
button{font-family:inherit}
a{color:var(--purple)}

/* ---------- shell ---------- */
.shell{display:grid;grid-template-columns:250px 1fr;min-height:100vh}
@media(min-width:901px){.shell{background:linear-gradient(90deg,#6A2570 0 250px,transparent 250px)}}
.shell>*{min-width:0}
.rail{
  background:linear-gradient(180deg,var(--deep) 0%, var(--deep2) 55%, #6A2570 100%);
  color:#fff;padding:20px 14px 26px;position:sticky;top:0;height:100vh;overflow-y:auto;
}
.brand{display:flex;flex-direction:column;gap:10px;padding:6px 8px 18px}
.brand img{width:152px;height:auto;opacity:.97}
.brand .dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--yellow);box-shadow:0 0 10px var(--yellow)}
.brand small{font-family:'Montserrat',sans-serif;font-weight:600;font-size:9.5px;letter-spacing:.2em;text-transform:uppercase;color:rgba(255,255,255,.62)}
.navlist{display:flex;flex-direction:column;gap:2px;margin-top:4px}
.navbtn{
  display:flex;align-items:center;gap:11px;width:100%;text-align:left;cursor:pointer;
  background:transparent;border:0;color:rgba(255,255,255,.78);padding:10px 12px;border-radius:11px;
  font-size:13.5px;font-weight:400;transition:background .18s,color .18s;
}
.navbtn svg{width:17px;height:17px;flex:none;opacity:.85}
.navbtn:hover{background:rgba(255,255,255,.09);color:#fff}
.navbtn.on{background:rgba(255,255,255,.13);color:#fff;font-weight:500}
.navbtn.on svg{opacity:1;color:var(--yellow)}
.rail-foot{margin-top:22px;padding:12px;border-top:1px solid rgba(255,255,255,.14);font-size:10.5px;color:rgba(255,255,255,.5);line-height:1.6}
.rail-foot b{color:rgba(255,255,255,.78);font-weight:500}

main{padding:26px 30px 90px;max-width:1180px;width:100%;min-width:0}
.page-head{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:14px;margin-bottom:20px}
.eyebrow{font-family:'Montserrat',sans-serif;font-weight:700;font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--plum);margin-bottom:5px}
h1.title{font-family:'Bebas Neue',Impact,sans-serif;font-size:38px;line-height:1;letter-spacing:.01em;color:var(--deep)}
.sub{color:var(--ink-soft);font-size:13px;max-width:64ch;margin-top:6px;font-weight:300}

/* ---------- cards ---------- */
.card{min-width:0;background:var(--card);border-radius:var(--r);box-shadow:var(--sh);padding:20px;border:1px solid rgba(78,20,84,.06)}
.card + .card{margin-top:16px}
.card h3{font-family:'Montserrat',sans-serif;font-size:11px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--purple);margin-bottom:14px}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
@media(max-width:1000px){.g4{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:640px){.g2,.g3,.g4{grid-template-columns:1fr}}

/* ---------- kpi ---------- */
.kpi{background:var(--card);border-radius:var(--r);padding:16px 18px;box-shadow:var(--sh);border:1px solid rgba(78,20,84,.06);position:relative;overflow:hidden}
.kpi::after{content:'';position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--yellow)}
.kpi .k-l{font-family:'Montserrat',sans-serif;font-size:9.5px;font-weight:700;letter-spacing:.15em;text-transform:uppercase;color:var(--gray)}
.kpi .k-v{font-family:'Bebas Neue',Impact,sans-serif;font-size:33px;line-height:1.05;color:var(--deep);margin-top:5px;letter-spacing:.01em}
.kpi .k-n{font-size:11px;color:var(--ink-soft);margin-top:2px;font-weight:300}
.kpi.dark{background:linear-gradient(135deg,var(--deep),var(--purple));color:#fff}
.kpi.dark .k-l{color:rgba(255,255,255,.6)} .kpi.dark .k-v{color:#fff} .kpi.dark .k-n{color:rgba(255,255,255,.7)}

/* ---------- form ---------- */
label.f{display:block;font-family:'Montserrat',sans-serif;font-size:9.5px;font-weight:700;letter-spacing:.13em;text-transform:uppercase;color:var(--gray);margin-bottom:5px}
input,select,textarea{
  width:100%;padding:9px 11px;border:1.5px solid var(--line);border-radius:10px;background:var(--cream2);
  font-family:'Poppins',sans-serif;font-size:14px;color:var(--deep);transition:border-color .15s,background .15s;
}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--purple);background:#fff;box-shadow:0 0 0 3px rgba(122,46,126,.10)}
input[type=range]{padding:0;border:0;background:transparent;accent-color:var(--purple);height:26px}
.field{margin-bottom:12px}
.row{display:flex;gap:10px;flex-wrap:wrap}
.row>.field{flex:1;min-width:120px}
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:7px;cursor:pointer;border:0;border-radius:11px;
  padding:10px 16px;font-family:'Montserrat',sans-serif;font-weight:700;font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;
  background:var(--purple);color:#fff;transition:transform .12s, box-shadow .18s, background .18s;
  box-shadow:0 6px 16px -8px rgba(122,46,126,.8);
}
.btn:hover{background:var(--deep);transform:translateY(-1px)}
.btn:active{transform:translateY(0)}
.btn.ghost{background:transparent;color:var(--purple);border:1.5px solid var(--line);box-shadow:none}
.btn.ghost:hover{background:rgba(122,46,126,.07);color:var(--deep)}
.btn.gold{background:var(--yellow);color:var(--deep);box-shadow:0 6px 16px -8px rgba(248,184,24,.9)}
.btn.gold:hover{background:var(--amber)}
.btn.sm{padding:7px 11px;font-size:10px;border-radius:9px}
.btn.danger{background:transparent;color:var(--danger);border:1.5px solid rgba(192,57,43,.3);box-shadow:none}
.btn.danger:hover{background:rgba(192,57,43,.08)}
:focus-visible{outline:2.5px solid var(--yellow);outline-offset:2px}

/* ---------- table ---------- */
.tw{overflow-x:auto;-webkit-overflow-scrolling:touch;margin:0 -6px;padding:0 6px;max-width:100%}
table{width:100%;border-collapse:collapse;font-size:13px;min-width:520px}
table.slim{min-width:300px}
th{font-family:'Montserrat',sans-serif;font-size:9px;font-weight:700;letter-spacing:.13em;text-transform:uppercase;color:var(--gray);text-align:left;padding:8px 10px;border-bottom:1.5px solid var(--line);white-space:nowrap}
td{padding:9px 10px;border-bottom:1px solid rgba(78,20,84,.07);vertical-align:middle}
tr:last-child td{border-bottom:0}
tbody tr:hover{background:rgba(251,244,233,.75)}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
.mini{font-size:11.5px;color:var(--ink-soft)}
.pill{display:inline-block;padding:2px 9px;border-radius:99px;font-size:10.5px;font-weight:500;background:rgba(122,46,126,.10);color:var(--purple);white-space:nowrap}
.pill.g{background:rgba(46,125,87,.12);color:var(--good)}
.pill.r{background:rgba(228,87,46,.13);color:var(--ember)}
.pill.y{background:rgba(248,184,24,.20);color:#8a6200}
.pill.c{background:rgba(107,58,23,.12);color:var(--cocoa)}
.x{background:none;border:0;color:var(--gray);cursor:pointer;font-size:16px;line-height:1;padding:4px 6px;border-radius:6px}
.x:hover{color:var(--danger);background:rgba(192,57,43,.08)}
.empty{text-align:center;padding:32px 16px;color:var(--gray);font-size:13px;font-weight:300}
.empty b{display:block;color:var(--ink-soft);font-weight:500;margin-bottom:4px;font-size:14px}

/* ---------- cookie (signature) ---------- */
.cookie-wrap{display:grid;grid-template-columns:200px 1fr;gap:22px;align-items:center}
@media(max-width:640px){.cookie-wrap{grid-template-columns:1fr;gap:8px}}
.legend{display:flex;flex-direction:column;gap:1px}
.lg{display:flex;align-items:center;gap:9px;padding:7px 9px;border-radius:9px;transition:background .15s}
.lg:hover{background:var(--cream2)}
.lg .sw{width:11px;height:11px;border-radius:3px;flex:none}
.lg .nm{flex:1;font-size:12.5px}
.lg .vl{font-variant-numeric:tabular-nums;font-size:13px;font-weight:500}
.lg .pc{width:44px;text-align:right;font-size:11px;color:var(--gray);font-variant-numeric:tabular-nums}
.lg.tot{border-top:1.5px solid var(--line);margin-top:5px;padding-top:11px;font-weight:600}
.lg.tot .nm,.lg.tot .vl{font-size:14px;color:var(--deep)}
@keyframes steam{0%,100%{transform:translateY(0);opacity:.28}50%{transform:translateY(-7px);opacity:.62}}
.steam{transform-origin:center bottom;animation:steam 3.2s ease-in-out infinite}
.steam.b{animation-delay:.9s} .steam.c{animation-delay:1.7s}
@media (prefers-reduced-motion:reduce){.steam{animation:none}}

/* ---------- price cards ---------- */
.price{border:1.5px solid var(--line);border-radius:var(--r-sm);padding:14px;background:var(--cream2);position:relative;transition:border-color .18s,transform .18s}
.price:hover{border-color:var(--plum);transform:translateY(-2px)}
.price .ch{font-family:'Montserrat',sans-serif;font-size:9.5px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--purple);min-height:24px}
.price .pv{font-family:'Bebas Neue',Impact,sans-serif;font-size:36px;line-height:1;color:var(--deep);margin:4px 0 2px}
.price .ut{font-size:11.5px;color:var(--ink-soft)}
.price .ut b{color:var(--good);font-weight:600}

.note{background:rgba(248,184,24,.13);border-left:3px solid var(--yellow);border-radius:0 10px 10px 0;padding:11px 14px;font-size:12.5px;color:#6b4c00;margin-top:14px;font-weight:300}
.note b{font-weight:600;color:#573d00}
.bar{height:9px;border-radius:99px;background:rgba(78,20,84,.10);overflow:hidden}
.bar>i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--purple),var(--yellow));transition:width .5s ease}
.search{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.search input,.search select{max-width:280px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.chip{border:1.5px solid var(--line);background:#fff;color:var(--ink-soft);border-radius:99px;padding:5px 12px;font-size:11.5px;cursor:pointer;transition:.15s}
.chip:hover{border-color:var(--plum)}
.chip.on{background:var(--deep);color:#fff;border-color:var(--deep)}
.ficha{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.ficha .fi{background:var(--cream2);border-radius:var(--r-sm);padding:11px 13px;border:1px solid var(--line)}
.ficha .fi .l{font-family:'Montserrat',sans-serif;font-size:9px;font-weight:700;letter-spacing:.13em;text-transform:uppercase;color:var(--gray);margin-bottom:4px}
.ficha .fi .v{font-size:12.5px;color:var(--deep);line-height:1.45}

/* ---------- toast / modal ---------- */
#toast{position:fixed;left:50%;bottom:26px;transform:translate(-50%,24px);background:var(--deep);color:#fff;padding:12px 20px;border-radius:12px;font-size:13px;box-shadow:var(--sh-lg);opacity:0;pointer-events:none;transition:.28s;z-index:90;max-width:90vw;text-align:center}
#toast.on{opacity:1;transform:translate(-50%,0)}
.modal{position:fixed;inset:0;background:rgba(42,19,48,.55);display:none;align-items:center;justify-content:center;padding:18px;z-index:80;backdrop-filter:blur(3px)}
.modal.on{display:flex}
.modal .box{background:#fff;border-radius:20px;padding:24px;max-width:520px;width:100%;box-shadow:var(--sh-lg);max-height:88vh;overflow:auto}

/* ---------- mobile ---------- */
@media(max-width:900px){
  .shell{grid-template-columns:1fr}
  .rail{position:sticky;top:0;height:auto;padding:12px 12px 0;z-index:50}
  .brand{flex-direction:row;align-items:center;justify-content:space-between;padding:2px 4px 12px}
  .brand img{width:108px}
  .brand small{display:none}
  .navlist{flex-direction:row;overflow-x:auto;gap:5px;padding-bottom:10px;scrollbar-width:none}
  .navlist::-webkit-scrollbar{display:none}
  .navbtn{flex:none;width:auto;padding:8px 13px;font-size:12.5px;border-radius:99px;background:rgba(255,255,255,.09)}
  .navbtn span{white-space:nowrap}
  .rail-foot{display:none}
  main{padding:18px 16px 70px}
  h1.title{font-size:30px}
  .card{padding:16px}
}
@media print{
  .rail,.btn,.search,.chips{display:none!important}
  body{background:#fff}.card{box-shadow:none;border:1px solid #ddd;break-inside:avoid}
  .shell{grid-template-columns:1fr}
}
</style>
</head>

inutos.","reposo":"","empaque":null,"energia":null,"merma":null},{"n":47,"nom":"Té Earl Grey, Lavanda y Ralladura de Limón","cap":"Cap. 8 · Alta gama y autor","lote":6.0,"dif":"Intermedio–Avanzado (infusión floral que amarga si se excede)","temp":"190 °C","tiempo":"12 a 14 minutos.","reposo":"","empaque":null,"energia":null,"merma":null},{"n":48,"nom":"Café de Olla, Piloncillo y Anís Estrella","cap":"Cap. 8 · Alta gama y autor","lote":6.0,"dif":"Intermedio (piloncillo y anís de aroma dominante)","temp":"190 °C","tiempo":"14 a 16 minutos.","reposo":"","empaque":null,"energia":null,"merma":null},{"n":49,"nom":"Cacao Alcalino, Chile Ancho y Almendra Marcona","cap":"Cap. 8 · Alta gama y autor","lote":6.0,"dif":"Intermedio–Avanzado (chile ancho con calor residual)","temp":"190 °C","tiempo":"12 a 14 minutos.","reposo":"","empaque":null,"energia":null,"merma":null},{"n":50,"nom":"Ajo Negro y Chocolate Amargo con Sal Ahumada","cap":"Cap. 8 · Alta gama y autor","lote":6.0,"dif":"Avanzado (ajo negro, ingrediente de nicho y alto umami)","temp":"190 °C","tiempo":"13 a 15 minutos.","reposo":"","empaque":null,"energia":null,"merma":null}],"params":{"empaque":6,"energia":2,"costoHora":80,"piezasHora":20,"merma":0.08,"gastosFijos":4000,"piezasMes":400,"mMenudeo":0.6,"mMayoreo":0.35,"redondeo":5,"iva":0.16},"gf":[{"nom":"Renta del espacio de producción","monto":1800},{"nom":"Luz y gas del horno","monto":700},{"nom":"Agua y limpieza","monto":200},{"nom":"Internet y telefonía","monto":300},{"nom":"Publicidad y anuncios pagados","monto":500},{"nom":"Empaque genérico y papelería","monto":200},{"nom":"Depreciación de equipo","monto":100},{"nom":"Otros gastos fijos","monto":200}],"canales":["Menudeo","Mayoreo","Evento / banquete","Taller","Otro"],"causas":["Se extendieron demasiado (spread)","Horneado de más / quemadas","Centro crudo","Relleno derramado","Masa sin reposo suficiente","Peso desigual de las bolas","Error de temperatura del horno","Rotura al enfriar","Devolución de cliente","Otro"]};</script>
<script>
/* =========================================================
   App Galletas NY · Endulcora · Estudio Gastronómico
   Motor de cálculo espejo del sistema de costeo en Excel.
   ========================================================= */
const KEY='endulcora_galletas_ny_v1';
let mem=null, canPersist=true;
const store={
  read(){ try{ const s=localStorage.getItem(KEY); return s?JSON.parse(s):null }catch(e){ canPersist=false; return mem } },
  write(o){ try{ localStorage.setItem(KEY,JSON.stringify(o)) }catch(e){ canPersist=false; mem=o } }
};
const clone=o=>JSON.parse(JSON.stringify(o));

function freshDB(){
  return {
    v:1,
    insumos: clone(SEED.insumos),
    recetas: clone(SEED.recetas),
    params: clone(SEED.params),
    gf: clone(SEED.gf),
    plan: {}, prod: [], ventas: [],
    mes: new Date().toISOString().slice(0,7)
  };
}
let DB = store.read() || freshDB();
if(!DB.recetas || DB.recetas.length!==50 || !DB.params || DB.params.mMenudeo===undefined){
  const d=freshDB(); d.prod=DB.prod||[]; d.ventas=DB.ventas||[]; d.plan=DB.plan||{}; DB=d;
}
if(!DB.plan) DB.plan={};
const save=()=>store.write(DB);

/* ---------- índices ---------- */
const LIN = SEED.lineas;
const insByName = {}; const linByRec = {}; const recByN = {};
LIN.forEach(l=>{ (linByRec[l.n]=linByRec[l.n]||[]).push(l) });
function reindex(){
  Object.keys(insByName).forEach(k=>delete insByName[k]); DB.insumos.forEach(i=>insByName[i.nom]=i);
  Object.keys(recByN).forEach(k=>delete recByN[k]);  DB.recetas.forEach(r=>recByN[r.n]=r);
}
reindex();

/* ---------- formato ---------- */
const nf = new Intl.NumberFormat('es-MX',{style:'currency',currency:'MXN',minimumFractionDigits:2});
const nf0= new Intl.NumberFormat('es-MX',{style:'currency',currency:'MXN',maximumFractionDigits:0});
const money=v=>nf.format(isFinite(v)?v:0);
const money0=v=>nf0.format(isFinite(v)?v:0);
const pct=v=>((isFinite(v)?v:0)*100).toFixed(1).replace('.0','')+'%';
const num=v=>new Intl.NumberFormat('es-MX').format(isFinite(v)?Math.round(v*100)/100:0);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const todayISO=()=>new Date().toISOString().slice(0,10);

/* ---------- motor de cálculo (espejo del Excel) ---------- */
const costoUnidad = ins => (ins && ins.pres>0) ? ins.precio/ins.pres : 0;
function costoLote(n){ return (linByRec[n]||[]).reduce((s,l)=> s + (+l.cant||0)*costoUnidad(insByName[l.ins]), 0); }
const gastosTotales = () => DB.gf.reduce((s,l)=>s+(+l.monto||0),0);
const overhead = () => DB.params.piezasMes>0 ? DB.params.gastosFijos/DB.params.piezasMes : 0;
const manoObra = () => DB.params.piezasHora>0 ? DB.params.costoHora/DB.params.piezasHora : 0;
const ceilTo=(v,m)=> m>0 ? Math.ceil(v/m)*m : v;

function calc(n){
  const r = recByN[n]; if(!r) return null;
  const P = DB.params;
  const lote = +r.lote||0;
  const insLote = costoLote(n);
  const ins = lote>0 ? insLote/lote : 0;
  const emp = r.empaque==null ? +P.empaque||0 : +r.empaque||0;
  const ene = r.energia==null ? +P.energia||0 : +r.energia||0;
  const mo  = manoObra();
  const sub = ins+emp+ene+mo;
  const mermaPct = r.merma==null ? +P.merma||0 : +r.merma||0;
  const mermaCosto = sub*mermaPct;
  const oh = overhead();
  const total = sub+mermaCosto+oh;
  const pvpMen = P.mMenudeo>=1 ? 0 : ceilTo(total/(1-P.mMenudeo), P.redondeo);
  const pvpMay = P.mMayoreo>=1 ? 0 : ceilTo(total/(1-P.mMayoreo), P.redondeo);
  return {n, nom:r.nom, lote, insLote, ins, emp, ene, mo, sub, mermaPct, mermaCosto, oh, total,
    menudeo:{pvp:pvpMen, util:pvpMen-total, margen:pvpMen>0?(pvpMen-total)/pvpMen:0},
    mayoreo:{pvp:pvpMay, util:pvpMay-total, margen:pvpMay>0?(pvpMay-total)/pvpMay:0},
    iva: pvpMen*(1+(+DB.params.iva||0))};
}
const costoTotalDe = n => (calc(n)||{total:0}).total;
const precioCanal = (n,canal) => { const c=calc(n); if(!c) return 0; return canal==='Mayoreo' ? c.mayoreo.pvp : c.menudeo.pvp; };

function equilibrio(){
  const cs = DB.recetas.map(r=>calc(r.n));
  const avgP = cs.reduce((s,c)=>s+c.menudeo.pvp,0)/cs.length;
  const avgC = cs.reduce((s,c)=>s+c.total,0)/cs.length;
  const varC = avgC - overhead();
  const mc = avgP-varC;
  const gf = +DB.params.gastosFijos||0;
  return {avgP, avgC, varC, mc, gf, contrib: avgP>0?mc/avgP:0, piezas: mc>0?Math.ceil(gf/mc):0, ingreso: mc>0?Math.ceil(gf/mc)*avgP:0};
}

/* ---------- helpers UI ---------- */
function toast(msg){ const t=document.getElementById('toast'); t.textContent=msg; t.classList.add('on'); clearTimeout(t._t); t._t=setTimeout(()=>t.classList.remove('on'),2300); }
function openModal(html){ document.getElementById('modalBox').innerHTML=html; document.getElementById('modal').classList.add('on'); }
function closeModal(){ document.getElementById('modal').classList.remove('on'); }
document.getElementById('modal').addEventListener('click',e=>{ if(e.target.id==='modal') closeModal(); });

/* ---------- navegación ---------- */
const ICONS={
  tablero:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"><rect x="3" y="3" width="7.5" height="7.5" rx="2"/><rect x="13.5" y="3" width="7.5" height="7.5" rx="2"/><rect x="3" y="13.5" width="7.5" height="7.5" rx="2"/><rect x="13.5" y="13.5" width="7.5" height="7.5" rx="2"/></svg>',
  calc:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"><circle cx="12" cy="12" r="9"/><circle cx="9.3" cy="10" r="1.15" fill="currentColor" stroke="none"/><circle cx="14.6" cy="9.2" r="1" fill="currentColor" stroke="none"/><circle cx="12.4" cy="14.6" r="1.15" fill="currentColor" stroke="none"/><circle cx="8.6" cy="14.8" r=".85" fill="currentColor" stroke="none"/></svg>',
  recetas:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"><path d="M5.5 3.5h13v17l-6.5-3-6.5 3v-17z"/><path d="M9 8.5h6M9 12.5h6"/></svg>',
  insumos:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"><path d="M4 8h16l-1.3 12.2a2 2 0 0 1-2 1.8H7.3a2 2 0 0 1-2-1.8L4 8z"/><path d="M8.5 8V6a3.5 3.5 0 1 1 7 0v2"/></svg>',
  plan:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"><rect x="3.5" y="5" width="17" height="16" rx="2.5"/><path d="M3.5 10h17M8 3.5v3M16 3.5v3"/><path d="M8 14.5h8"/></svg>',
  prod:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"><rect x="3" y="4.5" width="18" height="15" rx="2.5"/><path d="M3 9h18"/><circle cx="9" cy="14" r="2.2"/><path d="M14.5 12.5h4M14.5 15.5h4"/></svg>',
  ventas:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"><path d="M3.5 12.5 12 4h7.5v7.5L11 20a2 2 0 0 1-2.8 0l-4.7-4.7a2 2 0 0 1 0-2.8z"/><circle cx="16" cy="8" r="1.4" fill="currentColor" stroke="none"/></svg>',
  negocio:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"><path d="M3.5 20.5h17"/><rect x="5" y="12" width="3.6" height="8.5" rx="1"/><rect x="10.2" y="7" width="3.6" height="13.5" rx="1"/><rect x="15.4" y="3.5" width="3.6" height="17" rx="1"/></svg>',
  datos:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"><ellipse cx="12" cy="6" rx="7.5" ry="3"/><path d="M4.5 6v12c0 1.7 3.4 3 7.5 3s7.5-1.3 7.5-3V6"/><path d="M4.5 12c0 1.7 3.4 3 7.5 3s7.5-1.3 7.5-3"/></svg>'
};
const VIEWS=[
  ['tablero','Tablero','tablero'],
  ['calc','Calculadora','calc'],
  ['recetas','Las 50 galletas','recetas'],
  ['insumos','Insumos','insumos'],
  ['plan','Plan y compras','plan'],
  ['prod','Producción','prod'],
  ['ventas','Ventas','ventas'],
  ['negocio','Mi negocio','negocio'],
  ['datos','Mis datos','datos']
];
let current='tablero';
function buildNav(){
  document.getElementById('nav').innerHTML = VIEWS.map(([id,lbl,ic])=>
    `<button class="navbtn${id===current?' on':''}" data-go="${id}">${ICONS[ic]}<span>${lbl}</span></button>`).join('');
}
function go(id){ current=id; buildNav(); render(); window.scrollTo({top:0,behavior:'instant'}); }
document.addEventListener('click',e=>{ const b=e.target.closest('[data-go]'); if(b){ e.preventDefault(); go(b.dataset.go); } });

/* =========================================================
   VISTA · TABLERO
   ========================================================= */
function vTablero(){
  const mes = DB.mes || todayISO().slice(0,7);
  const ven = DB.ventas.filter(v=>v.fecha.slice(0,7)===mes);
  const pro = DB.prod.filter(p=>p.fecha.slice(0,7)===mes);
  const ingreso = ven.reduce((s,v)=>s+v.piezas*v.precio,0);
  const piezas  = ven.reduce((s,v)=>s+(+v.piezas||0),0);
  const costo   = ven.reduce((s,v)=>s+v.piezas*costoTotalDe(v.n),0);
  const utilidad= ingreso-costo;
  const buenas  = pro.reduce((s,p)=>s+(+p.buenas||0),0);
  const fallas  = pro.reduce((s,p)=>s+(+p.fallas||0),0);
  const mermaPct= (buenas+fallas)>0 ? fallas/(buenas+fallas) : 0;
  const mermaMXN= pro.reduce((s,p)=>s+(+p.fallas||0)*costoTotalDe(p.n),0);
  const eq = equilibrio();
  const avance = eq.piezas>0 ? piezas/eq.piezas : 0;

  const porCanal = SEED.canales.map(c=>{
    const f=ven.filter(v=>v.canal===c);
    return {c, piezas:f.reduce((s,v)=>s+v.piezas,0), ingreso:f.reduce((s,v)=>s+v.piezas*v.precio,0)};
  }).filter(x=>x.piezas>0).sort((a,b)=>b.ingreso-a.ingreso);
  const maxCanal = Math.max(1,...porCanal.map(x=>x.ingreso));

  const porRec={};
  ven.forEach(v=>{ const o=porRec[v.n]=porRec[v.n]||{n:v.n,piezas:0,ingreso:0,util:0};
    o.piezas+=v.piezas; o.ingreso+=v.piezas*v.precio;
    o.util+=v.piezas*(v.precio-costoTotalDe(v.n)); });
  const top = Object.values(porRec).sort((a,b)=>b.util-a.util).slice(0,6);

  const mesNom = new Date(mes+'-02').toLocaleDateString('es-MX',{month:'long',year:'numeric'});

  return `
  <div class="page-head">
    <div>
      <div class="eyebrow">Endulcora · Estudio Gastronómico</div>
      <h1 class="title">Tablero de ${esc(mesNom)}</h1>
      <p class="sub">Todo lo que registres en Producción y Ventas se resume aquí. Cambia el mes para ver otro periodo.</p>
    </div>
    <div style="min-width:170px"><label class="f">Mes que analizas</label><input type="month" id="mesSel" value="${mes}"></div>
  </div>

  <div class="grid g4">
    <div class="kpi dark"><div class="k-l">Ingreso del mes</div><div class="k-v">${money0(ingreso)}</div><div class="k-n">${num(piezas)} galletas vendidas</div></div>
    <div class="kpi"><div class="k-l">Utilidad bruta</div><div class="k-v" style="color:${utilidad>=0?'var(--good)':'var(--danger)'}">${money0(utilidad)}</div><div class="k-n">Margen ${pct(ingreso>0?utilidad/ingreso:0)}</div></div>
    <div class="kpi"><div class="k-l">Precio promedio</div><div class="k-v">${money0(piezas>0?ingreso/piezas:0)}</div><div class="k-n">por galleta vendida</div></div>
    <div class="kpi"><div class="k-l">Merma del mes</div><div class="k-v" style="color:${mermaPct>DB.params.merma?'var(--ember)':'var(--deep)'}">${pct(mermaPct)}</div><div class="k-n">${money0(mermaMXN)} perdidos · ${num(fallas)} piezas</div></div>
  </div>

  <div class="card" style="margin-top:16px">
    <h3>Punto de equilibrio del mes</h3>
    <div style="display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:9px">
      <div><span style="font-family:'Bebas Neue';font-size:30px;color:var(--deep)">${num(piezas)}</span>
        <span class="mini"> de ${num(eq.piezas)} galletas necesarias este mes</span></div>
      <div class="mini">Gastos fijos ${money0(eq.gf)} · margen de contribución ${money(eq.mc)}/pieza</div>
    </div>
    <div class="bar"><i style="width:${Math.min(100,avance*100).toFixed(1)}%"></i></div>
    <p class="mini" style="margin:9px 0 0">${
      avance>=1 ? '✔ Ya cubriste tus gastos fijos. Cada galleta extra es ganancia real.'
                : 'Te faltan <b>'+num(Math.max(0,eq.piezas-piezas))+'</b> galletas para cubrir los gastos fijos del mes.'}</p>
  </div>

  <div class="grid g2" style="margin-top:16px">
    <div class="card">
      <h3>Ventas por canal</h3>
      ${porCanal.length? porCanal.map(x=>`
        <div style="margin-bottom:11px">
          <div style="display:flex;justify-content:space-between;font-size:12.5px;margin-bottom:4px">
            <span>${esc(x.c)}</span><span style="font-variant-numeric:tabular-nums">${money0(x.ingreso)} <span class="mini">· ${num(x.piezas)} pz</span></span>
          </div>
          <div class="bar"><i style="width:${(x.ingreso/maxCanal*100).toFixed(1)}%"></i></div>
        </div>`).join('')
      : `<div class="empty"><b>Aún no hay ventas de este mes</b>Registra tu primera venta y este bloque cobra vida.<br><br><button class="btn sm" data-go="ventas">Registrar una venta</button></div>`}
    </div>
    <div class="card">
      <h3>Galletas más rentables del mes</h3>
      ${top.length? `<div class="tw"><table class="slim"><thead><tr><th>Receta</th><th class="num">Pz</th><th class="num">Utilidad</th></tr></thead><tbody>
        ${top.map(t=>`<tr><td style="font-size:12.5px">${esc((recByN[t.n]||{}).nom||'')}<div class="mini">${money0(t.ingreso)} de ingreso</div></td><td class="num">${num(t.piezas)}</td><td class="num" style="color:${t.util>=0?'var(--good)':'var(--danger)'}">${money0(t.util)}</td></tr>`).join('')}
      </tbody></table></div>`
      : `<div class="empty"><b>Sin datos todavía</b>Aquí verás qué galletas te dejan más dinero, no solo cuáles vendes más.</div>`}

function cookieSVG(c){

  const tot=segs.reduce((s,x)=>s+x[1],0)||1;

  let y=CY+R, out='';
  segs.forEach(([nm,v,col])=>{
    const h=v/tot*H; y-=h;

    <g class="steam b" opacity=".45"><path d="M95 24c6-7 0-11 4-17" stroke="#A25AA6" stroke-width="3" fill="none" stroke-linecap="round"/></g>
    <g class="steam c" opacity=".45"><path d="M118 30c6-7 0-11 4-17" stroke="#A25AA6" stroke-width="3" fill="none" stroke-linecap="round"/></g>
    <ellipse cx="${CX}" cy="${CY+R+6}" rx="${R*.82}" ry="7" fill="rgba(78,20,84,.10)"/>
    <g clip-path="url(#ck)">${out}
      ${chunks.map(([x,y,r])=>`<circle cx="${x}" cy="${y}" r="${r}" fill="rgba(255,255,255,.20)"/>`).join('')}
    </g>
    <circle cx="${CX}" cy="${CY}" r="${R}" fill="none" stroke="rgba(78,20,84,.28)" stroke-width="2" stroke-dasharray="1 0"/>
    ${chunks.slice(0,4).map(([x,y,r])=>`<circle cx="${x}" cy="${y}" r="${r*.45}" fill="#F8B818" opacity=".85"/>`).join('')}
  </svg>`;
}

function planRows(){
  return DB.recetas.filter(r=>(+DB.plan[r.n]||0)>0).map(r=>{
    const c=calc(r.n), lotes=+DB.plan[r.n]||0, pz=lotes*(+r.lote||0);
    return {n:r.n, nom:r.nom, lotes, pz, costo:pz*c.total, ingreso:pz*c.menudeo.pvp, util:pz*c.menudeo.util};
  });
}
function listaCompras(){
  const req={};
  Object.keys(DB.plan).forEach(n=>{
    const lotes=+DB.plan[n]||0; if(lotes<=0) return;
    (linByRec[n]||[]).forEach(l=>{ req[l.ins]=(req[l.ins]||0)+(+l.cant||0)*lotes; });
  });
  return Object.keys(req).map(nom=>{
    const i=insByName[nom]||{pres:0,precio:0,u:'',cat:'',presTxt:''};
    const cantidad=req[nom];
    const paquetes=(i.pres>0)?Math.ceil(cantidad/i.pres):0;
    return {nom, cat:i.cat, u:i.u, presTxt:i.presTxt, pres:i.pres, cantidad, paquetes,
      inversion:paquetes*i.precio, consumido:cantidad*costoUnidad(i)};
  }).sort((a,b)=>b.inversion-a.inversion);
}

function sugerirLote(){
  const d=new Date(); const p='G-'+String(d.getFullYear()).slice(2)+String(d.getMonth()+1).padStart(2,'0')+'-';
  const n=DB.prod.filter(x=>(x.lote||'').startsWith(p)).length+1;
  return p+String(n).padStart(2,'0');
}
function hookProd(){
  const S=id=>document.getElementById(id);
  S('pAdd').onclick=()=>{
    const buenas=+S('pBuen').value||0, fallas=+S('pFall').value||0;
    if(buenas+fallas<=0){ toast('Escribe cuántas galletas salieron buenas o falladas.'); S('pBuen').focus(); return; }
    DB.prod.push({id:Date.now(), fecha:S('pFecha').value||todayISO(), lote:S('pLote').value, n:+S('pRec').value,

    save(); toast('Horneada guardada'); render();
  };
  document.querySelectorAll('[data-delp]').forEach(b=>b.onclick=()=>{ DB.prod=DB.prod.filter(x=>x.id!=b.dataset.delp); save(); toast('Registro eliminado'); render(); });

  if(aj) aj.onclick=()=>{ const b=DB.prod.reduce((s,p)=>s+p.buenas,0), f=DB.prod.reduce((s,p)=>s+p.fallas,0);
    DB.params.merma=Math.round(f/(b+f)*1000)/1000; DB.recetas.forEach(r=>r.merma=null); save(); toast('Merma actualizada en las 50 recetas'); render(); };
}

      <h3>Precios y márgenes</h3>
      <div class="field"><label class="f">Margen deseado en MENUDEO · <span style="color:var(--purple)">${pct(P.mMenudeo)}</span></label>
        <input type="range" min="10" max="85" step="1" id="nMMen" value="${Math.round(P.mMenudeo*100)}"></div>
      <div class="field"><label class="f">Margen deseado en MAYOREO · <span style="color:var(--purple)">${pct(P.mMayoreo)}</span></label>
        <input type="range" min="5" max="70" step="1" id="nMMay" value="${Math.round(P.mMayoreo*100)}"></div>
      <div class="row">
        <div class="field"><label class="f">Redondear precios al múltiplo de</label><input type="number" min="0" step="1" id="nRed" value="${P.redondeo}"></div>
        <div class="field"><label class="f">IVA (solo si facturas) %</label><input type="number" min="0" max="100" step="1" id="nIVA" value="${Math.round(P.iva*100)}"></div>
      </div>
      <div class="note" style="margin-top:6px"><b>Ojo:</b> el margen no es lo mismo que el sobreprecio. Un margen de ${pct(P.mMenudeo)} significa que de cada peso que cobras, ${pct(P.mMenudeo)} es utilidad — el precio sale de dividir el costo entre (1 − margen), no de multiplicarlo.</div>
    </div>
  </div>

  <div class="card">
    <h3>Desglose de tus gastos fijos</h3>
    ${DB.gf.map((l,i)=>`<div class="row" style="margin-bottom:7px;align-items:center">
      <input value="${esc(l.nom)}" data-gfn="${i}" style="flex:2;min-width:150px;font-size:13px;padding:7px 9px">
      <input type="number" min="0" step="50" value="${l.monto}" data-gfm="${i}" style="max-width:110px;text-align:right;font-size:13px;padding:7px 9px">
      <button class="x" data-gfd="${i}" title="Quitar">✕</button></div>`).join('')}
    <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;margin-top:12px;padding-top:12px;border-top:1.5px solid var(--line)">
      <button class="btn sm ghost" id="gfAdd">+ Agregar gasto</button>
      <div><span class="mini">Suma del desglose</span> <b style="font-family:'Bebas Neue';font-size:24px;color:var(--deep);margin-left:6px">${money0(sug)}</b>
      ${Math.abs(sug-P.gastosFijos)>1?`<button class="btn sm gold" id="gfUse" style="margin-left:10px">Usar ${money0(sug)} como gasto fijo</button>`:''}</div>
    </div>
  </div>

  <div class="card">
    <h3>Punto de equilibrio</h3>
    <div class="grid g4">
      <div><div class="mini">Precio menudeo promedio</div><b style="font-family:'Bebas Neue';font-size:26px;color:var(--deep)">${money0(eq.avgP)}</b></div>
      <div><div class="mini">Costo variable por pieza</div><b style="font-family:'Bebas Neue';font-size:26px;color:var(--deep)">${money(eq.varC)}</b></div>
      <div><div class="mini">Margen de contribución</div><b style="font-family:'Bebas Neue';font-size:26px;color:var(--good)">${money(eq.mc)}</b></div>
      <div><div class="mini">Galletas al mes para no perder</div><b style="font-family:'Bebas Neue';font-size:26px;color:var(--purple)">${num(eq.piezas)}</b></div>
    </div>
    <div class="note">Con ${money0(eq.gf)} de gastos fijos necesitas vender <b>${num(eq.piezas)} galletas al mes</b> (${money0(eq.ingreso)} de ingreso) solo para quedar en ceros. A partir de la galleta ${num(eq.piezas+1)} empiezas a ganar. Eso son <b>${num(Math.ceil(eq.piezas/26))} galletas al día</b> trabajando 26 días.</div>
  </div>`;
}
function hookNegocio(){
  const S=id=>document.getElementById(id);
  const P=DB.params;
  const bind=(id,fn)=>{ const el=S(id); if(el) el.oninput=e=>{ fn(e.target.value); save(); softCalc(); }; };
  bind('nEmp',v=>P.empaque=+v||0); bind('nEne',v=>P.energia=+v||0);
  bind('nHora',v=>P.costoHora=+v||0); bind('nPzH',v=>P.piezasHora=Math.max(1,+v||1));
  bind('nMer',v=>P.merma=(+v||0)/100);
  bind('nGF',v=>P.gastosFijos=+v||0); bind('nPzM',v=>P.piezasMes=Math.max(1,+v||1));
  bind('nMMen',v=>P.mMenudeo=(+v||0)/100); bind('nMMay',v=>P.mMayoreo=(+v||0)/100);
  bind('nRed',v=>P.redondeo=+v||0); bind('nIVA',v=>P.iva=(+v||0)/100);
  document.querySelectorAll('[data-gfn]').forEach(el=>el.oninput=e=>{ DB.gf[+el.dataset.gfn].nom=e.target.value; save(); });
  document.querySelectorAll('[data-gfm]').forEach(el=>el.oninput=e=>{ DB.gf[+el.dataset.gfm].monto=+e.target.value||0; save(); softCalc(); });
  document.querySelectorAll('[data-gfd]').forEach(el=>el.onclick=()=>{ DB.gf.splice(+el.dataset.gfd,1); save(); render(); });
  S('gfAdd').onclick=()=>{ DB.gf.push({nom:'Nuevo gasto',monto:0}); save(); render(); };
  const u=S('gfUse'); if(u) u.onclick=()=>{ P.gastosFijos=gastosTotales(); save(); toast('Gastos fijos actualizados'); render(); };
}

/* =========================================================
   VISTA · MIS DATOS
   ========================================================= */
function vDatos(){
  return `
  <div class="page-head"><div>
    <div class="eyebrow">Respaldo y privacidad</div><h1 class="title">Mis datos</h1>
    <p class="sub">Todo lo que escribes se guarda solo en este dispositivo, dentro de tu navegador. Nada viaja a internet.</p>
  </div></div>

  ${!canPersist?`<div class="note" style="margin:0 0 16px"><b>Estás viendo una vista previa.</b> Para que tus datos se guarden, descarga este archivo a tu computadora o celular y ábrelo desde ahí.</div>`:''}

  <div class="grid g2">
    <div class="card">
      <h3>Respaldar</h3>
      <p class="mini">Descarga un archivo con tus precios, horneadas y ventas. Guárdalo en tu nube o mándatelo por correo: es tu seguro contra borrar el historial del navegador.</p>
      <button class="btn" id="dExp">Descargar respaldo</button>
      <button class="btn ghost" id="dImp">Restaurar respaldo</button>
      <input type="file" id="dFile" accept="application/json" style="display:none">
    </div>
    <div class="card">
      <h3>Exportar a Excel</h3>
      <p class="mini">Baja tus bitácoras en CSV para abrirlas en Excel, Google Sheets o mandárselas a tu contador.</p>
      <button class="btn ghost" id="dCsvV">Ventas (${DB.ventas.length})</button>
      <button class="btn ghost" id="dCsvP">Producción (${DB.prod.length})</button>
      <button class="btn ghost" id="dCsvC">Costos de las 50 galletas</button>
    </div>
  </div>

  <div class="card">
    <h3>Resumen de lo que tienes cargado</h3>
    <div class="grid g4">
      <div><div class="mini">Insumos</div><b style="font-family:'Bebas Neue';font-size:26px;color:var(--deep)">${DB.insumos.length}</b></div>
      <div><div class="mini">Recetas</div><b style="font-family:'Bebas Neue';font-size:26px;color:var(--deep)">${DB.recetas.length}</b></div>
      <div><div class="mini">Horneadas</div><b style="font-family:'Bebas Neue';font-size:26px;color:var(--deep)">${DB.prod.length}</b></div>
      <div><div class="mini">Ventas</div><b style="font-family:'Bebas Neue';font-size:26px;color:var(--deep)">${DB.ventas.length}</b></div>
    </div>
  </div>

  <div class="card">
    <h3>Empezar de nuevo</h3>
    <p class="mini">Vuelve a los precios de referencia y borra tus bitácoras. Esto no se puede deshacer, así que descarga antes un respaldo.</p>
    <button class="btn danger" id="dReset">Restablecer todo</button>
  </div>

  <div class="note"><b>Endulcora · Estudio Gastronómico.</b> Herramienta complementaria del eBook «Galletas Estilo Nueva York» · Colección Oficios Dulces de Endulcora, Volumen II. Recetas: Chef Luis Alfonso Jiménez Cárdenas · Edición: Manuel Ramiro Justo Guzmán · WhatsApp 5665271901. Uso personal del comprador; no se autoriza su reventa ni redistribución.</div>`;
}
function download(name, text, type){
  const b=new Blob([type==='csv'?'\ufeff'+text:text],{type:(type==='csv'?'text/csv':'application/json')+';charset=utf-8'});
  const a=document.createElement('a'); a.href=URL.createObjectURL(b); a.download=name; a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href),1500);
}
const csvCell=v=>`"${String(v??'').replace(/"/g,'""')}"`;
function hookDatos(){
  const S=id=>document.getElementById(id);
  S('dExp').onclick=()=>{ download(`Endulcora_GalletasNY_respaldo_${todayISO()}.json`, JSON.stringify(DB), 'json'); toast('Respaldo descargado'); };
  S('dImp').onclick=()=>S('dFile').click();
  S('dFile').onchange=e=>{
    const f=e.target.files[0]; if(!f) return; const rd=new FileReader();
    rd.onload=()=>{ try{ const o=JSON.parse(rd.result); if(!o.insumos||!o.recetas) throw 0;
      DB=o; if(!DB.plan) DB.plan={}; reindex(); save(); toast('Respaldo restaurado'); render(); }catch(err){ toast('Ese archivo no es un respaldo válido.'); } };
    rd.readAsText(f);
  };
  S('dCsvV').onclick=()=>{
    const h=['Fecha','Galleta','Canal','Piezas','Precio unitario','Ingreso','Costo total','Utilidad','Margen','Cliente/Nota'];
    const rows=DB.ventas.map(v=>{const ing=v.piezas*v.precio,cst=v.piezas*costoTotalDe(v.n);
      return [v.fecha,(recByN[v.n]||{}).nom,v.canal,v.piezas,v.precio,ing.toFixed(2),cst.toFixed(2),(ing-cst).toFixed(2),ing>0?((ing-cst)/ing).toFixed(4):0,v.nota].map(csvCell).join(',');});
    download(`Endulcora_GalletasNY_Ventas_${todayISO()}.csv`,[h.map(csvCell).join(','),...rows].join('\n'),'csv'); toast('CSV de ventas descargado');
  };
  S('dCsvP').onclick=()=>{
    const h=['Fecha','Lote','Galleta','Planeadas','Buenas','Falladas','% merma','Costo merma','Causa','Notas'];
    const rows=DB.prod.map(p=>{const m=(p.buenas+p.fallas)>0?p.fallas/(p.buenas+p.fallas):0;
      return [p.fecha,p.lote,(recByN[p.n]||{}).nom,p.plan,p.buenas,p.fallas,m.toFixed(4),(p.fallas*costoTotalDe(p.n)).toFixed(2),p.causa,p.nota].map(csvCell).join(',');});
    download(`Endulcora_GalletasNY_Produccion_${todayISO()}.csv`,[h.map(csvCell).join(','),...rows].join('\n'),'csv'); toast('CSV de producción descargado');
  };
  S('dCsvC').onclick=()=>{
    const h=['No','Galleta','Linea','Piezas por lote','Insumos lote','Insumos por pieza','Empaque','Energia','Mano de obra','Subtotal','% merma','Costo merma','Overhead','COSTO TOTAL','PRECIO MENUDEO','Utilidad menudeo','Margen real','PRECIO MAYOREO','Utilidad mayoreo','Precio con IVA'];
    const rows=DB.recetas.map(r=>{const c=calc(r.n);
      return [String(r.n), r.nom, r.cap, c.lote, ...[c.insLote,c.ins,c.emp,c.ene,c.mo,c.sub].map(x=>x.toFixed(2)), c.mermaPct.toFixed(3),
        c.mermaCosto.toFixed(2), c.oh.toFixed(2), c.total.toFixed(2), c.menudeo.pvp, c.menudeo.util.toFixed(2), c.menudeo.margen.toFixed(4),
        c.mayoreo.pvp, c.mayoreo.util.toFixed(2), c.iva.toFixed(2)].map(csvCell).join(',');});
    download(`Endulcora_GalletasNY_Costos_${todayISO()}.csv`,[h.map(csvCell).join(','),...rows].join('\n'),'csv'); toast('CSV de costos descargado');
  };
  S('dReset').onclick=()=>{
    openModal(`<h2 style="font-family:'Bebas Neue';font-size:28px;color:var(--deep);margin-bottom:8px">¿Restablecer todo?</h2>
      <p class="mini">Se borrarán tus ${DB.ventas.length} ventas, ${DB.prod.length} horneadas y los precios que hayas cambiado. Volverás a los valores de referencia del libro.</p>
      <div style="display:flex;gap:8px;margin-top:16px"><button class="btn ghost" id="noReset">Cancelar</button>
      <button class="btn danger" id="okReset">Sí, borrar todo</button></div>`);
    document.getElementById('noReset').onclick=closeModal;
    document.getElementById('okReset').onclick=()=>{ DB=freshDB(); reindex(); save(); closeModal(); toast('Todo restablecido'); go('tablero'); };
  };
}

/* =========================================================
   RENDER
   ========================================================= */
function render(){
  const v=document.getElementById('view');
  const map={tablero:vTablero,calc:vCalc,recetas:vRecetas,insumos:vInsumos,plan:vPlan,prod:vProd,ventas:vVentas,negocio:vNegocio,datos:vDatos};
  const hooks={tablero:hookTablero,calc:hookCalc,recetas:hookRecetas,insumos:hookInsumos,plan:hookPlan,prod:hookProd,ventas:hookVentas,negocio:hookNegocio,datos:hookDatos};
  reindex();
  v.innerHTML=map[current]();
  hooks[current]();
}
buildNav(); render();
</script>
