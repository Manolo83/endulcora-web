<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Endulcora · Costos de Barbacoa</title>
<meta name="description" content="Calculadora de costos, merma y precios para un negocio de barbacoa: 50 formulaciones regionales costeadas por kilo de carne cocida y por porción, con el crédito de subproductos, la piedra amortizada y las preparaciones de la casa calculadas desde su propia fórmula. Endulcora · Estudio Gastronómico, en colaboración con Levent.">
<style>
:root{
  --purple:#8C3B18; --deep:#2E1C10; --deep2:#4C2823; --plum:#A9754A; --lilac:#E4D3BC;
  --yellow:#C9982A; --amber:#AD8A18; --gray:#9C9C9C; --cream:#FBF5EC; --cream2:#FEF9F7;
  --ink:#2A1E14; --ink-soft:#6E5B45; --line:rgba(58,29,26,.13); --card:#FFFFFF;
  --danger:#B03A2B; --ember:#C4431A; --good:#4E6B3A;
  --r:18px; --r-sm:12px;
  --sh:0 1px 2px rgba(58,29,26,.06), 0 8px 24px -12px rgba(58,29,26,.28);
  --sh-lg:0 24px 60px -28px rgba(58,29,26,.45);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  font-family:'Poppins',system-ui,-apple-system,'Segoe UI',sans-serif;
  color:var(--ink); background:var(--cream);
  background-image:radial-gradient(1100px 520px at 85% -10%, rgba(201,162,39,.16), transparent 60%),
                   radial-gradient(900px 520px at -10% 0%, rgba(179,48,60,.10), transparent 55%);
  background-attachment:fixed;
  -webkit-font-smoothing:antialiased; font-size:15px; line-height:1.5;
}
h1,h2,h3,h4{margin:0}
button{font-family:inherit}
a{color:var(--purple)}

.shell{display:grid;grid-template-columns:250px 1fr;min-height:100vh}
@media(min-width:901px){.shell{background:linear-gradient(90deg,#2A4055 0 250px,transparent 250px)}}
.shell>*{min-width:0}
.rail{
  background:linear-gradient(180deg,var(--deep) 0%, var(--deep2) 55%, #2A4055 100%);
  color:#fff;padding:20px 14px 26px;position:sticky;top:0;height:100vh;overflow-y:auto;
}
.brand{display:flex;flex-direction:column;gap:10px;padding:6px 8px 18px}
.brand img{width:152px;height:auto;opacity:.97}
.brand .dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--yellow);box-shadow:0 0 10px var(--yellow)}
.brand small{font-weight:600;font-size:9.5px;letter-spacing:.22em;text-transform:uppercase;color:rgba(255,255,255,.62)}
.navlist{display:flex;flex-direction:column;gap:2px;margin-top:4px}
.navbtn{
  display:flex;align-items:center;gap:11px;width:100%;text-align:left;cursor:pointer;
  background:transparent;border:0;color:rgba(255,255,255,.78);padding:10px 12px;border-radius:11px;
  font-size:13.5px;font-weight:400;transition:background .18s,color .18s;
}
.navbtn svg{width:17px;height:17px;flex:none;opacity:.85}
.navbtn:hover{background:rgba(255,255,255,.09);color:#fff}
.navbtn.on{background:rgba(255,255,255,.13);color:#fff;font-weight:500}
.navbtn.on svg{opacity:1;color:var(--yellow)}
.rail-foot{margin-top:22px;padding:12px;border-top:1px solid rgba(255,255,255,.14);font-size:10.5px;color:rgba(255,255,255,.5);line-height:1.6}
.rail-foot b{color:rgba(255,255,255,.78);font-weight:500}

main{padding:26px 30px 90px;max-width:1180px;width:100%;min-width:0}
.page-head{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:14px;margin-bottom:20px}
.eyebrow{font-weight:700;font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--plum);margin-bottom:5px}
h1.title{font-size:34px;line-height:1.06;letter-spacing:-.5px;color:var(--deep);font-weight:600}
.sub{color:var(--ink-soft);font-size:13px;max-width:64ch;margin-top:6px;font-weight:300}

.card{min-width:0;background:var(--card);border-radius:var(--r);box-shadow:var(--sh);padding:20px;border:1px solid rgba(58,29,26,.06)}
.card + .card{margin-top:16px}
.card h3{font-size:11px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--purple);margin-bottom:14px}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
@media(max-width:1000px){.g4{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:640px){.g2,.g3,.g4{grid-template-columns:1fr}}

.kpi{background:var(--card);border-radius:var(--r);padding:16px 18px;box-shadow:var(--sh);border:1px solid rgba(58,29,26,.06);position:relative;overflow:hidden}
.kpi::after{content:'';position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--yellow)}
.kpi .k-l{font-size:9.5px;font-weight:700;letter-spacing:.15em;text-transform:uppercase;color:var(--gray)}
.kpi .k-v{font-size:29px;line-height:1.1;color:var(--deep);margin-top:5px;font-weight:600;letter-spacing:-.5px}
.kpi .k-n{font-size:11px;color:var(--ink-soft);margin-top:2px;font-weight:300}
.kpi.dark{background:linear-gradient(135deg,var(--deep),var(--purple));color:#fff}
.kpi.dark .k-l{color:rgba(255,255,255,.6)} .kpi.dark .k-v{color:#fff} .kpi.dark .k-n{color:rgba(255,255,255,.7)}

label.f{display:block;font-size:9.5px;font-weight:700;letter-spacing:.13em;text-transform:uppercase;color:var(--gray);margin-bottom:5px}
input,select,textarea{
  width:100%;padding:9px 11px;border:1.5px solid var(--line);border-radius:10px;background:var(--cream2);
  font-family:inherit;font-size:14px;color:var(--deep);transition:border-color .15s,background .15s;
}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--purple);background:#fff;box-shadow:0 0 0 3px rgba(179,48,60,.10)}
input[type=range]{padding:0;border:0;background:transparent;accent-color:var(--purple);height:26px}
.field{margin-bottom:12px}
.row{display:flex;gap:10px;flex-wrap:wrap}
.row>.field{flex:1;min-width:120px}
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:7px;cursor:pointer;border:0;border-radius:11px;
  padding:10px 16px;font-weight:700;font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;
  background:var(--purple);color:#fff;transition:transform .12s, box-shadow .18s, background .18s;
  box-shadow:0 6px 16px -8px rgba(179,48,60,.8);
}
.btn:hover{background:var(--deep);transform:translateY(-1px)}
.btn:active{transform:translateY(0)}
.btn.ghost{background:transparent;color:var(--purple);border:1.5px solid var(--line);box-shadow:none}
.btn.ghost:hover{background:rgba(179,48,60,.07);color:var(--deep)}
.btn.gold{background:var(--yellow);color:var(--deep);box-shadow:0 6px 16px -8px rgba(201,162,39,.9)}
.btn.gold:hover{background:var(--amber)}
.btn.sm{padding:7px 11px;font-size:10px;border-radius:9px}
.btn.danger{background:transparent;color:var(--danger);border:1.5px solid rgba(192,57,43,.3);box-shadow:none}
.btn.danger:hover{background:rgba(192,57,43,.08)}
:focus-visible{outline:2.5px solid var(--yellow);outline-offset:2px}

.tw{overflow-x:auto;-webkit-overflow-scrolling:touch;margin:0 -6px;padding:0 6px;max-width:100%}
table{width:100%;border-collapse:collapse;font-size:13px;min-width:520px}
table.slim{min-width:300px}
th{font-size:9px;font-weight:700;letter-spacing:.13em;text-transform:uppercase;color:var(--gray);text-align:left;padding:8px 10px;border-bottom:1.5px solid var(--line);white-space:nowrap}
td{padding:9px 10px;border-bottom:1px solid rgba(58,29,26,.07);vertical-align:middle}
tr:last-child td{border-bottom:0}
tbody tr:hover{background:rgba(251,244,233,.75)}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
.mini{font-size:11.5px;color:var(--ink-soft)}
.pill{display:inline-block;padding:2px 9px;border-radius:99px;font-size:10.5px;font-weight:500;background:rgba(179,48,60,.10);color:var(--purple);white-space:nowrap}
.pill.g{background:rgba(46,125,87,.12);color:var(--good)}
.pill.r{background:rgba(228,87,46,.13);color:var(--ember)}
.pill.y{background:rgba(201,162,39,.20);color:#8a6200}
.x{background:none;border:0;color:var(--gray);cursor:pointer;font-size:16px;line-height:1;padding:4px 6px;border-radius:6px}
.x:hover{color:var(--danger);background:rgba(192,57,43,.08)}
.empty{text-align:center;padding:32px 16px;color:var(--gray);font-size:13px;font-weight:300}
.empty b{display:block;color:var(--ink-soft);font-weight:500;margin-bottom:4px;font-size:14px}

.bowl-wrap{display:grid;grid-template-columns:210px 1fr;gap:22px;align-items:center}
@media(max-width:640px){.bowl-wrap{grid-template-columns:1fr;gap:8px}}
.legend{display:flex;flex-direction:column;gap:1px}
.lg{display:flex;align-items:center;gap:9px;padding:7px 9px;border-radius:9px;transition:background .15s}
.lg:hover{background:var(--cream2)}
.lg .sw{width:11px;height:11px;border-radius:3px;flex:none}
.lg .nm{flex:1;font-size:12.5px}
.lg .vl{font-variant-numeric:tabular-nums;font-size:13px;font-weight:500}
.lg .pc{width:44px;text-align:right;font-size:11px;color:var(--gray);font-variant-numeric:tabular-nums}
.lg.tot{border-top:1.5px solid var(--line);margin-top:5px;padding-top:11px;font-weight:600}
.lg.tot .nm,.lg.tot .vl{font-size:14px;color:var(--deep)}
@keyframes ripple{0%,100%{transform:translateY(0) scale(1);opacity:.9}50%{transform:translateY(-1px) scale(1.03);opacity:1}}
.arilo{transform-origin:center;animation:ripple 3.4s ease-in-out infinite}
@media (prefers-reduced-motion:reduce){.arilo{animation:none}}

.price{border:1.5px solid var(--line);border-radius:var(--r-sm);padding:14px;background:var(--cream2);position:relative;transition:border-color .18s,transform .18s}
.price:hover{border-color:var(--plum);transform:translateY(-2px)}
.price .ch{font-size:9.5px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--purple);min-height:24px}
.price .pv{font-size:32px;line-height:1;color:var(--deep);margin:4px 0 2px;font-weight:600;letter-spacing:-.5px}
.price .ut{font-size:11.5px;color:var(--ink-soft)}
.price .ut b{color:var(--good);font-weight:600}

.note{background:rgba(201,162,39,.13);border-left:3px solid var(--yellow);border-radius:0 10px 10px 0;padding:11px 14px;font-size:12.5px;color:#6b4c00;margin-top:14px;font-weight:300}
.note b{font-weight:600;color:#573d00}
.bar{height:9px;border-radius:99px;background:rgba(58,29,26,.10);overflow:hidden}
.bar>i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--purple),var(--yellow));transition:width .5s ease}
.search{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.search input,.search select{max-width:280px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.chip{border:1.5px solid var(--line);background:#fff;color:var(--ink-soft);border-radius:99px;padding:5px 12px;font-size:11.5px;cursor:pointer;transition:.15s}
.chip:hover{border-color:var(--plum)}
.chip.on{background:var(--deep);color:#fff;border-color:var(--deep)}

.rthumb{width:100%;aspect-ratio:16/9;object-fit:cover;border-radius:var(--r-sm);display:block;
  box-shadow:0 2px 10px -4px rgba(58,29,26,.45)}
.tthumb{width:64px;height:40px;object-fit:cover;border-radius:7px;display:block}
.calc-hero{display:grid;grid-template-columns:260px 1fr;gap:18px;align-items:start}
@media(max-width:760px){.calc-hero{grid-template-columns:1fr}}
.salsa{border:1.5px solid var(--line);border-radius:var(--r-sm);padding:16px;background:#fff;transition:.18s}
.salsa:hover{border-color:var(--plum);transform:translateY(-2px)}
.salsa .sc{font-size:10px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--yellow);background:var(--deep);border-radius:99px;padding:3px 10px;display:inline-block}
.salsa h4{font-size:15px;color:var(--deep);margin:9px 0 4px;font-weight:600}
.salsa p{font-size:12px;color:var(--ink-soft);margin:0 0 10px;font-weight:300;min-height:34px}
.salsa .big{font-size:26px;font-weight:600;color:var(--purple);letter-spacing:-.5px}

#toast{position:fixed;left:50%;bottom:26px;transform:translate(-50%,24px);background:var(--deep);color:#fff;padding:12px 20px;border-radius:12px;font-size:13px;box-shadow:var(--sh-lg);opacity:0;pointer-events:none;transition:.28s;z-index:90;max-width:90vw;text-align:center}
#toast.on{opacity:1;transform:translate(-50%,0)}
.modal{position:fixed;inset:0;background:rgba(42,19,48,.55);display:none;align-items:center;justify-content:center;padding:18px;z-index:80;backdrop-filter:blur(3px)}
.modal.on{display:flex}
.modal .box{background:#fff;border-radius:20px;padding:24px;max-width:560px;width:100%;box-shadow:var(--sh-lg);max-height:88vh;overflow:auto}

@media(max-width:900px){
  .shell{grid-template-columns:1fr}
  .rail{position:sticky;top:0;height:auto;padding:12px 12px 0;z-index:50}
  .brand{flex-direction:row;align-items:center;justify-content:space-between;padding:2px 4px 12px}
  .brand img{width:108px}
  .brand small{display:none}
  .navlist{flex-direction:row;overflow-x:auto;gap:5px;padding-bottom:10px;scrollbar-width:none}
  .navlist::-webkit-scrollbar{display:none}
  .navbtn{flex:none;width:auto;padding:8px 13px;font-size:12.5px;border-radius:99px;background:rgba(255,255,255,.09)}
  .navbtn span{white-space:nowrap}
  .rail-foot{display:none}
  main{padding:18px 16px 70px}
  h1.title{font-size:27px}
  .card{padding:16px}
}
@media print{
  .rail,.btn,.search,.chips{display:none!important}
  body{background:#fff}.card{box-shadow:none;border:1px solid #ddd;break-inside:avoid}
  .shell{grid-template-columns:1fr}
}


.lvblock{margin:14px 6px 4px;background:#F1EFE8;border-radius:12px;padding:10px 12px}
.lvblock span{display:block;font-size:8.5px;font-weight:700;letter-spacing:.2em;color:#D85A30;margin-bottom:6px}
.lvblock img{width:128px;height:auto;display:block}
@media(max-width:900px){.lvblock{display:none}}
.salsa{background:#fff;border:1.5px solid var(--line);border-radius:16px;padding:14px 15px;position:relative}
.salsa .sc{position:absolute;top:12px;right:12px;font-size:10px;font-weight:700;color:var(--purple);letter-spacing:.06em}
.salsa h4{font-size:14px;color:var(--deep);margin:0 0 8px;padding-right:56px;line-height:1.25}
.salsa .big{font-size:22px;font-weight:600;color:var(--deep);line-height:1.1}
.salsa p{font-size:11.5px;color:var(--gray);margin:0;line-height:1.45}
.rthumb{width:210px;flex:0 0 210px;background:#FBF5EC;border-radius:14px;padding:6px;border:1px solid var(--line)}
.rthumb svg{display:block;width:100%;height:auto}
.tthumb{width:74px;background:#FBF5EC;border-radius:8px;padding:2px;border:1px solid var(--line)}
.tthumb svg{display:block;width:100%;height:auto}
@media(max-width:760px){.rthumb{width:100%;flex:1 1 100%}}

ket más accesible."}, {"code": "S", "nom": "Oaxaca, Puebla y Sierra del Sur", "desc": "Valles Centrales, Mixteca, Tierra Caliente y la Montaña de Guerrero. Adobos de chilhuacle, costeño y pasilla oaxaqueño: el bloque de mayor valor percibido y el que mejor justifica un precio de autor."}, {"code": "G", "nom": "Golfo, Huasteca y sureste tropical", "desc": "Veracruz, Tabasco, Yucatán, Campeche y Chiapas. Hoja de plátano, achiote, píib maya y pimienta de Tabasco. Es el bloque de la cocina de fiesta del trópico y el más vistoso en mesa."}, {"code": "O", "nom": "Occidente, Bajío y festivas de autor", "desc": "Jalisco, Michoacán, Guanajuato, Nayarit y Colima. Bote soterrado, birria de pozo y los ensambles monumentales de banquete. Es el bloque de mayor ticket y el que se vende por encargo con anticipo."}], "especies": [{"code": "B", "nom": "Ovino · borrego y carnero", "desc": "La especie canónica de la barbacoa: colágeno abundante, grasa de sabor intenso y rendimiento de canal a carne cocida del 30 al 35 %. Es la más cara por kilo de canal y la que mejor se cobra."}, {"code": "C", "nom": "Caprino · chivo y cabrito", "desc": "Carne magra, fibra corta y olor característico que el adobo y el orégano de cerro domestican. Rinde menos grasa y exige más control de humedad, pero su canal cuesta menos que la ovina."}, {"code": "R", "nom": "Bovino · res, cabeza y cortes", "desc": "El bloque de mayor rendimiento y menor costo por kilo cocido: cabeza, pecho, costillar y chamberete. Es la barbacoa de volumen y la que permite un taco de precio popular."}, {"code": "P", "nom": "Porcino · cerdo y lechón", "desc": "Piel que se vuelve elástica y brillante, grasa dulce y cocción más corta. Rendimiento alto y costo bajo: es la opción de margen más cómodo del recetario."}, {"code": "V", "nom": "Aves y caza", "desc": "Pollo de rancho, pato criollo, venado y jabalí. Cocciones breves, riesgo alto de resecado y mucho valor de novedad: son las fórmulas que diferencian una carta."}, {"code": "M", "nom": "Mixta · dos o tres carnes", "desc": "Ensambles de banquete con dos o tres especies en el mismo pozo, estibadas por densidad de tejido conectivo. Son las fórmulas de mayor ticket y las que más orden de obrador exigen."}], "envolturas": [{"code": "M", "nom": "Maguey", "desc": "Penca de Agave salmiana o cenizo, tatemada hasta volverse flexible. Aporta el aroma de agave cocido que define la barbacoa del Altiplano y es la envoltura más caudalosa en savia y la más caro por horneada."}, {"code": "P", "nom": "Hoja de plátano", "desc": "Musa paradisiaca soasada al comal. Impermeable, neutra y elástica: da el perfil del trópico y del píib maya, y cuesta una fracción de lo que cuesta el maguey."}, {"code": "A", "nom": "Hoja de aguacate y hierba", "desc": "Persea drymifolia y hierbas de monte en lugar de una envoltura estructural. Perfume anisado intenso, costo mínimo y riesgo de fuga de vapor: exige un cierre textil impecable."}, {"code": "O", "nom": "Olla, bote o vaporera", "desc": "Recipiente cerrado soterrado o al fuego: barro, bote de acero, lata o vaporera. Cero pérdida de jugo, cero aroma vegetal y la mejor opción urbana. El recipiente se amortiza entre sus usos."}, {"code": "X", "nom": "Mixta y de partición", "desc": "Dos o tres envolturas conviviendo en el mismo pozo, una por carne o una por capa. Es lo que hacen los ensambles de banquete y lo que más orden de estibado pide."}], "bases": [{"code": "B-1", "nom": "Pasta de adobo rojo de chiles secos", "ins": "Pasta de adobo rojo de chiles secos (elaborada)", "rend": 1000, "u": "g", "rec": 102, "uso": "El adobo madre de la casa: guajillo y ancho hidratados, molidos con ajo asado, comino, clavo y vinagre. Es la base de las veintitantas fórmulas adobadas del libro. Preparado en lote de un kilo, rinde para tres horneadas y se congela en bolsas planas de 250 g."}, {"code": "B-2", "nom": "Salsa borracha al pulque", "ins": "Salsa borracha al pulque (elaborada)", "rend": 1000, "u": "ml", "rec": 103, "uso": "La salsa de mesa del Altiplano: pasilla frito en manteca, molido en molcajete con pulque fresco, coronada con queso de canasto y cebolla. No se puede hacer de víspera —el pulque sigue fermentando— así que se costea por litro y se prepara la mañana del servicio."}, {"code": "B-3", "nom": "Salsa de mesa de molcajete", "ins": "Salsa de mesa de molcajete (elaborada)", "rend": 1000, "u": "ml", "rec": 104, "uso": "La salsa cruda o tatemada de todos los días: tomate verde, chile serrano, ajo y cilantro al molcajete. Es el acompañamiento obligado de cualquier taco de barbacoa y el rubro que más se subestima al cotizar un banquete: un litro rinde apenas veinte porciones."}], "deriv": {"Pasta de adobo rojo de chiles secos (elaborada)": "B-1", "Salsa borracha al pulque (elaborada)": "B-2", "Salsa de mesa de molcajete (elaborada)": "B-3"}, "params": {"margenes": {"taqueria": 0.42, "kilo": 0.34, "banquete": 0.46, "mayoreo": 0.22}, "mermaDefault": 0.08, "redondeo": 5, "credito": 0.35, "reuso": 40}, "gf": {"lineas": [{"nom": "Renta del terreno, local o puesto", "monto": 9500}, {"nom": "Luz, agua y refrigeración", "monto": 2800}, {"nom": "Gas para comal, cazo y tortilla", "monto": 1400}, {"nom": "Permisos sanitarios, licencia y uso de suelo", "monto": 1600}, {"nom": "Transporte, flete y compra en rastro", "monto": 3200}, {"nom": "Publicidad, redes y contenido", "monto": 1800}, {"nom": "Mantenimiento del pozo, cazos y rejillas", "monto": 1300}, {"nom": "Depreciación (pozo, encamisado, cazo de cobre, palas, básculas)", "monto": 2400}, {"nom": "Hielo, cámara y conservación", "monto": 1200}, {"nom": "Otros gastos fijos", "monto": 800}], "piezasMes": 900, "piezasTanda": 1, "sueldo": 22000, "horas": 200}, "canales": [{"k": "taqueria", "nom": "Taquería y puesto de fin de semana", "rango": "38 – 46 %"}, {"k": "kilo", "nom": "Venta por kilo para llevar", "rango": "30 – 38 %"}, {"k": "banquete", "nom": "Banquete y evento por encargo", "rango": "42 – 50 %"}, {"k": "mayoreo", "nom": "Mayoreo a taquerías y c <script>/* =========================================================
   Endulcora · Calculadora de Barbacoa
   Motor de cálculo espejo del Anexo 1 (Excel). No editar fórmulas sin editar el Excel.
   ========================================================= */
const KEY='endulcora_barbacoa_v1';
let mem=null, canPersist=true;
const store={
  read(){ try{ const s=localStorage.getItem(KEY); return s?JSON.parse(s):null }catch(e){ canPersist=false; return mem } },
  write(o){ try{ localStorage.setItem(KEY,JSON.stringify(o)) }catch(e){ canPersist=false; mem=o } }
};
const clone=o=>JSON.parse(JSON.stringify(o));
function freshDB(){
  return { v:1, insumos:clone(SEED.insumos), recetas:SEED.recetas.map(r=>({...r,merma:null})),
    bloques:clone(SEED.bloques), especies:clone(SEED.especies), envolturas:clone(SEED.envolturas), bases:clone(SEED.bases), params:clone(SEED.params), gf:clone(SEED.gf), prod:[], ventas:[], mes:new Date().toISOString().slice(0,7) };
}
let DB=store.read()||freshDB();
if(!DB.recetas||DB.recetas.length!==SEED.recetas.length||!DB.bloques||!DB.bases||!DB.especies){ const d=freshDB(); d.prod=DB.prod||[]; d.ventas=DB.ventas||[]; DB=d; }
const save=()=>store.write(DB);

const LIN=SEED.lineas, DERIV=SEED.deriv;
const insByName={}, linByRec={}, recByN={}, bloByCode={}, espByCode={}, envByCode={}, baseByIns={};
LIN.forEach(l=>{ (linByRec[l.n]=linByRec[l.n]||[]).push(l) });
function reindex(){
  Object.keys(insByName).forEach(k=>delete insByName[k]); DB.insumos.forEach(i=>insByName[i.nom]=i);
  Object.keys(recByN).forEach(k=>delete recByN[k]); DB.recetas.forEach(r=>recByN[r.n]=r);
  Object.keys(bloByCode).forEach(k=>delete bloByCode[k]); DB.bloques.forEach(x=>bloByCode[x.code]=x);
  Object.keys(espByCode).forEach(k=>delete espByCode[k]); DB.especies.forEach(x=>espByCode[x.code]=x);
  Object.keys(envByCode).forEach(k=>delete envByCode[k]); DB.envolturas.forEach(x=>envByCode[x.code]=x);
  Object.keys(baseByIns).forEach(k=>delete baseByIns[k]); DB.bases.forEach(x=>baseByIns[x.ins]=x);
}
reindex();

const nf=new Intl.NumberFormat('es-MX',{style:'currency',currency:'MXN',minimumFractionDigits:2});
const nf0=new Intl.NumberFormat('es-MX',{style:'currency',currency:'MXN',maximumFractionDigits:0});
const money=v=>nf.format(isFinite(v)?v:0), money0=v=>nf0.format(isFinite(v)?v:0);
const pct=v=>((isFinite(v)?v:0)*100).toFixed(1).replace('.0','')+'%';
const num=v=>new Intl.NumberFormat('es-MX').format(isFinite(v)?v:0);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const todayISO=()=>new Date().toISOString().slice(0,10);
const CLASES=[['carne','Carne, canal y quinto cuarto'],['adobo','Salazón, adobo y marinado'],['consome','Cazo colector y consomé'],['envoltura','Envoltura vegetal y textil'],['lena','Leña y carbón'],['piedra','Piedra y equipo (amortizados)'],['servicio','Salsas, guarnición y servicio']];
const uni=r=>r.unidad;

/* ---------- motor ---------- */
function loteReceta(n){ return (linByRec[n]||[]).reduce((s,l)=>s+(+l.cant||0)*costoUnidadBase(insByName[l.ins]),0); }
function costoUnidadBase(ins){ return (ins&&ins.pres>0)?ins.precio/ins.pres:0 }
/* Las preparaciones de la casa no se compran: su costo sale de su propia fórmula. */
function loteBase(b,_st){ const st=(_st||[]).concat([b.ins]);
  return (linByRec[b.rec]||[]).reduce((s,l)=>s+(+l.cant||0)*costoUnidad(insByName[l.ins],st),0); }
function costoUnidad(ins,_st){ if(!ins) return 0; const b=baseByIns[ins.nom];
  if(b){ if((_st||[]).indexOf(ins.nom)>=0) return 0; const rd=+b.rend||0; return rd>0?loteBase(b,_st)/rd:0; }
  return costoUnidadBase(ins); }
const gastosTotales=()=>DB.gf.lineas.reduce((s,l)=>s+(+l.monto||0),0);
const overhead=()=>DB.gf.piezasMes>0?gastosTotales()/DB.gf.piezasMes:0;
const credito=()=>Math.min(0.9,Math.max(0,+DB.params.credito||0));
const reuso=()=>Math.max(1,+DB.params.reuso||1);
const costoHora=()=>DB.gf.horas>0?DB.gf.sueldo/DB.gf.horas:0;
const CANALES=SEED.canales;
const canalKey=nom=>(CANALES.find(c=>c.nom===nom)||{k:CANALES[0].k}).k;
const ceilN=(x,n)=>Math.ceil(Math.round(x/n*1e6)/1e6)*n;
function calc(n){
  const r=recByN[n]; if(!r) return null;
  const pz=Math.max(0.1,+r.piezas||1);
  const comp={carne:0,adobo:0,consome:0,envoltura:0,lena:0,piedra:0,servicio:0}, ru=reuso();
  (linByRec[n]||[]).forEach(l=>{ const f=(l.clase==='piedra')?(1/ru):1;
    comp[l.clase]+=(+l.cant||0)*costoUnidad(insByName[l.ins])*f });
  const lote=CLASES.reduce((s,[cl])=>s+comp[cl],0);
  const cred=credito();
  const ins=lote/pz*(1-cred);
  const minU=(+r.minFijo||0)/pz+(+r.minPieza||0);
  const emp=+r.empaque||0, ene=+r.energia||0, mo=costoHora()*minU/60, oh=overhead();
  const base=ins+emp+ene+mo+oh;
  const merma=(r.merma==null?DB.params.mermaDefault:r.merma);
  const total=merma<1?base/(1-merma):base;
  const red=Math.max(1,+DB.params.redondeo||1);
  const precios={};
  CANALES.forEach(c=>{ const m=DB.params.margenes[c.k]; const pvp=m<1?ceilN(total/(1-m),red):0;
    precios[c.k]={pvp,util:pvp-total,margen:pvp>0?(pvp-total)/pvp:0}; });
  const cj=Math.max(0.1,+r.porciones||1);
  return {n,nom:r.nom,comp,lote,ins,emp,ene,mo,oh,base,merma,mermaCosto:total-base,total,pz,minU,precios,cj,pc:total/cj,cred};
}
const costoTotalDe=n=>(calc(n)||{total:0}).total;
function equilibrio(){
  const cs=DB.recetas.map(r=>calc(r.n));
  const avgP=cs.reduce((s,c)=>s+c.precios[CANALES[0].k].pvp,0)/cs.length;
  const avgC=cs.reduce((s,c)=>s+c.total,0)/cs.length;
  const mc=avgP-avgC, gf=gastosTotales();
  return {avgP,avgC,mc,gf,piezas:mc>0?Math.ceil(gf/mc):0};
}
window.__engine={calc,equilibrio,loteReceta,costoUnidad,loteBase,credito,reuso,insByName,DB:()=>DB};

/* ========== TABLERO ========== */
function vTablero(){
  const mes=DB.mes||todayISO().slice(0,7);
  const ven=DB.ventas.filter(v=>v.fecha.slice(0,7)===mes), pro=DB.prod.filter(p=>p.fecha.slice(0,7)===mes);
  const ingreso=ven.reduce((s,v)=>s+v.piezas*v.precio,0), piezas=ven.reduce((s,v)=>s+(+v.piezas||0),0);
  const costo=ven.reduce((s,v)=>s+v.piezas*costoTotalDe(v.n),0), comis=ven.reduce((s,v)=>s+v.piezas*v.precio*(+v.comision||0),0);
  const utilidad=ingreso-costo-comis;
  const buenas=pro.reduce((s,p)=>s+(+p.buenas||0),0), fallas=pro.reduce((s,p)=>s+(+p.fallas||0),0);
  const mermaPct=(buenas+fallas)>0?fallas/(buenas+fallas):0, mermaMXN=pro.reduce((s,p)=>s+(+p.fallas||0)*costoTotalDe(p.n),0);
  const eq=equilibrio(), gf=gastosTotales();
  const mcReal=piezas>0?(ingreso-costo-comis)/piezas:0;
  const pe=mcReal>0?Math.ceil(gf/mcReal):eq.piezas, avance=pe>0?piezas/pe:0;

let calcN=1, precioManual=null;
function segsDe(c){ const k=(1-c.cred)/c.pz; return [
  ['Carne, canal y quinto cuarto',c.comp.carne*k,'#9C4B34'],['Salazón, adobo y marinado',c.comp.adobo*k,'#8C3B18'],
  ['Cazo colector y consomé',c.comp.consome*k,'#C9982A'],['Envoltura vegetal y textil',c.comp.envoltura*k,'#6E8B4A'],
  ['Leña y carbón',c.comp.lena*k,'#6B4A2E'],['Piedra y equipo (amortizados)',c.comp.piedra*k,'#8E94A0'],
  ['Salsas, guarnición y servicio',c.comp.servicio*k,'#A9754A'],['Empaque y servicio',c.emp,'#E4D3BC'],
  ['Agua, hielo y limpieza',c.ene,'#B9A88C'],['Mano de obra',c.mo,'#2E1C10'],['Gastos fijos',c.oh,'#9C9C9C'],
  ['Costo de la merma',c.mermaCosto,'#EDE0CE']]; }
function panSVG(c){
  const segs=segsDe(c).filter(s=>s[1]>0.0001), tot=segs.reduce((s,x)=>s+x[1],0)||1;
  const CX=100, CY=112, R=62; let acc=0, out='';
  segs.forEach(([nm,v,col])=>{ const r0=R*Math.sqrt(acc/tot); acc+=v; const r1=R*Math.sqrt(acc/tot);
    out+=`<circle cx="${CX}" cy="${CY}" r="${((r0+r1)/2).toFixed(2)}" fill="none" stroke="${col}" stroke-width="${Math.max(r1-r0,.8).toFixed(2)}"/>`; });
  return `<svg viewBox="0 0 200 200" width="100%" style="max-width:250px;display:block;margin:0 auto" role="img" aria-label="Composición del costo por kilo">
   ${out}
   <circle cx="${CX}" cy="${CY}" r="${R}" fill="none" stroke="rgba(58,29,26,.55)" stroke-width="2.6"/>
   <ellipse cx="${CX}" cy="${CY+R+9}" rx="${R}" ry="5" fill="rgba(58,29,26,.10)"/>
   <text x="100" y="26" text-anchor="middle" font-family="Poppins,sans-serif" font-size="11" fill="#8C3B18" font-weight="600">Costo por kilo</text>
  </svg>`;
}

   ${rows.map(v=>{const ing=v.piezas*v.precio, cst=v.piezas*costoTotalDe(v.n), com=ing*(+v.comision||0), ut=ing-cst-com; return `<tr><td class="mini">${esc(v.fecha)}</td><td style="max-width:230px;font-size:12.5px">${esc((recByN[v.n]||{}).nom||'')}${v.nota?`<div class="mini">${esc(v.nota)}</div>`:''}</td><td><span class="pill">${esc(v.canal)}</span></td><td class="num">${num(v.piezas)}</td><td class="num">${money0(v.precio)}</td><td class="num">${money0(ing)}</td><td class="num" style="color:${ut>=0?'var(--good)':'var(--danger)'}">${money(ut)}</td><td class="num"><span class="pill ${ut/ing>=0.4?'g':(ut<=0?'r':'y')}">${pct(ing>0?ut/ing:0)}</span></td><td><button class="x" data-delv="${v.id}" title="Eliminar">✕</button></td></tr>`}).join('')}</tbody></table></div>`:`<div class="empty"><b>Todavía no hay ventas</b>Registra la primera arriba, o entra a la calculadora y usa «Vender a este precio».</div>`}</div>`;
}
function hookVentas(){
  const S=id=>document.getElementById(id);
  function prev(){ const n=+S('vRec').value, pz=+S('vPz').value||0, pr=+S('vPrecio').value||0, cm=(+S('vCom').value||0)/100, ing=pz*pr, cst=pz*costoTotalDe(n), com=ing*cm, ut=ing-cst-com;
    S('vPrev').innerHTML=pr>0?`Ingreso ${money(ing)} − costo ${money(cst)} − comisión ${money(com)} = <b style="color:${ut>=0?'var(--good)':'var(--danger)'}">utilidad neta ${money(ut)}</b> (${pct(ing>0?ut/ing:0)})`:''; }
  ['vRec','vPz','vPrecio','vCom','vCanal'].forEach(id=>S(id).oninput=prev);
  S('vSug').onclick=()=>{ const k=canalKey(S('vCanal').value); S('vPrecio').value=calc(+S('vRec').value).precios[k].pvp; prev(); };
  S('vAdd').onclick=()=>{ const pz=+S('vPz').value||0, pr=+S('vPrecio').value||0;
    if(pz<=0||pr<=0){ toast('Escribe cuántos kilos vendiste y a qué precio.'); S('vPrecio').focus(); return; }
    DB.ventas.push({id:Date.now(),fecha:S('vFecha').value||todayISO(),n:+S('vRec').value,canal:S('vCanal').value,piezas:pz,precio:pr,comision:(+S('vCom').value||0)/100,nota:S('vNota').value});
    save(); toast('Venta guardada'); render(); };
  document.querySelectorAll('[data-delv]').forEach(b=>b.onclick=()=>{ DB.ventas=DB.ventas.filter(x=>x.id!=b.dataset.delv); save(); toast('Venta eliminada'); render(); });
  prev();
}

/* ========== MI NEGOCIO ========== */
function vNegocio(){
  const eq=equilibrio();
  return `<div class="page-head"><div><div class="eyebrow">Supuestos que mueven todo</div><h1 class="title">Mi negocio</h1>
   <p class="sub">De aquí salen los gastos fijos por kilo y el costo de tu hora de trabajo. Si estos números están mal, todos tus precios están mal.</p></div></div>
  <div class="grid g3"><div class="kpi"><div class="k-l">Gastos fijos al mes</div><div class="k-v">${money0(gastosTotales())}</div></div>
   <div class="kpi"><div class="k-l">Gastos fijos por kilo</div><div class="k-v">${money(overhead())}</div><div class="k-n">${num(DB.gf.piezasMes)} kg al mes</div></div>
   <div class="kpi"><div class="k-l">Tu hora de trabajo</div><div class="k-v">${money(costoHora())}</div><div class="k-n">${money0(DB.gf.sueldo)} ÷ ${num(DB.gf.horas)} h</div></div></div>
  <div class="grid g2" style="margin-top:16px">
   <div class="card"><h3>Gastos fijos mensuales</h3>${DB.gf.lineas.map((l,i)=>`<div class="row" style="margin-bottom:7px;align-items:center"><input value="${esc(l.nom)}" data-gfn="${i}" style="flex:2;min-width:150px;font-size:13px;padding:7px 9px"><input type="number" min="0" step="50" value="${l.monto}" data-gfm="${i}" style="max-width:110px;text-align:right;font-size:13px;padding:7px 9px"><button class="x" data-gfd="${i}" title="Quitar">✕</button></div>`).join('')}
    <div style="display:flex;justify-content:space-between;align-items:center;margin-top:12px;padding-top:12px;border-top:1.5px solid var(--line)"><button class="btn sm ghost" id="gfAdd">+ Agregar gasto</button><div><span class="mini">Total</span> <b style="font-size:22px;color:var(--deep);margin-left:6px">${money0(gastosTotales())}</b></div></div></div>
   <div class="card"><h3>Trabajo y volumen</h3>
    <div class="field"><label class="f">Kilos de carne cocida que vendes al mes</label><input type="number" min="1" id="gPz" value="${DB.gf.piezasMes}"></div>
    <div class="field"><label class="f">Horneadas de vida útil de la piedra</label><input type="number" min="1" step="5" id="gTanda" value="${DB.params.reuso}"></div>
    <div class="field"><label class="f">% crédito de subproductos <span style="color:var(--purple)">${pct(credito())}</span></label><input type="range" min="0" max="60" step="5" id="gCred" value="${Math.round(credito()*100)}"></div>
    <div class="field"><label class="f">Sueldo mensual que quieres cobrarte</label><input type="number" min="0" step="500" id="gSu" value="${DB.gf.sueldo}"></div>
    <div class="field"><label class="f">Horas de trabajo al mes</label><input type="number" min="1" id="gHo" value="${DB.gf.horas}"></div>
    <div class="field"><label class="f">Redondeo de precios (pesos)</label><input type="number" min="1" step="1" id="gRd" value="${DB.params.redondeo}"></div>
    <div class="field"><label class="f">% de merma por defecto <span style="color:var(--purple)">${pct(DB.params.mermaDefault)}</span></label><input type="range" min="0" max="30" step="1" id="gMe" value="${Math.round(DB.params.mermaDefault*100)}"></div>
    <h3 style="margin-top:22px">Márgenes objetivo por canal</h3>${CANALES.map(c=>`<div class="field"><label class="f">${c.nom} · <span style="color:var(--purple)">${pct(DB.params.margenes[c.k])}</span> <span style="color:var(--gray);font-weight:500">(libro: ${c.rango})</span></label><input type="range" min="10" max="85" step="1" value="${Math.round(DB.params.margenes[c.k]*100)}" data-mg="${c.k}"></div>`).join('')}</div></div>
  <div class="card"><h3>Punto de equilibrio del recetario</h3><div class="grid g4">
   <div><div class="mini">Precio promedio de carta</div><b style="font-size:24px;color:var(--deep)">${money(eq.avgP)}</b></div>
   <div><div class="mini">Costo total promedio</div><b style="font-size:24px;color:var(--deep)">${money(eq.avgC)}</b></div>
   <div><div class="mini">Margen de contribución</div><b style="font-size:24px;color:var(--good)">${money(eq.mc)}</b></div>
   <div><div class="mini">Kilos al mes para no perder</div><b style="font-size:24px;color:var(--purple)">${num(eq.piezas)}</b></div></div>
   <div class="note">Este número usa el promedio de las 50 fórmulas, que van del borrego a la cabeza de res. En cuanto registres ventas reales,
   el Tablero calcula tu punto de equilibrio con <b>tu</b> margen, que es el que manda. El costo de cada kilo ya carga ${money(overhead())} de gastos fijos repartidos entre ${num(DB.gf.piezasMes)} kilos al mes.</div></div>`;
}
function hookNegocio(){
  const S=id=>document.getElementById(id);
  document.querySelectorAll('[data-gfn]').forEach(el=>el.oninput=e=>{ DB.gf.lineas[+el.dataset.gfn].nom=e.target.value; save(); });
  document.querySelectorAll('[data-gfm]').forEach(el=>el.oninput=e=>{ DB.gf.lineas[+el.dataset.gfm].monto=+e.target.value||0; save(); softCalc(); });
  document.querySelectorAll('[data-gfd]').forEach(el=>el.onclick=()=>{ DB.gf.lineas.splice(+el.dataset.gfd,1); save(); render(); });
  S('gfAdd').onclick=()=>{ DB.gf.lineas.push({nom:'Nuevo gasto',monto:0}); save(); render(); };
  S('gPz').oninput=e=>{ DB.gf.piezasMes=+e.target.value||1; save(); softCalc(); };
  if(S('gTanda')) S('gTanda').oninput=e=>{ DB.params.reuso=Math.max(1,+e.target.value||1); save(); softCalc(); };
  if(S('gCred')) S('gCred').oninput=e=>{ DB.params.credito=(+e.target.value||0)/100; save(); softCalc(); };
  S('gSu').oninput=e=>{ DB.gf.sueldo=+e.target.value||0; save(); softCalc(); };
  S('gHo').oninput=e=>{ DB.gf.horas=+e.target.value||1; save(); softCalc(); };
  S('gRd').oninput=e=>{ DB.params.redondeo=Math.max(1,+e.target.value||1); save(); softCalc(); };
  S('gMe').oninput=e=>{ DB.params.mermaDefault=(+e.target.value||0)/100; DB.recetas.forEach(r=>r.merma=null); save(); softCalc(); };
  document.querySelectorAll('[data-mg]').forEach(el=>el.oninput=e=>{ DB.params.margenes[el.dataset.mg]=(+e.target.value||0)/100; save(); softCalc(); });
}

/* ========== MIS DATOS ========== */
function vDatos(){
  return `<div class="page-head"><div><div class="eyebrow">Respaldo y privacidad</div><h1 class="title">Mis datos</h1>
   <p class="sub">Todo lo que escribes se guarda sólo en este dispositivo, dentro de tu navegador. Nada viaja a internet.</p></div></div>
  ${!canPersist?`<div class="note" style="margin:0 0 16px"><b>Estás viendo una vista previa.</b> Para que tus datos se guarden, descarga este archivo a tu computadora o celular y ábrelo desde ahí.</div>`:''}
  <div class="grid g2"><div class="card"><h3>Respaldar</h3><p class="mini">Descarga un archivo con tus precios, lotes y ventas. Guárdalo en tu nube o mándatelo por correo: es tu seguro contra borrar el historial del navegador.</p>
    <button class="btn" id="dExp">Descargar respaldo</button> <button class="btn ghost" id="dImp">Restaurar respaldo</button><input type="file" id="dFile" accept="application/json" style="display:none"></div>
   <div class="card"><h3>Exportar a Excel</h3><p class="mini">Baja tus bitácoras en CSV para abrirlas en Excel, Google Sheets o mandárselas a tu contador.</p>
    <button class="btn ghost" id="dCsvV">Ventas (${DB.ventas.length})</button> <button class="btn ghost" id="dCsvP">Horneadas (${DB.prod.length})</button> <button class="btn ghost" id="dCsvC">Costos de las 50 fórmulas</button> <button class="btn ghost" id="dCsvB">Costo de las preparaciones</button></div></div>
  <div class="card"><h3>Resumen de lo que tienes cargado</h3><div class="grid g4"><div><div class="mini">Insumos</div><b style="font-size:24px;color:var(--deep)">${DB.insumos.length}</b></div><div><div class="mini">Recetas</div><b style="font-size:24px;color:var(--deep)">${DB.recetas.length}</b></div><div><div class="mini">Horneadas</div><b style="font-size:24px;color:var(--deep)">${DB.prod.length}</b></div><div><div class="mini">Ventas</div><b style="font-size:24px;color:var(--deep)">${DB.ventas.length}</b></div></div></div>
  <div class="card"><h3>Empezar de nuevo</h3><p class="mini">Vuelve a los precios de referencia y borra tus bitácoras. Esto no se puede deshacer: descarga antes un respaldo.</p><button class="btn danger" id="dReset">Restablecer todo</button></div>
  <div class="note"><b>Endulcora · Estudio Gastronómico, en colaboración con Levent.</b> Herramienta complementaria del eBook «Barbacoa: Hornos de Tierra, Envolturas Botánicas, Consomé Subterráneo y 50 Formulaciones Regionales». Contenido: Chef Luis Alfonso Jiménez Cárdenas · Edición: Manuel Ramiro Justo Guzmán · WhatsApp 56 6527 1901. Uso personal del comprador; no se autoriza su reventa ni redistribución. Costos y precios ilustrativos hasta que captures tus propios precios.</div>`;
}
function download(name,text,type){ const b=new Blob([type==='csv'?'\ufeff'+text:text],{type:(type==='csv'?'text/csv':'application/json')+';charset=utf-8'}); const a=document.createElement('a'); a.href=URL.createObjectURL(b); a.download=name; a.click(); setTimeout(()=>URL.revokeObjectURL(a.href),1500); }
const csvCell=v=>`"${String(v??'').replace(/"/g,'""')}"`;
function hookDatos(){
  const S=id=>document.getElementById(id);
  S('dExp').onclick=()=>{ download(`Endulcora_Barbacoa_respaldo_${todayISO()}.json`,JSON.stringify(DB),'json'); toast('Respaldo descargado'); };
  S('dImp').onclick=()=>S('dFile').click();
  S('dFile').onchange=e=>{ const f=e.target.files[0]; if(!f) return; const rd=new FileReader(); rd.onload=()=>{ try{ const o=JSON.parse(rd.result); if(!o.insumos||!o.recetas) throw 0; DB=o; if(!DB.bases) DB.bases=clone(SEED.bases); if(!DB.bloques) DB.bloques=clone(SEED.bloques);
        if(!DB.especies) DB.especies=clone(SEED.especies); if(!DB.envolturas) DB.envolturas=clone(SEED.envolturas); reindex(); save(); toast('Respaldo restaurado'); render(); }catch(err){ toast('Ese archivo no es un respaldo válido.'); } }; rd.readAsText(f); };
  S('dCsvV').onclick=()=>{ const h=['Fecha','Receta','Canal','Piezas','Precio unitario','Ingreso','Costo total','Comision','Utilidad neta','Margen','Cliente/Nota'];
    const rows=DB.ventas.map(v=>{const ing=v.piezas*v.precio,cst=v.piezas*costoTotalDe(v.n),com=ing*(+v.comision||0); return [v.fecha,(recByN[v.n]||{}).nom,v.canal,v.piezas,v.precio,ing,cst.toFixed(2),com.toFixed(2),(ing-cst-com).toFixed(2),ing>0?((ing-cst-com)/ing).toFixed(4):0,v.nota].map(csvCell).join(',');});
    download(`Endulcora_Barbacoa_Ventas_${todayISO()}.csv`,[h.map(csvCell).join(','),...rows].join('\n'),'csv'); toast('CSV de ventas descargado'); };
  S('dCsvP').onclick=()=>{ const h=['Fecha','Horneada','Formula','Kg esperados','Kg vendibles','Kg perdidos','% merma','Costo merma','Causa','Notas'];
    const rows=DB.prod.map(p=>{const m=(p.buenas+p.fallas)>0?p.fallas/(p.buenas+p.fallas):0; return [p.fecha,p.lote,(recByN[p.n]||{}).nom,p.plan,p.buenas,p.fallas,m.toFixed(4),(p.fallas*costoTotalDe(p.n)).toFixed(2),p.causa,p.nota].map(csvCell).join(',');});
    download(`Endulcora_Barbacoa_Horneadas_${todayISO()}.csv`,[h.map(csvCell).join(','),...rows].join('\n'),'csv'); toast('CSV de producción descargado'); };
  S('dCsvC').onclick=()=>{ const h=['No','Formula','Capitulo','Bloque','Especie','Envoltura','Unidad','Kilos que rinde','Porciones por kilo','Carne','Adobo','Consome','Envoltura','Lena','Piedra','Servicio','Insumos/kg','Empaque','Agua y limpieza','Mano de obra','Gastos fijos','Costo base','% merma','Costo total','Costo de la porcion',...CANALES.map(c=>'PVP '+c.nom)];
    const rows=DB.recetas.map(r=>{const c=calc(r.n); return [String(r.n),r.nom,r.cap,r.blo,r.esp,r.env,r.unidad,c.pz,c.cj,...[c.comp.carne,c.comp.adobo,c.comp.consome,c.comp.envoltura,c.comp.lena,c.comp.piedra,c.comp.servicio,c.ins,c.emp,c.ene,c.mo,c.oh,c.base].map(x=>x.toFixed(2)),c.merma.toFixed(3),c.total.toFixed(2),c.pc.toFixed(2),...CANALES.map(x=>c.precios[x.k].pvp)].map(csvCell).join(',');});
    download(`Endulcora_Barbacoa_Costos_${todayISO()}.csv`,[h.map(csvCell).join(','),...rows].join('\n'),'csv'); toast('CSV de costos descargado'); };
  S('dCsvB').onclick=()=>{ const h=['Codigo','Preparacion','Para que sirve','Rendimiento','Unidad','Costo del lote','Costo unitario','Costo por kilo'];
    const rows=DB.bases.map(f=>{const l=loteBase(f), rd=Math.max(0.0001,+f.rend||0); return [f.code,f.nom,f.uso,f.rend,f.u,l.toFixed(2),(l/rd).toFixed(4),(l/rd*1000).toFixed(2)].map(csvCell).join(',');});
    download(`Endulcora_Barbacoa_Preparaciones_${todayISO()}.csv`,[h.map(csvCell).join(','),...rows].join('\n'),'csv'); toast('CSV de preparaciones descargado'); };
  S('dReset').onclick=()=>{ openModal(`<h2 style="font-size:24px;color:var(--deep);margin-bottom:8px;font-weight:600">¿Restablecer todo?</h2><p class="mini">Se borrarán tus ${DB.ventas.length} ventas, ${DB.prod.length} horneadas y los precios que hayas cambiado. Volverás a los valores de referencia del libro.</p><div style="display:flex;gap:8px;margin-top:16px"><button class="btn ghost" id="noReset">Cancelar</button><button class="btn danger" id="okReset">Sí, borrar todo</button></div>`);
    document.getElementById('noReset').onclick=closeModal; document.getElementById('okReset').onclick=()=>{ DB=freshDB(); reindex(); save(); closeModal(); toast('Todo restablecido'); go('tablero'); }; };
}

/* ---------- RENDER ---------- */
function render(){
  const v=document.getElementById('view');
  const map={tablero:vTablero,calc:vCalc,bases:vBases,recetas:vRecetas,insumos:vInsumos,prod:vProd,ventas:vVentas,negocio:vNegocio,datos:vDatos};
  const hooks={tablero:hookTablero,calc:hookCalc,bases:hookBases,recetas:hookRecetas,insumos:hookInsumos,prod:hookProd,ventas:hookVentas,negocio:hookNegocio,datos:hookDatos};
  v.innerHTML=map[current](); reindex(); hooks[current]();
}
buildNav(); render();
</script></body></html>
